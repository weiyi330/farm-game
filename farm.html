<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>桃源田居</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#2d1a0e;
  font-family: 'STKaiti','KaiTi','楷体', serif;
  overflow:hidden; touch-action:none;
  user-select:none;
}
canvas { display:block; }

/* HUD */
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 14px;
  background:linear-gradient(180deg,rgba(45,26,14,0.95),rgba(45,26,14,0));
  pointer-events:none; z-index:10;
}
.hud-coin {
  display:flex; align-items:center; gap:6px;
  background:rgba(180,120,30,0.2); border:1px solid #c8922a;
  border-radius:20px; padding:5px 14px;
  font-size:16px; color:#f5d78e; letter-spacing:1px;
}
.hud-day {
  font-size:14px; color:#d4a96a; letter-spacing:2px;
}
.hud-season {
  font-size:13px; color:#a8c878; letter-spacing:1px;
}

/* 工具栏 */
#toolbar {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; justify-content:center; gap:8px;
  padding:10px 16px 20px;
  background:linear-gradient(0deg,rgba(45,26,14,0.98),rgba(45,26,14,0));
  z-index:10;
}
.tool-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:rgba(180,130,50,0.15); border:1.5px solid #8a6530;
  border-radius:12px; padding:8px 14px; cursor:pointer;
  transition:all 0.15s; min-width:56px;
}
.tool-btn.active {
  background:rgba(200,160,60,0.35); border-color:#e8b84a;
  box-shadow:0 0 12px rgba(232,184,74,0.4);
}
.tool-btn:active { transform:scale(0.93); }
.tool-icon { font-size:22px; }
.tool-name { font-size:10px; color:#c8a060; letter-spacing:1px; }
.tool-btn.active .tool-name { color:#f5d78e; }

/* 信息弹窗 */
#toast {
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  background:rgba(60,35,10,0.92); border:1px solid #c8922a;
  border-radius:20px; padding:8px 20px;
  font-size:14px; color:#f5d78e; letter-spacing:1px;
  z-index:20; pointer-events:none;
  opacity:0; transition:opacity 0.3s;
  white-space:nowrap;
}
#toast.show { opacity:1; }

/* 商店 */
#shop {
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(20,10,5,0.85); z-index:30;
  display:flex; align-items:center; justify-content:center;
  display:none;
}
.shop-panel {
  background:linear-gradient(160deg,#3d2010,#2a1508);
  border:2px solid #c8922a; border-radius:20px;
  padding:20px; width:320px; max-height:80vh; overflow-y:auto;
}
.shop-title {
  text-align:center; font-size:20px; color:#f5d78e;
  letter-spacing:4px; margin-bottom:16px;
  border-bottom:1px solid #8a6530; padding-bottom:10px;
}
.shop-section { margin-bottom:14px; }
.shop-section-title { font-size:12px; color:#a08040; letter-spacing:2px; margin-bottom:8px; }
.shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.shop-item {
  background:rgba(180,130,50,0.1); border:1px solid #6a4a20;
  border-radius:10px; padding:10px 8px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; transition:all 0.15s;
}
.shop-item:active { transform:scale(0.95); background:rgba(200,160,60,0.25); }
.shop-item-icon { font-size:24px; }
.shop-item-name { font-size:12px; color:#d4a060; }
.shop-item-price { font-size:11px; color:#f5d78e; }
.shop-item-desc { font-size:10px; color:#886640; text-align:center; }
.shop-close {
  width:100%; margin-top:14px; padding:10px;
  background:rgba(180,80,30,0.3); border:1px solid #c06030;
  border-radius:10px; color:#f0a070; font-size:15px;
  cursor:pointer; font-family:inherit; letter-spacing:2px;
}
.shop-close:active { transform:scale(0.97); }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-coin">🪙 <span id="coinVal">50</span></div>
  <div class="hud-day">第 <span id="dayVal">1</span> 天</div>
  <div class="hud-season" id="seasonVal">🌸 春季</div>
</div>

<div id="toolbar">
  <div class="tool-btn active" data-tool="hoe" onclick="selectTool(this,'hoe')">
    <span class="tool-icon">⛏️</span><span class="tool-name">锄地</span>
  </div>
  <div class="tool-btn" data-tool="seed" onclick="selectTool(this,'seed')">
    <span class="tool-icon">🌱</span><span class="tool-name">播种</span>
  </div>
  <div class="tool-btn" data-tool="water" onclick="selectTool(this,'water')">
    <span class="tool-icon">💧</span><span class="tool-name">浇水</span>
  </div>
  <div class="tool-btn" data-tool="harvest" onclick="selectTool(this,'harvest')">
    <span class="tool-icon">🌾</span><span class="tool-name">收获</span>
  </div>
  <div class="tool-btn" data-tool="shop" onclick="openShop()">
    <span class="tool-icon">🏪</span><span class="tool-name">商店</span>
  </div>
  <div class="tool-btn" data-tool="sleep" onclick="nextDay()">
    <span class="tool-icon">🌙</span><span class="tool-name">入睡</span>
  </div>
</div>

<div id="toast"></div>

<!-- 商店 -->
<div id="shop">
  <div class="shop-panel">
    <div class="shop-title">📜 桃源杂货铺</div>

    <div class="shop-section">
      <div class="shop-section-title">── 种子 ──</div>
      <div class="shop-grid">
        <div class="shop-item" onclick="buySeed('wheat')">
          <span class="shop-item-icon">🌾</span>
          <span class="shop-item-name">小麦种</span>
          <span class="shop-item-price">🪙 5枚</span>
          <span class="shop-item-desc">3天成熟·售10枚</span>
        </div>
        <div class="shop-item" onclick="buySeed('carrot')">
          <span class="shop-item-icon">🥕</span>
          <span class="shop-item-name">萝卜种</span>
          <span class="shop-item-price">🪙 8枚</span>
          <span class="shop-item-desc">4天成熟·售18枚</span>
        </div>
        <div class="shop-item" onclick="buySeed('cabbage')">
          <span class="shop-item-icon">🥬</span>
          <span class="shop-item-name">白菜种</span>
          <span class="shop-item-price">🪙 12枚</span>
          <span class="shop-item-desc">5天成熟·售30枚</span>
        </div>
        <div class="shop-item" onclick="buySeed('peach')">
          <span class="shop-item-icon">🍑</span>
          <span class="shop-item-name">桃树苗</span>
          <span class="shop-item-price">🪙 30枚</span>
          <span class="shop-item-desc">7天成熟·售80枚</span>
        </div>
      </div>
    </div>

    <div class="shop-section">
      <div class="shop-section-title">── 出售农产品 ──</div>
      <div class="shop-grid" id="sellGrid"></div>
    </div>

    <button class="shop-close" onclick="closeShop()">关闭</button>
  </div>
</div>

<script>
// ===================== 配置 =====================
const W = window.innerWidth;
const H = window.innerHeight;
const COLS = 5, ROWS = 4;
const CELL = Math.min(Math.floor((W - 40) / COLS), 72);
const GRID_W = COLS * CELL;
const GRID_H = ROWS * CELL;
const GRID_X = Math.floor((W - GRID_W) / 2);
const GRID_Y = Math.floor((H - GRID_H) / 2) - 20;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// 作物配置
const CROPS = {
  wheat:   { icon:'🌾', name:'小麦', days:3,  seedCost:5,  sellPrice:10, stages:['🌱','🌿','🌾'] },
  carrot:  { icon:'🥕', name:'萝卜', days:4,  seedCost:8,  sellPrice:18, stages:['🌱','🌿','🥕','🥕'] },
  cabbage: { icon:'🥬', name:'白菜', days:5,  seedCost:12, sellPrice:30, stages:['🌱','🌿','🥬','🥬','🥬'] },
  peach:   { icon:'🍑', name:'桃子', days:7,  seedCost:30, sellPrice:80, stages:['🌱','🌿','🌲','🌳','🌳','🌳','🍑'] },
};

const SEASONS = ['🌸 春季','☀️ 夏季','🍂 秋季','❄️ 冬季'];

// ===================== 游戏状态 =====================
let coins = 50;
let day = 1;
let seasonIdx = 0;
let currentTool = 'hoe';
let selectedSeed = 'wheat';
let inventory = {}; // { wheat: 3, carrot: 1 }

// 格子状态
// state: 'empty' | 'tilled' | 'planted' | 'ready'
let grid = [];
for (let r = 0; r < ROWS; r++) {
  grid[r] = [];
  for (let c = 0; c < COLS; c++) {
    grid[r][c] = {
      state: 'empty',
      crop: null,      // 作物类型
      daysGrown: 0,    // 已生长天数
      watered: false,  // 今天是否浇水
    };
  }
}

// ===================== 渲染 =====================
function drawBg() {
  // 大地底色
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#4a7c3f');
  grad.addColorStop(0.4, '#3d6a34');
  grad.addColorStop(1, '#2d5228');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 简单装饰：角落树木
  drawTree(30, 60, 0.7);
  drawTree(W-50, 80, 0.8);
  drawTree(20, H-120, 0.6);
  drawTree(W-40, H-100, 0.7);

  // 小路（从底部延伸到田地）
  ctx.fillStyle = 'rgba(180,140,80,0.25)';
  ctx.beginPath();
  ctx.moveTo(W/2-20, H);
  ctx.lineTo(W/2+20, H);
  ctx.lineTo(GRID_X + GRID_W/2 + 15, GRID_Y + GRID_H + 10);
  ctx.lineTo(GRID_X + GRID_W/2 - 15, GRID_Y + GRID_H + 10);
  ctx.fill();
}

function drawTree(x, y, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // 树干
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(-4, 0, 8, 20);
  // 树冠
  ctx.fillStyle = '#3a7a2a';
  ctx.beginPath();
  ctx.arc(0, -10, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#4a9a3a';
  ctx.beginPath();
  ctx.arc(-5, -18, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -15, 11, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = GRID_X + c * CELL;
      const y = GRID_Y + r * CELL;
      const cell = grid[r][c];

      // 格子底色
      let bgColor;
      if (cell.state === 'empty') {
        bgColor = '#5a8a3a';
      } else if (cell.state === 'tilled') {
        bgColor = cell.watered ? '#5a3a1a' : '#7a5230';
      } else {
        bgColor = cell.watered ? '#5a3a1a' : '#7a5230';
      }

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x+2, y+2, CELL-4, CELL-4, 6);
      ctx.fill();

      // 浇水标记（蓝色光泽）
      if (cell.watered && cell.state !== 'empty') {
        ctx.fillStyle = 'rgba(80,140,220,0.18)';
        ctx.beginPath();
        ctx.roundRect(x+2, y+2, CELL-4, CELL-4, 6);
        ctx.fill();
      }

      // 格子边框
      ctx.strokeStyle = cell.state === 'empty' ? 'rgba(60,100,40,0.4)' : 'rgba(100,70,30,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x+2, y+2, CELL-4, CELL-4, 6);
      ctx.stroke();

      // 作物图标
      if (cell.state === 'planted' || cell.state === 'ready') {
        const crop = CROPS[cell.crop];
        const stageIdx = Math.min(cell.daysGrown, crop.stages.length - 1);
        const emoji = cell.state === 'ready' ? crop.stages[crop.stages.length-1] : crop.stages[stageIdx];
        const fontSize = cell.state === 'ready' ? CELL * 0.48 : CELL * 0.38;
        ctx.font = `${fontSize}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, x + CELL/2, y + CELL/2);

        // 成熟时闪光
        if (cell.state === 'ready') {
          const glow = (Math.sin(Date.now() * 0.004) + 1) * 0.5;
          ctx.strokeStyle = `rgba(255,220,60,${glow * 0.8})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(x+2, y+2, CELL-4, CELL-4, 6);
          ctx.stroke();
        }
      } else if (cell.state === 'tilled') {
        // 翻耕纹路
        ctx.strokeStyle = 'rgba(100,65,25,0.5)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(x + 6, y + i * CELL/3);
          ctx.lineTo(x + CELL - 6, y + i * CELL/3);
          ctx.stroke();
        }
      }

      // 当前工具高亮悬停（触摸后保留一帧）
    }
  }

  // 田地整体边框
  ctx.strokeStyle = 'rgba(180,140,60,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(GRID_X - 4, GRID_Y - 4, GRID_W + 8, GRID_H + 8, 10);
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawGrid();

  // 工具提示
  ctx.fillStyle = 'rgba(245,215,142,0.7)';
  ctx.font = '12px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const toolHint = {
    hoe: '点击空地翻土',
    seed: `播种: ${CROPS[selectedSeed].icon}${CROPS[selectedSeed].name} (已有${inventory[selectedSeed]||0}袋)`,
    water: '点击已种地块浇水',
    harvest: '点击成熟作物收获',
  };
  if (toolHint[currentTool]) {
    ctx.fillText(toolHint[currentTool], W/2, GRID_Y + GRID_H + 14);
  }

  requestAnimationFrame(draw);
}

// ===================== 交互 =====================
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  handleTap(px, py);
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  const px = t.clientX - rect.left;
  const py = t.clientY - rect.top;
  handleTap(px, py);
}, { passive: false });

function handleTap(px, py) {
  // 判断是否点击在格子内
  const c = Math.floor((px - GRID_X) / CELL);
  const r = Math.floor((py - GRID_Y) / CELL);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;

  const cell = grid[r][c];

  if (currentTool === 'hoe') {
    if (cell.state === 'empty') {
      cell.state = 'tilled';
      showToast('翻土完成！');
    } else {
      showToast('已经翻过土啦');
    }
  }
  else if (currentTool === 'seed') {
    if (cell.state !== 'tilled') { showToast('请先翻土再播种'); return; }
    const cnt = inventory[selectedSeed] || 0;
    if (cnt <= 0) { showToast(`没有${CROPS[selectedSeed].name}种子！去商店购买`); return; }
    inventory[selectedSeed]--;
    cell.state = 'planted';
    cell.crop = selectedSeed;
    cell.daysGrown = 0;
    showToast(`种下了${CROPS[selectedSeed].icon}${CROPS[selectedSeed].name}！`);
  }
  else if (currentTool === 'water') {
    if (cell.state === 'empty' || cell.state === 'tilled') { showToast('这里没有作物'); return; }
    if (cell.watered) { showToast('今天已经浇过水了'); return; }
    cell.watered = true;
    showToast('💧 浇水完成！');
  }
  else if (currentTool === 'harvest') {
    if (cell.state !== 'ready') {
      if (cell.state === 'planted') showToast('还没成熟，再等等～');
      else showToast('这里没有可收获的作物');
      return;
    }
    const crop = CROPS[cell.crop];
    coins += crop.sellPrice;
    inventory[crop.icon] = (inventory[crop.icon] || 0) + 1;

    // 实际上直接卖掉，记录到收获品
    if (!inventory['harvest']) inventory['harvest'] = {};
    inventory['harvest'][cell.crop] = (inventory['harvest'][cell.crop] || 0) + 1;

    showToast(`🎉 收获${crop.icon}${crop.name}！+${crop.sellPrice}枚铜钱`);
    updateCoin();

    // 重置格子（保留翻土状态）
    cell.state = 'tilled';
    cell.crop = null;
    cell.daysGrown = 0;
    cell.watered = false;
  }
}

// ===================== 工具选择 =====================
function selectTool(el, tool) {
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentTool = tool;
}

// ===================== 入睡/下一天 =====================
function nextDay() {
  day++;
  if (day > 28) {
    day = 1;
    seasonIdx = (seasonIdx + 1) % 4;
    document.getElementById('seasonVal').textContent = SEASONS[seasonIdx];
  }
  document.getElementById('dayVal').textContent = day;

  // 所有作物生长
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      if (cell.state === 'planted') {
        if (cell.watered) cell.daysGrown++;
        cell.watered = false; // 新的一天重置浇水
        const crop = CROPS[cell.crop];
        if (cell.daysGrown >= crop.days) {
          cell.state = 'ready';
        }
      }
    }
  }

  showToast(`🌙 第${day}天开始了`);
}

// ===================== 商店 =====================
function openShop() {
  updateSellGrid();
  document.getElementById('shop').style.display = 'flex';
}
function closeShop() {
  document.getElementById('shop').style.display = 'none';
}

function buySeed(type) {
  const crop = CROPS[type];
  if (coins < crop.seedCost) { showToast('铜钱不够啦！'); return; }
  coins -= crop.seedCost;
  inventory[type] = (inventory[type] || 0) + 1;
  updateCoin();
  showToast(`购入${crop.icon}${crop.name}种子 🪙-${crop.seedCost}`);
  // 买种子后自动切换到播种工具
  selectedSeed = type;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tool="seed"]').classList.add('active');
  currentTool = 'seed';
  closeShop();
}

function updateSellGrid() {
  const grid_el = document.getElementById('sellGrid');
  const harvests = inventory['harvest'] || {};
  const entries = Object.entries(harvests).filter(([k,v]) => v > 0);
  if (entries.length === 0) {
    grid_el.innerHTML = '<div style="color:#886640;font-size:12px;padding:8px;grid-column:1/-1">暂无农产品</div>';
    return;
  }
  grid_el.innerHTML = entries.map(([type, qty]) => {
    const crop = CROPS[type];
    return `<div class="shop-item" onclick="sellCrop('${type}')">
      <span class="shop-item-icon">${crop.icon}</span>
      <span class="shop-item-name">${crop.name} x${qty}</span>
      <span class="shop-item-price">🪙 ${crop.sellPrice}枚/个</span>
      <span class="shop-item-desc">点击全部出售</span>
    </div>`;
  }).join('');
}

function sellCrop(type) {
  const harvests = inventory['harvest'] || {};
  const qty = harvests[type] || 0;
  if (qty <= 0) return;
  const crop = CROPS[type];
  const earned = qty * crop.sellPrice;
  coins += earned;
  harvests[type] = 0;
  updateCoin();
  showToast(`出售${crop.icon}x${qty} +${earned}枚铜钱！`);
  updateSellGrid();
}

// ===================== 工具函数 =====================
function updateCoin() {
  document.getElementById('coinVal').textContent = coins;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ===================== 启动 =====================
// 给玩家初始种子
inventory['wheat'] = 3;
inventory['carrot'] = 1;

draw();
</script>
</body>
</html>
