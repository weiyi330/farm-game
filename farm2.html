<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>桃源田居</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a0f05;
  font-family:'STKaiti','KaiTi','楷体',serif;
  overflow:hidden; touch-action:none; user-select:none;
}
canvas { display:block; }

/* HUD顶部 */
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 16px;
  background:linear-gradient(180deg,rgba(20,10,3,0.9),transparent);
  pointer-events:none; z-index:10;
}
.hud-coin { display:flex;align-items:center;gap:6px; background:rgba(160,110,20,0.25); border:1px solid #c8922a; border-radius:20px; padding:5px 14px; font-size:15px; color:#f5d78e; }
.hud-info { font-size:13px; color:#c8a060; letter-spacing:1px; text-align:right; }

/* 工具栏 */
#toolbar {
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  display:flex; gap:6px; z-index:10;
  background:rgba(20,10,3,0.7); border:1px solid #6a4a20;
  border-radius:30px; padding:6px 10px;
}
.tool-btn {
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(180,130,50,0.1); border:1px solid #5a3a10;
  border-radius:10px; padding:6px 10px; cursor:pointer; transition:all 0.15s;
}
.tool-btn.active { background:rgba(200,160,60,0.35); border-color:#e8b84a; }
.tool-btn:active { transform:scale(0.92); }
.tool-icon { font-size:18px; }
.tool-name { font-size:9px; color:#b08040; }
.tool-btn.active .tool-name { color:#f5d78e; }

/* 虚拟摇杆 */
#joystick-zone {
  position:fixed; bottom:30px; left:30px;
  width:110px; height:110px; z-index:10;
}
#joystick-base {
  width:110px; height:110px; border-radius:50%;
  background:rgba(180,130,50,0.15); border:2px solid rgba(200,160,60,0.4);
  position:absolute; top:0; left:0;
}
#joystick-stick {
  width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle,rgba(240,190,80,0.7),rgba(180,130,40,0.5));
  border:2px solid rgba(220,170,60,0.6);
  position:absolute;
  top:32px; left:32px;
  pointer-events:none;
  transition:none;
}

/* 行动按钮 */
#action-btn {
  position:fixed; bottom:40px; right:30px;
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle,rgba(100,180,80,0.6),rgba(60,120,40,0.4));
  border:2px solid rgba(120,200,80,0.6);
  display:flex;align-items:center;justify-content:center;
  font-size:26px; z-index:10; cursor:pointer;
}
#action-btn:active { transform:scale(0.92); }

/* Toast */
#toast {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  background:rgba(40,25,8,0.92); border:1px solid #c8922a;
  border-radius:20px; padding:8px 20px;
  font-size:14px; color:#f5d78e; letter-spacing:1px;
  z-index:20; pointer-events:none;
  opacity:0; transition:opacity 0.3s; white-space:nowrap;
}
#toast.show { opacity:1; }

/* 商店面板 */
#shop-panel {
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(10,5,0,0.85); z-index:30;
  display:none; align-items:center; justify-content:center;
}
.shop-box {
  background:linear-gradient(160deg,#3d2010,#251508);
  border:2px solid #c8922a; border-radius:20px;
  padding:20px; width:300px; max-height:75vh; overflow-y:auto;
}
.shop-title { text-align:center; font-size:18px; color:#f5d78e; letter-spacing:3px; margin-bottom:14px; }
.shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.sitem {
  background:rgba(180,130,50,0.1); border:1px solid #6a4a20;
  border-radius:10px; padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;
}
.sitem:active { transform:scale(0.95); }
.sitem-icon { font-size:22px; }
.sitem-name { font-size:11px; color:#d4a060; }
.sitem-price { font-size:11px; color:#f5d78e; }
.sitem-desc { font-size:9px; color:#886640; text-align:center; }
.shop-close {
  width:100%; margin-top:10px; padding:10px;
  background:rgba(140,60,20,0.4); border:1px solid #b06030;
  border-radius:10px; color:#f0a060; font-size:14px;
  cursor:pointer; font-family:inherit; letter-spacing:2px;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-coin">🪙 <span id="coinVal">80</span></div>
  <div class="hud-info">
    第<span id="dayVal">1</span>天 &nbsp;
    <span id="seasonVal">🌸春</span>
  </div>
</div>

<div id="toolbar">
  <div class="tool-btn active" data-tool="hoe" onclick="setTool(this,'hoe')"><span class="tool-icon">⛏️</span><span class="tool-name">锄地</span></div>
  <div class="tool-btn" data-tool="seed" onclick="setTool(this,'seed')"><span class="tool-icon">🌱</span><span class="tool-name">播种</span></div>
  <div class="tool-btn" data-tool="water" onclick="setTool(this,'water')"><span class="tool-icon">💧</span><span class="tool-name">浇水</span></div>
  <div class="tool-btn" data-tool="harvest" onclick="setTool(this,'harvest')"><span class="tool-icon">🌾</span><span class="tool-name">收获</span></div>
  <div class="tool-btn" data-tool="shop" onclick="openShop()"><span class="tool-icon">🏪</span><span class="tool-name">商店</span></div>
  <div class="tool-btn" data-tool="sleep" onclick="nextDay()"><span class="tool-icon">🌙</span><span class="tool-name">入睡</span></div>
</div>

<div id="joystick-zone">
  <div id="joystick-base"></div>
  <div id="joystick-stick"></div>
</div>

<div id="action-btn" onclick="doAction()">✅</div>

<div id="toast"></div>

<div id="shop-panel">
  <div class="shop-box">
    <div class="shop-title">📜 桃源杂货铺</div>
    <div style="font-size:11px;color:#a08040;letter-spacing:2px;margin-bottom:8px">── 种子 ──</div>
    <div class="shop-grid">
      <div class="sitem" onclick="buySeed('wheat')"><span class="sitem-icon">🌾</span><span class="sitem-name">小麦种</span><span class="sitem-price">🪙5枚</span><span class="sitem-desc">3天·售10</span></div>
      <div class="sitem" onclick="buySeed('carrot')"><span class="sitem-icon">🥕</span><span class="sitem-name">萝卜种</span><span class="sitem-price">🪙8枚</span><span class="sitem-desc">4天·售18</span></div>
      <div class="sitem" onclick="buySeed('cabbage')"><span class="sitem-icon">🥬</span><span class="sitem-name">白菜种</span><span class="sitem-price">🪙12枚</span><span class="sitem-desc">5天·售30</span></div>
      <div class="sitem" onclick="buySeed('peach')"><span class="sitem-icon">🍑</span><span class="sitem-name">桃树苗</span><span class="sitem-price">🪙30枚</span><span class="sitem-desc">7天·售80</span></div>
    </div>
    <div style="font-size:11px;color:#a08040;letter-spacing:2px;margin:10px 0 8px">── 出售 ──</div>
    <div class="shop-grid" id="sellGrid"></div>
    <button class="shop-close" onclick="closeShop()">关闭</button>
  </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const W = window.innerWidth, H = window.innerHeight;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// 瓦片尺寸（45°等距）
const TW = 64, TH = 32; // 菱形宽高

// 地图大小
const MAP_COLS = 20, MAP_ROWS = 20;

// 世界原点（屏幕中心偏上）
let camX = 0, camY = 0;

// 作物配置
const CROPS = {
  wheat:   {icon:'🌾',name:'小麦',days:3,cost:5, sell:10,  stages:['🌱','🌿','🌾']},
  carrot:  {icon:'🥕',name:'萝卜',days:4,cost:8, sell:18,  stages:['🌱','🌿','🥕','🥕']},
  cabbage: {icon:'🥬',name:'白菜',days:5,cost:12,sell:30,  stages:['🌱','🌿','🥬','🥬','🥬']},
  peach:   {icon:'🍑',name:'桃子',days:7,cost:30,sell:80,  stages:['🌱','🌿','🌲','🌳','🌳','🌳','🍑']},
};

// 地图瓦片类型
// 0=草地 1=农田空 2=翻土 3=有作物 4=小屋 5=水井 6=商店 7=树 8=路
const TILE_TYPES = {
  GRASS:0, FARMLAND:1, TILLED:2, CROP:3,
  HOUSE:4, WELL:5, SHOP:6, TREE:7, PATH:8
};

// ============================================================
// 地图数据
// ============================================================
let tileMap = [];
let cropMap = []; // 每格作物数据

for(let r=0;r<MAP_ROWS;r++){
  tileMap[r]=[];cropMap[r]=[];
  for(let c=0;c<MAP_COLS;c++){
    tileMap[r][c]=TILE_TYPES.GRASS;
    cropMap[r][c]=null;
  }
}

// 农田区域（5x4块）
const FARM_R=8, FARM_C=8, FARM_ROWS=4, FARM_COLS=5;
for(let r=FARM_R;r<FARM_R+FARM_ROWS;r++)
  for(let c=FARM_C;c<FARM_C+FARM_COLS;c++)
    tileMap[r][c]=TILE_TYPES.FARMLAND;

// 建筑
tileMap[5][5]=TILE_TYPES.HOUSE;
tileMap[6][14]=TILE_TYPES.WELL;
tileMap[14][14]=TILE_TYPES.SHOP;

// 树木装饰
[[3,3],[3,16],[16,3],[16,16],[5,10],[12,5]].forEach(([r,c])=>tileMap[r][c]=TILE_TYPES.TREE);

// 小路（从房屋到农田）
for(let r=6;r<8;r++) tileMap[r][7]=TILE_TYPES.PATH;
for(let c=5;c<8;c++) tileMap[6][c]=TILE_TYPES.PATH;

// ============================================================
// 玩家
// ============================================================
const player = {
  wx: 6.5, wy: 6.5, // 世界坐标（格子单位）
  dir: 'down',       // 朝向
  frame: 0,
  frameTimer: 0,
  moving: false,
};

// ============================================================
// 游戏状态
// ============================================================
let coins = 80, day = 1, seasonIdx = 0;
let currentTool = 'hoe', selectedSeed = 'wheat';
let inventory = {wheat:3, carrot:1};
let harvestBag = {};
const SEASONS = ['🌸春','☀️夏','🍂秋','❄️冬'];

// ============================================================
// 坐标转换（等距投影）
// ============================================================
function worldToScreen(wx, wy) {
  // 等距投影
  const sx = (wx - wy) * TW/2 + W/2 - camX;
  const sy = (wx + wy) * TH/2 + 80 - camY;
  return {x:sx, y:sy};
}

function screenToWorld(sx, sy) {
  const rx = sx - W/2 + camX;
  const ry = sy - 80 + camY;
  const wx = (rx/(TW/2) + ry/(TH/2)) / 2;
  const wy = (ry/(TH/2) - rx/(TW/2)) / 2;
  return {x:wx, y:wy};
}

// ============================================================
// 绘制
// ============================================================
const TILE_COLORS = {
  [TILE_TYPES.GRASS]:    ['#4a7c3f','#5a9048','#3d6834'],
  [TILE_TYPES.FARMLAND]: ['#7a5230','#8a6240','#6a4220'],
  [TILE_TYPES.TILLED]:   ['#5a3a18','#6a4a28','#4a2a08'],
  [TILE_TYPES.PATH]:     ['#b89860','#c8a870','#a08850'],
  [TILE_TYPES.TREE]:     ['#4a7c3f','#4a7c3f','#3d6834'],
};

function drawTile(r, c) {
  const type = tileMap[r][c];
  const {x, y} = worldToScreen(c, r);

  // 剔除屏幕外
  if(x < -TW || x > W+TW || y < -TH*2 || y > H+TH*2) return;

  // 绘制菱形地面
  const colors = TILE_COLORS[type] || ['#4a7c3f','#5a9048','#3d6834'];

  // 顶面
  ctx.fillStyle = colors[0];
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x+TW/2, y+TH/2);
  ctx.lineTo(x, y+TH);
  ctx.lineTo(x-TW/2, y+TH/2);
  ctx.closePath();
  ctx.fill();

  // 左侧面（深色）
  const depth = 10;
  ctx.fillStyle = colors[2];
  ctx.beginPath();
  ctx.moveTo(x-TW/2, y+TH/2);
  ctx.lineTo(x, y+TH);
  ctx.lineTo(x, y+TH+depth);
  ctx.lineTo(x-TW/2, y+TH/2+depth);
  ctx.closePath();
  ctx.fill();

  // 右侧面（稍亮）
  ctx.fillStyle = colors[1];
  ctx.beginPath();
  ctx.moveTo(x, y+TH);
  ctx.lineTo(x+TW/2, y+TH/2);
  ctx.lineTo(x+TW/2, y+TH/2+depth);
  ctx.lineTo(x, y+TH+depth);
  ctx.closePath();
  ctx.fill();

  // 菱形边框
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x+TW/2, y+TH/2);
  ctx.lineTo(x, y+TH);
  ctx.lineTo(x-TW/2, y+TH/2);
  ctx.closePath();
  ctx.stroke();

  // 绘制地块上的物体
  drawTileObject(r, c, x, y);
}

function drawTileObject(r, c, x, y) {
  const type = tileMap[r][c];
  const crop = cropMap[r][c];

  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';

  // 作物
  if(crop) {
    const cfg = CROPS[crop.type];
    const stage = crop.ready ? cfg.stages[cfg.stages.length-1] :
                  cfg.stages[Math.min(crop.daysGrown, cfg.stages.length-1)];
    const sz = crop.ready ? 22 : 18;
    ctx.font = `${sz}px serif`;
    ctx.fillText(stage, x, y + TH/2 - 2);

    if(crop.ready) {
      // 闪光
      const a = (Math.sin(Date.now()*0.005)+1)*0.5*0.6+0.2;
      ctx.strokeStyle = `rgba(255,220,60,${a})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y+2); ctx.lineTo(x+TW/2, y+TH/2);
      ctx.lineTo(x, y+TH); ctx.lineTo(x-TW/2, y+TH/2);
      ctx.closePath(); ctx.stroke();
    }
    if(crop.watered) {
      // 浇水标记
      ctx.font = '10px serif';
      ctx.fillText('💧', x+TW/2-8, y+TH/2+2);
    }
  }

  // 建筑物
  if(type === TILE_TYPES.HOUSE) {
    ctx.font = '32px serif';
    ctx.fillText('🏠', x, y+TH/2-4);
  } else if(type === TILE_TYPES.WELL) {
    ctx.font = '26px serif';
    ctx.fillText('🪣', x, y+TH/2-2);
  } else if(type === TILE_TYPES.SHOP) {
    ctx.font = '28px serif';
    ctx.fillText('🏪', x, y+TH/2-4);
  } else if(type === TILE_TYPES.TREE) {
    ctx.font = '30px serif';
    ctx.fillText('🌳', x, y+TH/2-6);
  }
}

function drawPlayer() {
  const {x, y} = worldToScreen(player.wx, player.wy);
  const moving = player.moving;
  const f = moving ? Math.floor(Date.now()/180)%4 : 0;

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y+TH/2-2, 12, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // 角色（简单像素小人）
  const bobY = moving ? Math.sin(Date.now()*0.015)*2 : 0;
  const py = y + TH/2 - 16 + bobY;

  // 身体颜色
  const bodyColors = ['#e8934a','#d4784a','#c06030','#d4784a'];
  const hatColor = '#8b4513';

  // 帽子
  ctx.fillStyle = hatColor;
  ctx.fillRect(x-7, py-20, 14, 4);
  ctx.fillRect(x-5, py-28, 10, 10);

  // 头
  ctx.fillStyle = '#f5c08a';
  ctx.fillRect(x-6, py-18, 12, 12);

  // 眼睛（根据朝向）
  ctx.fillStyle = '#3a2010';
  if(player.dir==='down'||player.dir==='right') {
    ctx.fillRect(x-3, py-14, 2, 2);
    ctx.fillRect(x+1, py-14, 2, 2);
  } else {
    ctx.fillRect(x-3, py-14, 2, 2);
  }

  // 身体
  ctx.fillStyle = bodyColors[f];
  ctx.fillRect(x-7, py-6, 14, 14);

  // 手臂（摆动）
  const armSwing = moving ? Math.sin(Date.now()*0.015)*4 : 0;
  ctx.fillStyle = '#d4784a';
  ctx.fillRect(x-12, py-5+armSwing, 6, 4);
  ctx.fillRect(x+6, py-5-armSwing, 6, 4);

  // 腿
  const legSwing = moving ? Math.sin(Date.now()*0.015)*3 : 0;
  ctx.fillStyle = '#4a3060';
  ctx.fillRect(x-6, py+8, 5, 8+legSwing);
  ctx.fillRect(x+1, py+8, 5, 8-legSwing);

  // 脚
  ctx.fillStyle = '#2a1a08';
  ctx.fillRect(x-8, py+14+legSwing, 7, 4);
  ctx.fillRect(x+1, py+14-legSwing, 7, 4);

  // 当前工具图标
  const toolIcons = {hoe:'⛏️',seed:'🌱',water:'💧',harvest:'🎋'};
  if(toolIcons[currentTool]) {
    ctx.font = '14px serif';
    ctx.fillText(toolIcons[currentTool], x+12, py-10);
  }

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 天空背景
  const skyGrad = ctx.createLinearGradient(0,0,0,H*0.5);
  skyGrad.addColorStop(0,'#87CEEB');
  skyGrad.addColorStop(1,'#c8e8a0');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);

  // 按深度排序绘制瓦片（等距画法：从后往前）
  for(let r=0;r<MAP_ROWS;r++) {
    for(let c=0;c<MAP_COLS;c++) {
      drawTile(r,c);
    }
  }

  // 绘制玩家（在所有瓦片之后）
  drawPlayer();

  // 高亮玩家所在格子
  const pr = Math.round(player.wy), pc = Math.round(player.wx);
  if(pr>=0&&pr<MAP_ROWS&&pc>=0&&pc<MAP_COLS) {
    const {x,y} = worldToScreen(pc, pr);
    ctx.strokeStyle = 'rgba(255,220,100,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y+2); ctx.lineTo(x+TW/2, y+TH/2);
    ctx.lineTo(x, y+TH); ctx.lineTo(x-TW/2, y+TH/2);
    ctx.closePath(); ctx.stroke();
  }
}

// ============================================================
// 摇杆
// ============================================================
const joyZone = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joystick-stick');
const joyR = 55; // 基座半径
const joyStickR = 23; // 摇杆半径

let joyActive = false;
let joyDX = 0, joyDY = 0;
let joyTouchId = null;

joyZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyActive = true;
  updateJoy(t);
}, {passive:false});

window.addEventListener('touchmove', e => {
  if(!joyActive) return;
  for(let t of e.changedTouches) {
    if(t.identifier === joyTouchId) { updateJoy(t); break; }
  }
}, {passive:false});

window.addEventListener('touchend', e => {
  for(let t of e.changedTouches) {
    if(t.identifier === joyTouchId) {
      joyActive = false; joyDX = 0; joyDY = 0;
      joyStick.style.transform = 'translate(0,0)';
      break;
    }
  }
});

function updateJoy(touch) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + joyR, cy = rect.top + joyR;
  let dx = touch.clientX - cx, dy = touch.clientY - cy;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist > joyR-joyStickR) { dx = dx/dist*(joyR-joyStickR); dy = dy/dist*(joyR-joyStickR); }
  joyDX = dx/(joyR-joyStickR);
  joyDY = dy/(joyR-joyStickR);
  joyStick.style.transform = `translate(${dx}px,${dy}px)`;
}

// ============================================================
// 游戏循环
// ============================================================
let lastTime = 0;
const MOVE_SPEED = 4; // 格/秒

function gameLoop(ts) {
  const dt = Math.min((ts - lastTime)/1000, 0.05);
  lastTime = ts;

  // 移动
  const spd = MOVE_SPEED * dt;
  let moved = false;

  if(joyActive && (Math.abs(joyDX)>0.1 || Math.abs(joyDY)>0.1)) {
    // 等距方向转换
    // 摇杆上=右上(等距)，下=左下，左=左上，右=右下
    const wx = (joyDX - joyDY) * spd * 0.7;  // 等距X
    const wy = (joyDX + joyDY) * spd * 0.7;  // 等距Y

    const nx = player.wx + wx;
    const ny = player.wy + wy;

    // 碰撞检测（简单：不能走出边界和建筑）
    const nc = Math.round(nx), nr = Math.round(ny);
    const blocked = [TILE_TYPES.HOUSE, TILE_TYPES.TREE];
    if(nx>=0&&nx<MAP_COLS&&ny>=0&&ny<MAP_ROWS) {
      const t = tileMap[Math.round(ny)][Math.round(nx)];
      if(!blocked.includes(t)) {
        player.wx = nx; player.wy = ny;
      }
    }

    // 朝向
    if(Math.abs(joyDX)>Math.abs(joyDY)) player.dir = joyDX>0?'right':'left';
    else player.dir = joyDY>0?'down':'up';
    moved = true;
  }

  player.moving = moved;

  // 相机跟随
  const {x:tx, y:ty} = worldToScreen(player.wx, player.wy);
  const tcamX = tx - W/2;
  const tcamY = ty - H/2;
  camX += (tcamX - 0) * 0.12;
  camY += (tcamY - 0) * 0.12;

  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// 行动
// ============================================================
function doAction() {
  const r = Math.round(player.wy), c = Math.round(player.wx);
  if(r<0||r>=MAP_ROWS||c<0||c>=MAP_COLS) return;

  const type = tileMap[r][c];

  // 商店
  if(type === TILE_TYPES.SHOP) { openShop(); return; }

  // 农田操作
  if(currentTool === 'hoe') {
    if(type === TILE_TYPES.FARMLAND) {
      tileMap[r][c] = TILE_TYPES.TILLED;
      showToast('翻土完成 ⛏️');
    } else if(type === TILE_TYPES.TILLED) {
      showToast('已经翻过土了');
    } else { showToast('这里不是农田'); }
  }
  else if(currentTool === 'seed') {
    if(type !== TILE_TYPES.TILLED) { showToast('请先翻土'); return; }
    const cnt = inventory[selectedSeed]||0;
    if(cnt<=0) { showToast(`没有${CROPS[selectedSeed].name}种子！`); return; }
    inventory[selectedSeed]--;
    tileMap[r][c] = TILE_TYPES.CROP;
    cropMap[r][c] = {type:selectedSeed, daysGrown:0, watered:false, ready:false};
    showToast(`种下了${CROPS[selectedSeed].icon}${CROPS[selectedSeed].name}`);
  }
  else if(currentTool === 'water') {
    const crop = cropMap[r][c];
    if(!crop) { showToast('这里没有作物'); return; }
    if(crop.watered) { showToast('今天已经浇过水了 💧'); return; }
    crop.watered = true;
    showToast('浇水完成 💧');
  }
  else if(currentTool === 'harvest') {
    const crop = cropMap[r][c];
    if(!crop || !crop.ready) {
      if(crop && !crop.ready) showToast('还没成熟～再等等');
      else showToast('这里没有可收获的作物');
      return;
    }
    const cfg = CROPS[crop.type];
    coins += cfg.sell;
    harvestBag[crop.type] = (harvestBag[crop.type]||0)+1;
    showToast(`收获${cfg.icon}${cfg.name}！+${cfg.sell}枚铜钱 🎉`);
    updateCoinUI();
    tileMap[r][c] = TILE_TYPES.TILLED;
    cropMap[r][c] = null;
  }
}

// ============================================================
// 工具
// ============================================================
function setTool(el, tool) {
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentTool = tool;
}

// ============================================================
// 入睡/下一天
// ============================================================
function nextDay() {
  day++;
  if(day>28) { day=1; seasonIdx=(seasonIdx+1)%4; }
  document.getElementById('dayVal').textContent = day;
  document.getElementById('seasonVal').textContent = SEASONS[seasonIdx];

  for(let r=0;r<MAP_ROWS;r++) for(let c=0;c<MAP_COLS;c++) {
    const crop = cropMap[r][c];
    if(crop && !crop.ready) {
      if(crop.watered) crop.daysGrown++;
      crop.watered = false;
      if(crop.daysGrown >= CROPS[crop.type].days) crop.ready = true;
    }
  }
  showToast(`🌙 第${day}天开始了`);
}

// ============================================================
// 商店
// ============================================================
function openShop() {
  updateSellGrid();
  document.getElementById('shop-panel').style.display = 'flex';
}
function closeShop() { document.getElementById('shop-panel').style.display = 'none'; }

function buySeed(type) {
  const cfg = CROPS[type];
  if(coins < cfg.cost) { showToast('铜钱不够！'); return; }
  coins -= cfg.cost;
  inventory[type] = (inventory[type]||0)+1;
  selectedSeed = type;
  updateCoinUI();
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-tool="seed"]').classList.add('active');
  currentTool = 'seed';
  showToast(`购入${cfg.icon}${cfg.name}种子 -${cfg.cost}枚`);
  closeShop();
}

function sellCrop(type) {
  const qty = harvestBag[type]||0;
  if(qty<=0) return;
  const earned = qty * CROPS[type].sell;
  coins += earned;
  harvestBag[type] = 0;
  updateCoinUI();
  showToast(`出售${CROPS[type].icon}x${qty} +${earned}枚铜钱！`);
  updateSellGrid();
}

function updateSellGrid() {
  const el = document.getElementById('sellGrid');
  const entries = Object.entries(harvestBag).filter(([k,v])=>v>0);
  if(!entries.length) { el.innerHTML='<div style="color:#886640;font-size:11px;padding:6px;grid-column:1/-1">暂无农产品</div>'; return; }
  el.innerHTML = entries.map(([t,q])=>`<div class="sitem" onclick="sellCrop('${t}')">
    <span class="sitem-icon">${CROPS[t].icon}</span>
    <span class="sitem-name">${CROPS[t].name}x${q}</span>
    <span class="sitem-price">🪙${CROPS[t].sell}/个</span>
    <span class="sitem-desc">点击全部出售</span>
  </div>`).join('');
}

function updateCoinUI() { document.getElementById('coinVal').textContent = coins; }

let toastT = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('show'), 2000);
}

// ============================================================
// 启动
// ============================================================
inventory = {wheat:3, carrot:1};
// 相机初始对准玩家
const {x:ix, y:iy} = worldToScreen(player.wx, player.wy);
camX = ix - W/2; camY = iy - H/2;

requestAnimationFrame(ts => { lastTime = ts; gameLoop(ts); });
</script>
