<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲跑者</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0f;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:100vh;
  font-family: 'Courier New', monospace;
  overflow:hidden; touch-action:none;
}
canvas { display:block; image-rendering:pixelated; }

/* 覆盖层UI */
#ui {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:12px 16px; pointer-events:none; z-index:10;
}
.ui-left, .ui-right { display:flex; flex-direction:column; gap:6px; }

.hp-bar-wrap { display:flex; align-items:center; gap:6px; }
.hp-label { font-size:11px; color:#ff6584; letter-spacing:1px; }
.hp-bar { width:100px; height:8px; background:#2a0a0a; border:1px solid #ff6584; border-radius:2px; overflow:hidden; }
.hp-fill { height:100%; background:linear-gradient(90deg,#ff4444,#ff6584); transition:width 0.3s; border-radius:2px; }

.score-box { font-size:13px; color:#f59e0b; letter-spacing:1px; }
.dist-box { font-size:11px; color:#6c63ff; letter-spacing:1px; }

.phase-box {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); border:1px solid #6c63ff;
  border-radius:20px; padding:8px 20px;
  font-size:13px; color:#a09ff0; letter-spacing:1px;
  pointer-events:none; z-index:10;
  transition:opacity 0.3s;
}

/* 全屏覆盖页 */
.overlay {
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.88);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; z-index:20; padding:24px;
}
.overlay.hidden { display:none; }

.big-title { font-size:28px; color:#6c63ff; letter-spacing:4px; text-shadow:0 0 20px #6c63ff; }
.big-subtitle { font-size:14px; color:#888; text-align:center; line-height:1.8; }
.big-score { font-size:48px; color:#f59e0b; font-weight:900; }
.big-label { font-size:13px; color:#666; letter-spacing:2px; }

.pixel-btn {
  padding:14px 40px; border:none; cursor:pointer;
  background:#6c63ff; color:#fff;
  font-family:'Courier New',monospace; font-size:16px; letter-spacing:2px;
  clip-path:polygon(4px 0%,calc(100% - 4px) 0%,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0% calc(100% - 4px),0% 4px);
  transition:all 0.15s;
}
.pixel-btn:active { transform:scale(0.95); background:#8b5cf6; }
.pixel-btn.red { background:#ff6584; }

.how-to {
  background:#111; border:1px solid #2a2a3e;
  border-radius:12px; padding:16px 20px; width:100%; max-width:320px;
}
.how-to-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:13px; color:#ccc; }
.how-to-row:last-child { margin-bottom:0; }
.how-icon { font-size:20px; min-width:28px; text-align:center; }

/* 像素角色 CSS sprite */
.pixel-char { image-rendering:pixelated; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- UI 覆盖层 -->
<div id="ui">
  <div class="ui-left">
    <div class="hp-bar-wrap">
      <span class="hp-label">HP</span>
      <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
      <span class="hp-label" id="hpText">3/3</span>
    </div>
    <div class="dist-box" id="distBox">距离: 0m</div>
  </div>
  <div class="ui-right">
    <div class="score-box">⭐ <span id="scoreBox">0</span></div>
    <div class="dist-box" id="levelBox">Lv.1</div>
  </div>
</div>

<div class="phase-box" id="phaseBox">准备好了就开始！</div>

<!-- 开始页 -->
<div class="overlay" id="startOverlay">
  <div class="big-title">🏋️ 深蹲跑者</div>
  <div class="big-subtitle">手机平举，跑步前进<br>遇到障碍——深蹲躲过！</div>
  <div class="how-to">
    <div class="how-to-row"><span class="how-icon">🏃</span><span>走动/跑步 → 角色前进</span></div>
    <div class="how-to-row"><span class="how-icon">🚧</span><span>出现障碍物时屏幕闪烁</span></div>
    <div class="how-to-row"><span class="how-icon">🏋️</span><span><strong style="color:#ff6584">深蹲</strong> → 角色躲避障碍</span></div>
    <div class="how-to-row"><span class="how-icon">❤️</span><span>被障碍撞到扣1血，血量为0游戏结束</span></div>
    <div class="how-to-row"><span class="how-icon">📱</span><span>手机握好，<strong style="color:#6c63ff">双臂平举</strong>开始校准</span></div>
  </div>
  <button class="pixel-btn" onclick="startGame()">开始游戏</button>
</div>

<!-- 游戏结束页 -->
<div class="overlay hidden" id="endOverlay">
  <div class="big-title" style="color:#ff6584">GAME OVER</div>
  <div class="big-label">本次得分</div>
  <div class="big-score" id="finalScore">0</div>
  <div class="big-label">跑了 <span id="finalDist">0</span>m · 蹲了 <span id="finalSquat">0</span>次</div>
  <button class="pixel-btn" onclick="restartGame()">再来一次</button>
  <button class="pixel-btn red" onclick="showStart()">返回主页</button>
</div>

<script>
// ===================== 画布设置 =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 420);
const H = window.innerHeight;
canvas.width = W;
canvas.height = H;

// ===================== 像素绘制工具 =====================
const PX = 3; // 像素单位大小

function pixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
}

function drawText(text, x, y, color='#fff', size=8) {
  ctx.fillStyle = color;
  ctx.font = `${size}px 'Courier New'`;
  ctx.fillText(text, x, y);
}

// ===================== 游戏状态 =====================
let gameState = 'start'; // start / calibrating / running / dead
let score = 0;
let distance = 0;
let squatCount = 0;
let hp = 3; const MAX_HP = 3;
let level = 1;
let frameCount = 0;
let lastTime = 0;
let animId = null;

// 玩家
const player = {
  x: W / 2,
  y: H * 0.65,
  w: 18, h: 28,
  state: 'run',     // run / squat / hit
  hitTimer: 0,
  runFrame: 0,
  runFrameTimer: 0,
  squatting: false,
};

// 背景滚动
let bgOffset = 0;
let bgSpeed = 0; // 由步频决定

// 障碍物
let obstacles = [];
let obstacleTimer = 0;
let obstacleInterval = 240; // frames
let warningTimer = 0;
let warningActive = false;

// 粒子
let particles = [];

// ===================== 传感器 =====================
let smoothAcc = 0, baseAcc = null;
let calibSamples = [];
let sensorPhase = 'idle';
let lastSquatTime = 0;
let peakDelta = 0;
let downStartTime = 0;
let stepAcc = 0;  // 步行加速度（用于驱动速度）

const CALIB_N = 20;
const SQUAT_THRESH = 2.8;
const SQUAT_UP = 1.0;
const MIN_PEAK = 3.2;
const MIN_DOWN_MS = 400;
const COOLDOWN_MS = 1200;

function handleMotion(e) {
  if (gameState !== 'calibrating' && gameState !== 'running') return;
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const x = acc.x||0, y = acc.y||0, z = acc.z||0;
  const mag = Math.sqrt(x*x + y*y + z*z);
  smoothAcc = smoothAcc * 0.8 + mag * 0.2;

  // 步行速度：合加速度与基准的偏差越大，说明动作幅度越大
  if (baseAcc !== null) {
    stepAcc = Math.abs(smoothAcc - baseAcc);
  }

  if (baseAcc === null) {
    calibSamples.push(smoothAcc);
    if (calibSamples.length >= CALIB_N) {
      baseAcc = calibSamples.reduce((a,b)=>a+b,0) / CALIB_N;
      gameState = 'running';
      setPhase('🏃 跑起来！遇到障碍记得深蹲！');
    } else {
      setPhase(`🔄 校准中 ${calibSamples.length}/${CALIB_N}，保持平举...`);
    }
    return;
  }

  const delta = smoothAcc - baseAcc;
  const now = Date.now();

  if (sensorPhase === 'idle') {
    if (delta > SQUAT_THRESH && (now - lastSquatTime > COOLDOWN_MS)) {
      sensorPhase = 'down';
      peakDelta = delta;
      downStartTime = now;
    }
  } else if (sensorPhase === 'down') {
    if (delta > peakDelta) peakDelta = delta;
    const dur = now - downStartTime;
    if (delta < SQUAT_UP && peakDelta >= MIN_PEAK && dur >= MIN_DOWN_MS) {
      sensorPhase = 'idle';
      lastSquatTime = now;
      peakDelta = 0;
      onSquat();
    }
    if (dur > 3000) { sensorPhase = 'idle'; peakDelta = 0; }
  }
}

function onSquat() {
  squatCount++;
  player.squatting = true;
  player.state = 'squat';
  setPhase('🏋️ 深蹲！');
  spawnSquatEffect();
  setTimeout(() => {
    player.squatting = false;
    player.state = 'run';
    if (gameState === 'running') setPhase('🏃 继续跑！');
  }, 800);
}

// ===================== 障碍物 =====================
const OBS_TYPES = [
  { name: '石块', color:'#8a7a5a', w:20, h:16, desc:'低障碍', canDuck:true },
  { name: '尖刺', color:'#cc4444', w:14, h:24, desc:'高障碍', canDuck:true },
  { name: '怪物', color:'#44aa44', w:22, h:22, desc:'绿怪', canDuck:true },
];

function spawnObstacle() {
  const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
  const margin = 60;
  const x = margin + Math.random() * (W - margin*2);
  // 从屏幕顶部生成，给玩家充足反应时间
  const obstacleSpeed = 1.2 + level * 0.2; // 速度更慢
  obstacles.push({
    x, y: -40,  // 从屏幕顶部以外生成
    w: type.w, h: type.h,
    color: type.color,
    name: type.name,
    speed: obstacleSpeed,
    hit: false,
    frame: 0,
  });
  // 生成时立刻警告
  warningActive = true;
  warningTimer = Math.floor(H / obstacleSpeed); // 警告持续到障碍到达
}

function updateObstacles() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y += o.speed;
    o.frame++;

    // 到达玩家位置
    if (!o.hit && Math.abs(o.y - player.y) < 20 && Math.abs(o.x - player.x) < (o.w/2 + player.w/2) * 0.8) {
      if (player.squatting) {
        // 深蹲成功躲过
        score += 10 * level;
        spawnScore(o.x, o.y, '+' + (10*level));
        o.hit = true;
        setPhase('✅ 躲过了！+' + (10*level));
        spawnParticles(o.x, o.y, o.color, 12);
      } else {
        // 被撞
        takeHit();
        o.hit = true;
        spawnParticles(o.x, o.y, '#ff4444', 16);
      }
    }

    // 移出屏幕
    if (o.y > H + 50 || o.hit) {
      obstacles.splice(i, 1);
    }
  }
}

function drawObstacles() {
  obstacles.forEach(o => {
    // 闪烁
    if (o.hit) return;
    const pulse = Math.sin(o.frame * 0.15) * 0.15 + 0.85;
    ctx.globalAlpha = pulse;

    // 障碍主体
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x - o.w/2, o.y - o.h, o.w, o.h);

    // 像素感描边
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(o.x - o.w/2 + 0.5, o.y - o.h + 0.5, o.w - 1, o.h - 1);

    // 怪物眼睛
    if (o.name === '怪物') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(o.x - 6, o.y - o.h + 4, 4, 4);
      ctx.fillRect(o.x + 2, o.y - o.h + 4, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(o.x - 5, o.y - o.h + 5, 2, 2);
      ctx.fillRect(o.x + 3, o.y - o.h + 5, 2, 2);
    }
    // 尖刺
    if (o.name === '尖刺') {
      ctx.fillStyle = '#ff8888';
      for (let i = 0; i < 3; i++) {
        const sx = o.x - o.w/2 + 3 + i * 6;
        ctx.beginPath();
        ctx.moveTo(sx, o.y - o.h);
        ctx.lineTo(sx + 3, o.y - o.h - 6);
        ctx.lineTo(sx + 6, o.y - o.h);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;

    // 顶部箭头指示器（障碍在屏幕上方时显示位置）
    if (o.y < 60) {
      const alpha = 0.6 + Math.sin(Date.now() * 0.01) * 0.4;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 14px Courier New';
      ctx.fillText('▼', o.x - 5, 20);
      ctx.fillStyle = 'rgba(255,200,0,0.3)';
      ctx.fillRect(o.x - o.w/2, 0, o.w, 4);
      ctx.globalAlpha = 1;
    }
    // 接近警告（距离玩家1/3屏幕时）
    if (o.y > player.y - H*0.35 && o.y < player.y - 30) {
      const alpha = 0.5 + Math.sin(Date.now() * 0.012) * 0.5;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 13px Courier New';
      ctx.fillText('⚠️ 深蹲！', o.x - 28, o.y - o.h - 10);
      ctx.globalAlpha = 1;
      // 障碍本身高亮边框
      ctx.strokeStyle = '#ff4444';
      ctx.lineWidth = 2;
      ctx.strokeRect(o.x - o.w/2 - 2, o.y - o.h - 2, o.w + 4, o.h + 4);
    }
  });
}

// ===================== 玩家绘制（像素风） =====================
function drawPlayer() {
  const x = player.x;
  const y = player.y;
  const squatting = player.squatting;
  const hit = player.hitTimer > 0;

  // 受伤闪烁
  if (hit && Math.floor(player.hitTimer / 4) % 2 === 0) return;

  ctx.save();

  // 身体颜色
  const bodyColor = squatting ? '#6c63ff' : '#4a9eff';
  const legColor = squatting ? '#4a50cc' : '#2a6ecc';
  const headColor = '#ffcc88';

  if (squatting) {
    // 深蹲姿势（压扁更多）
    // 头（压低到脚部附近）
    ctx.fillStyle = headColor;
    ctx.fillRect(x - 7, y - 14, 14, 11);
    // 身体（大幅压扁）
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 9, y - 5, 18, 7);
    // 腿（廉降）
    ctx.fillStyle = legColor;
    ctx.fillRect(x - 12, y + 1, 10, 5);
    ctx.fillRect(x + 2, y + 1, 10, 5);
    // 手臂（平举）
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 22, y - 8, 14, 5);
    ctx.fillRect(x + 8, y - 8, 14, 5);
    // 深蹲光环
    ctx.strokeStyle = '#6c63ff';
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.7 + Math.sin(Date.now()*0.02)*0.3;
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 28, 10, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // 大字提示
    ctx.fillStyle = '#6c63ff';
    ctx.font = 'bold 16px Courier New';
    ctx.fillText('深蹲!', x - 22, y - 22);
  } else {
    // 跑步姿势 / 静止姿势
    const isMoving = bgSpeed > 0.3;
    const runCycle = isMoving ? Math.floor(Date.now() / 150) % 4 : 0;
    const legOff = isMoving ? [4, 2, 0, 2][runCycle] : 0;
    const armOff = isMoving ? [0, 2, 0, -2][runCycle] : 0;

    // 头
    ctx.fillStyle = headColor;
    ctx.fillRect(x - 6, y - 28, 12, 10);
    // 眼睛
    ctx.fillStyle = '#333';
    ctx.fillRect(x + 1, y - 25, 3, 3);

    // 身体
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 7, y - 18, 14, 12);

    // 手臂
    ctx.fillStyle = bodyColor;
    ctx.fillRect(x - 14, y - 18 + armOff, 8, 5);
    ctx.fillRect(x + 6, y - 18 - armOff, 8, 5);

    // 腿
    ctx.fillStyle = legColor;
    ctx.fillRect(x - 8, y - 6, 6, 8 - legOff);
    ctx.fillRect(x + 2, y - 6, 6, legOff + 2);
    // 脚
    ctx.fillStyle = '#664422';
    ctx.fillRect(x - 10, y + 2 - legOff, 8, 4);
    ctx.fillRect(x + 2, y + legOff - 2, 8, 4);
  }

  ctx.restore();
}

// ===================== 背景（像素跑道） =====================
function drawBackground() {
  // 天空渐变
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0520');
  grad.addColorStop(0.5, '#0f0a2a');
  grad.addColorStop(1, '#1a0f1f');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 星星
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const stars = [[50,30],[120,80],[200,20],[300,60],[80,120],[350,40],[W-50,90]];
  stars.forEach(([sx,sy]) => {
    const tw = (bgOffset * 0.1) % W;
    ctx.fillRect((sx + tw) % W, sy, 2, 2);
  });

  // 跑道（两条平行线向前延伸的视角）
  // 跑道背景
  const roadW = W * 0.7;
  const roadX = (W - roadW) / 2;
  ctx.fillStyle = '#1a1520';
  ctx.fillRect(roadX, 0, roadW, H);

  // 跑道线（滚动虚线）
  const lineOffset = bgOffset % 40;
  ctx.strokeStyle = 'rgba(108,99,255,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -lineOffset;

  // 左边线
  ctx.beginPath();
  ctx.moveTo(roadX + 2, 0);
  ctx.lineTo(roadX + 2, H);
  ctx.stroke();
  // 右边线
  ctx.beginPath();
  ctx.moveTo(roadX + roadW - 2, 0);
  ctx.lineTo(roadX + roadW - 2, H);
  ctx.stroke();
  // 中线
  ctx.strokeStyle = 'rgba(108,99,255,0.15)';
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();

  ctx.setLineDash([]);

  // 地面
  ctx.fillStyle = '#2a1f3a';
  ctx.fillRect(0, player.y + 5, W, H - player.y - 5);
  // 地面亮线
  ctx.fillStyle = '#3a2f4a';
  ctx.fillRect(0, player.y + 5, W, 2);
}

// ===================== 粒子 =====================
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*4,
      vy: (Math.random()-0.5)*4 - 2,
      color,
      life: 30 + Math.random()*20,
      maxLife: 50,
      size: 2 + Math.random()*3,
    });
  }
}

let scorePopups = [];
function spawnScore(x, y, text) {
  scorePopups.push({ x, y, text, life: 60 });
}

function updateParticles() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = scorePopups.length-1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y -= 1; p.life--;
    if (p.life <= 0) scorePopups.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  scorePopups.forEach(p => {
    ctx.globalAlpha = p.life / 60;
    ctx.fillStyle = '#f59e0b';
    ctx.font = 'bold 14px Courier New';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha = 1;
}

// ===================== 受伤 =====================
function takeHit() {
  hp--;
  player.hitTimer = 60;
  player.state = 'hit';
  updateHpUI();
  setPhase(`💥 被撞了！还剩 ${hp} 血`);
  // 屏幕震动
  shakeScreen(8, 20);
  if (hp <= 0) {
    setTimeout(gameOver, 500);
  }
}

let shakeX = 0, shakeY = 0, shakeDur = 0;
function shakeScreen(amount, duration) {
  shakeX = amount; shakeDur = duration;
}

// ===================== UI更新 =====================
function updateHpUI() {
  document.getElementById('hpFill').style.width = (hp/MAX_HP*100)+'%';
  document.getElementById('hpText').textContent = hp+'/'+MAX_HP;
  document.getElementById('hpFill').style.background =
    hp <= 1 ? '#ff2222' : hp <= 2 ? '#ff8844' : 'linear-gradient(90deg,#ff4444,#ff6584)';
}

function setPhase(text) {
  document.getElementById('phaseBox').textContent = text;
}

function updateScoreUI() {
  document.getElementById('scoreBox').textContent = score;
  document.getElementById('distBox').textContent = '距离: ' + Math.floor(distance) + 'm';
  document.getElementById('levelBox').textContent = 'Lv.' + level;
}

// ===================== 主游戏循环 =====================
function gameLoop(ts) {
  if (gameState === 'start' || gameState === 'dead') return;

  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  frameCount++;

  // 速度完全由步行驱动：stepAcc>2.2才开始动，静止时快速减速到0
  const moving = stepAcc > 2.5;
  const targetSpeed = moving ? Math.min(0.8 + (stepAcc - 2.5) * 2.0, 7) : 0;
  bgSpeed = moving ? bgSpeed * 0.85 + targetSpeed * 0.15 : bgSpeed * 0.85;
  if (bgSpeed < 0.05) bgSpeed = 0;

  if (gameState === 'running') {
    bgOffset += bgSpeed;
    distance += bgSpeed * 0.05;
    if (bgSpeed > 0) score += Math.floor(bgSpeed * 0.1);

    // 提示静止状态
    if (bgSpeed < 0.1 && !warningActive && !player.squatting && sensorPhase === 'idle') {
      setPhase('🚶 走动/跑步才能前进！（静止=停止）');
    }

    // 等级提升
    level = 1 + Math.floor(distance / 100);
    obstacleInterval = Math.max(90, 240 - level * 20);

    // 生成障碍
    obstacleTimer++;
    if (obstacleTimer >= obstacleInterval) {
      obstacleTimer = 0;
      spawnObstacle();
    }

    // 警告
    if (warningTimer > 0) warningTimer--;
    else warningActive = false;

    // 玩家
    if (player.hitTimer > 0) player.hitTimer--;
    else if (player.state === 'hit') player.state = 'run';
  }

  updateObstacles();
  updateParticles();
  updateScoreUI();

  // 屏幕抖动
  if (shakeDur > 0) {
    shakeX = (Math.random()-0.5) * 8;
    shakeY = (Math.random()-0.5) * 8;
    shakeDur--;
  } else { shakeX = 0; shakeY = 0; }

  // 警告闪红
  if (warningActive) {
    const alpha = (Math.sin(Date.now() * 0.015) + 1) * 0.5 * 0.15;
    ctx.save();
    ctx.fillStyle = `rgba(255,50,50,${alpha})`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // ===== 绘制 =====
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawObstacles();
  drawPlayer();
  drawParticles();

  // 深蹲时的地面特效
  if (player.squatting) {
    const glow = ctx.createRadialGradient(player.x, player.y+4, 5, player.x, player.y+4, 40);
    glow.addColorStop(0, 'rgba(108,99,255,0.4)');
    glow.addColorStop(1, 'rgba(108,99,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(player.x-40, player.y-10, 80, 20);
  }

  // 调试显示
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, H-55, W, 55);
  ctx.fillStyle = '#00ff88';
  ctx.font = '11px Courier New';
  ctx.fillText(`stepAcc=${stepAcc.toFixed(2)} bgSpeed=${bgSpeed.toFixed(2)} moving=${stepAcc>0.5}`, 8, H-36);
  ctx.fillText(`smooth=${smoothAcc.toFixed(2)} base=${baseAcc?baseAcc.toFixed(2):'---'} squat=${player.squatting}`, 8, H-16);

  ctx.restore();

  animId = requestAnimationFrame(gameLoop);
}

// ===================== 游戏控制 =====================
async function startGame() {
  document.getElementById('startOverlay').classList.add('hidden');

  // 请求传感器权限
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== 'granted') { setPhase('需要传感器权限！'); return; }
    } catch(e) { setPhase('权限获取失败'); return; }
  }

  resetGameState();
  gameState = 'calibrating';
  setPhase('🔄 校准中 0/20，手机平举保持不动...');
  window.addEventListener('devicemotion', handleMotion);
  lastTime = performance.now();
  animId = requestAnimationFrame(gameLoop);
}

function resetGameState() {
  score = 0; distance = 0; squatCount = 0;
  hp = MAX_HP; level = 1; frameCount = 0;
  bgOffset = 0; bgSpeed = 0;
  obstacles = []; particles = []; scorePopups = [];
  obstacleTimer = 0; warningActive = false;
  player.state = 'run'; player.hitTimer = 0; player.squatting = false;
  smoothAcc = 0; baseAcc = null; calibSamples = [];
  sensorPhase = 'idle'; peakDelta = 0; downStartTime = 0; stepAcc = 0;
  updateHpUI();
  updateScoreUI();
}

function gameOver() {
  gameState = 'dead';
  cancelAnimationFrame(animId);
  window.removeEventListener('devicemotion', handleMotion);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalDist').textContent = Math.floor(distance);
  document.getElementById('finalSquat').textContent = squatCount;
  document.getElementById('endOverlay').classList.remove('hidden');
}

function restartGame() {
  document.getElementById('endOverlay').classList.add('hidden');
  startGame();
}

function showStart() {
  document.getElementById('endOverlay').classList.add('hidden');
  document.getElementById('startOverlay').classList.remove('hidden');
  gameState = 'start';
  cancelAnimationFrame(animId);
  window.removeEventListener('devicemotion', handleMotion);
  // 重绘初始画面
  ctx.clearRect(0,0,W,H);
}

// 初始画面
function spawnSquatEffect() {
  spawnParticles(player.x, player.y - 10, '#6c63ff', 8);
}

// 初始渲染
drawBackground();
</script>
