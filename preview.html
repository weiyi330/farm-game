<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色预览</title>
<style>
body { background:#e8f4d0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:serif; gap:20px; }
h2 { color:#5a3a1a; letter-spacing:3px; }
.row { display:flex; gap:30px; align-items:flex-end; }
.item { display:flex; flex-direction:column; align-items:center; gap:8px; }
.label { font-size:13px; color:#8a6030; letter-spacing:1px; }
svg { filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15)); }
</style>
</head>
<body>
<h2>🐱 桃源农场 · 角色预览</h2>
<div class="row">

<!-- 正面站立 -->
<div class="item">
<svg width="80" height="110" viewBox="0 0 80 110">
  <!-- 阴影 -->
  <ellipse cx="40" cy="106" rx="18" ry="5" fill="rgba(0,0,0,0.12)"/>
  <!-- 腿 -->
  <rect x="27" y="76" width="10" height="22" rx="5" fill="#f0a040"/>
  <rect x="43" y="76" width="10" height="22" rx="5" fill="#f0a040"/>
  <!-- 鞋子 -->
  <ellipse cx="32" cy="98" rx="8" ry="5" fill="#7a4a10"/>
  <ellipse cx="48" cy="98" rx="8" ry="5" fill="#7a4a10"/>
  <!-- 身体（白色汉服） -->
  <path d="M22,45 Q20,80 25,88 Q40,92 55,88 Q60,80 58,45 Z" fill="#f8f2e0"/>
  <path d="M22,45 L30,55 L40,48 L50,55 L58,45" fill="none" stroke="#d4b870" stroke-width="1.5"/>
  <!-- 腰带 -->
  <rect x="24" y="70" width="32" height="5" rx="2.5" fill="#c8922a"/>
  <!-- 手臂 -->
  <path d="M22,50 Q10,58 12,68" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M58,50 Q70,58 68,68" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- 手（锄头） -->
  <circle cx="12" cy="70" r="6" fill="#f0a040"/>
  <circle cx="68" cy="70" r="6" fill="#f0a040"/>
  <!-- 锄头 -->
  <line x1="68" y1="70" x2="78" y2="40" stroke="#8a5a20" stroke-width="3" stroke-linecap="round"/>
  <path d="M72,38 Q80,32 82,40 Q76,48 68,44 Z" fill="#a07840"/>
  <!-- 头 -->
  <ellipse cx="40" cy="30" rx="22" ry="22" fill="#f0a040"/>
  <!-- 耳朵 -->
  <path d="M20,16 L12,4 L28,12 Z" fill="#f0a040"/>
  <path d="M60,16 L68,4 L52,12 Z" fill="#f0a040"/>
  <path d="M21,15 L14,6 L27,13 Z" fill="#ffb8b0"/>
  <path d="M59,15 L66,6 L53,13 Z" fill="#ffb8b0"/>
  <!-- 草帽 -->
  <ellipse cx="40" cy="14" rx="26" ry="7" fill="#d4a030"/>
  <ellipse cx="40" cy="10" rx="16" ry="10" fill="#e8b840"/>
  <path d="M28,13 Q40,8 52,13" fill="none" stroke="#b88020" stroke-width="1"/>
  <!-- 帽子花饰 -->
  <circle cx="40" cy="8" r="4" fill="#ff9090"/>
  <circle cx="37" cy="6" r="2.5" fill="#ffb0b0"/>
  <!-- 脸 -->
  <ellipse cx="40" cy="32" rx="15" ry="14" fill="#ffd090"/>
  <!-- 眼睛 -->
  <path d="M32,28 Q35,24 38,28" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42,28 Q45,24 48,28" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 眼睛高光 -->
  <circle cx="34" cy="27" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="44" cy="27" r="1.5" fill="white" opacity="0.8"/>
  <!-- 鼻子 -->
  <ellipse cx="40" cy="33" rx="3" ry="2.5" fill="#ff9090"/>
  <!-- 嘴 -->
  <path d="M36,37 Q40,41 44,37" fill="none" stroke="#c07060" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 胡须 -->
  <line x1="26" y1="34" x2="37" y2="33" stroke="rgba(80,40,10,0.4)" stroke-width="1"/>
  <line x1="26" y1="37" x2="37" y2="36" stroke="rgba(80,40,10,0.4)" stroke-width="1"/>
  <line x1="54" y1="34" x2="43" y2="33" stroke="rgba(80,40,10,0.4)" stroke-width="1"/>
  <line x1="54" y1="37" x2="43" y2="36" stroke="rgba(80,40,10,0.4)" stroke-width="1"/>
  <!-- 腮红 -->
  <ellipse cx="30" cy="34" rx="5" ry="3.5" fill="rgba(255,150,130,0.4)"/>
  <ellipse cx="50" cy="34" rx="5" ry="3.5" fill="rgba(255,150,130,0.4)"/>
  <!-- 尾巴 -->
  <path d="M55,85 Q75,75 72,60 Q70,50 62,55" fill="none" stroke="#f0a040" stroke-width="7" stroke-linecap="round"/>
  <path d="M55,85 Q75,75 72,60 Q70,50 62,55" fill="none" stroke="#ffc870" stroke-width="3" stroke-linecap="round"/>
</svg>
<span class="label">正面·持锄</span>
</div>

<!-- 行走姿势 -->
<div class="item">
<svg width="80" height="110" viewBox="0 0 80 110">
  <ellipse cx="40" cy="106" rx="16" ry="4" fill="rgba(0,0,0,0.12)"/>
  <!-- 腿（行走） -->
  <rect x="24" y="76" width="10" height="20" rx="5" fill="#f0a040" transform="rotate(-12,29,76)"/>
  <rect x="44" y="76" width="10" height="20" rx="5" fill="#f0a040" transform="rotate(10,49,76)"/>
  <ellipse cx="28" cy="97" rx="8" ry="4" fill="#7a4a10" transform="rotate(-5,28,97)"/>
  <ellipse cx="52" cy="95" rx="8" ry="4" fill="#7a4a10" transform="rotate(8,52,95)"/>
  <!-- 身体 -->
  <path d="M22,45 Q20,80 25,88 Q40,92 55,88 Q60,80 58,45 Z" fill="#f8f2e0" transform="rotate(-3,40,65)"/>
  <rect x="24" y="70" width="32" height="5" rx="2.5" fill="#c8922a" transform="rotate(-3,40,72)"/>
  <!-- 手臂（摆动） -->
  <path d="M22,50 Q8,62 10,72" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M58,50 Q72,56 70,66" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="73" r="6" fill="#f0a040"/>
  <circle cx="70" cy="67" r="6" fill="#f0a040"/>
  <!-- 头（微倾） -->
  <ellipse cx="41" cy="29" rx="22" ry="22" fill="#f0a040" transform="rotate(5,41,29)"/>
  <path d="M21,15 L13,3 L28,11 Z" fill="#f0a040"/>
  <path d="M61,14 L69,2 L54,10 Z" fill="#f0a040"/>
  <path d="M22,14 L15,5 L27,12 Z" fill="#ffb8b0"/>
  <path d="M60,13 L67,4 L55,11 Z" fill="#ffb8b0"/>
  <!-- 草帽 -->
  <ellipse cx="41" cy="13" rx="26" ry="7" fill="#d4a030" transform="rotate(5,41,13)"/>
  <ellipse cx="41" cy="9" rx="16" ry="10" fill="#e8b840" transform="rotate(5,41,9)"/>
  <circle cx="42" cy="7" r="4" fill="#ff9090"/>
  <!-- 脸 -->
  <ellipse cx="41" cy="31" rx="15" ry="14" fill="#ffd090" transform="rotate(5,41,31)"/>
  <path d="M33,27 Q36,23 39,27" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M43,27 Q46,23 49,27" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="41" cy="33" rx="3" ry="2.5" fill="#ff9090"/>
  <path d="M37,37 Q41,42 45,37" fill="none" stroke="#c07060" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="31" cy="34" rx="5" ry="3.5" fill="rgba(255,150,130,0.4)"/>
  <ellipse cx="51" cy="34" rx="5" ry="3.5" fill="rgba(255,150,130,0.4)"/>
  <!-- 尾巴 -->
  <path d="M56,83 Q78,70 74,55 Q72,45 63,50" fill="none" stroke="#f0a040" stroke-width="7" stroke-linecap="round"/>
  <path d="M56,83 Q78,70 74,55 Q72,45 63,50" fill="none" stroke="#ffc870" stroke-width="3" stroke-linecap="round"/>
</svg>
<span class="label">行走姿势</span>
</div>

<!-- 深蹲/劳作 -->
<div class="item">
<svg width="80" height="95" viewBox="0 0 80 95">
  <ellipse cx="40" cy="91" rx="20" ry="5" fill="rgba(0,0,0,0.12)"/>
  <!-- 腿（蹲下） -->
  <path d="M28,65 Q20,75 22,88" stroke="#f0a040" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M52,65 Q60,75 58,88" stroke="#f0a040" stroke-width="11" stroke-linecap="round" fill="none"/>
  <ellipse cx="22" cy="88" rx="10" ry="5" fill="#7a4a10"/>
  <ellipse cx="58" cy="88" rx="10" ry="5" fill="#7a4a10"/>
  <!-- 身体（压低） -->
  <path d="M24,44 Q22,68 28,72 Q40,76 52,72 Q58,68 56,44 Z" fill="#f8f2e0"/>
  <rect x="26" y="63" width="28" height="5" rx="2.5" fill="#c8922a"/>
  <!-- 手臂（向下劳作） -->
  <path d="M24,50 Q12,58 10,72" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M56,50 Q68,58 70,72" stroke="#f0a040" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="10" cy="73" r="6" fill="#f0a040"/>
  <circle cx="70" cy="73" r="6" fill="#f0a040"/>
  <!-- 锄头插地 -->
  <line x1="10" y1="73" x2="5" y2="88" stroke="#8a5a20" stroke-width="3" stroke-linecap="round"/>
  <path d="M2,86 Q4,80 8,84 Q10,90 4,92 Z" fill="#a07840"/>
  <!-- 头 -->
  <ellipse cx="40" cy="26" rx="21" ry="21" fill="#f0a040"/>
  <path d="M21,14 L13,3 L28,11 Z" fill="#f0a040"/>
  <path d="M59,14 L67,3 L52,11 Z" fill="#f0a040"/>
  <path d="M22,13 L15,4 L27,12 Z" fill="#ffb8b0"/>
  <path d="M58,13 L65,4 L53,12 Z" fill="#ffb8b0"/>
  <!-- 草帽 -->
  <ellipse cx="40" cy="11" rx="26" ry="7" fill="#d4a030"/>
  <ellipse cx="40" cy="7" rx="16" ry="10" fill="#e8b840"/>
  <circle cx="40" cy="5" r="4" fill="#ff9090"/>
  <!-- 脸 -->
  <ellipse cx="40" cy="28" rx="14" ry="13" fill="#ffd090"/>
  <!-- 努力表情（嘴张开） -->
  <path d="M33,24 Q36,20 38,24" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42,24 Q45,20 47,24" fill="none" stroke="#3a1a08" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35,31 Q40,37 45,31" fill="#ff9090" stroke="#c07060" stroke-width="1.2"/>
  <ellipse cx="31" cy="30" rx="5" ry="3" fill="rgba(255,150,130,0.45)"/>
  <ellipse cx="49" cy="30" rx="5" ry="3" fill="rgba(255,150,130,0.45)"/>
  <!-- 汗珠 -->
  <path d="M52,16 Q54,12 52,10 Q50,12 52,16 Z" fill="#a0d0ff"/>
  <!-- 尾巴 -->
  <path d="M54,70 Q74,60 70,45 Q68,36 60,40" fill="none" stroke="#f0a040" stroke-width="7" stroke-linecap="round"/>
  <path d="M54,70 Q74,60 70,45 Q68,36 60,40" fill="none" stroke="#ffc870" stroke-width="3" stroke-linecap="round"/>
</svg>
<span class="label">劳作姿势</span>
</div>

</div>

<!-- 建筑预览 -->
<h2 style="margin-top:20px">🏠 建筑预览</h2>
<div class="row">

<!-- 茅草屋（等距视角） -->
<div class="item">
<svg width="120" height="130" viewBox="0 0 120 130">
  <!-- 右侧面 -->
  <path d="M60,80 L100,60 L100,110 L60,130 Z" fill="#8a7040"/>
  <!-- 左侧面 -->
  <path d="M20,60 L60,80 L60,130 L20,110 Z" fill="#6a5030"/>
  <!-- 正面 -->
  <path d="M20,60 L60,40 L100,60 L60,80 Z" fill="#a08050"/>
  <!-- 门（正面） -->
  <path d="M45,80 L45,75 Q60,70 75,75 L75,80 Z" fill="#5a3a10"/>
  <path d="M48,80 L48,72 Q60,68 72,72 L72,80 Z" fill="#7a5020"/>
  <!-- 窗户 -->
  <rect x="28" y="65" width="12" height="10" rx="2" fill="#c8d8e8" opacity="0.8"/>
  <line x1="34" y1="65" x2="34" y2="75" stroke="#8a6030" stroke-width="1"/>
  <line x1="28" y1="70" x2="40" y2="70" stroke="#8a6030" stroke-width="1"/>
  <!-- 茅草屋顶 -->
  <!-- 右坡 -->
  <path d="M60,10 L105,50 L100,60 L60,40 Z" fill="#c8a030"/>
  <!-- 左坡 -->
  <path d="M60,10 L15,50 L20,60 L60,40 Z" fill="#a07820"/>
  <!-- 茅草纹理右 -->
  <path d="M62,15 L100,50" stroke="#e8c040" stroke-width="1" opacity="0.5"/>
  <path d="M67,13 L104,50" stroke="#e8c040" stroke-width="1" opacity="0.5"/>
  <path d="M58,18 L97,52" stroke="#906810" stroke-width="1" opacity="0.4"/>
  <path d="M72,12 L106,46" stroke="#e8c040" stroke-width="1" opacity="0.4"/>
  <!-- 茅草纹理左 -->
  <path d="M58,15 L20,50" stroke="#906810" stroke-width="1" opacity="0.5"/>
  <path d="M53,13 L16,50" stroke="#906810" stroke-width="1" opacity="0.5"/>
  <!-- 屋脊 -->
  <path d="M30,52 Q60,8 90,52" fill="none" stroke="#7a5a10" stroke-width="3" stroke-linecap="round"/>
  <!-- 屋顶装饰 -->
  <circle cx="60" cy="10" r="5" fill="#c8922a"/>
  <path d="M55,10 Q60,4 65,10" fill="#e8b030"/>
  <!-- 地基 -->
  <path d="M15,108 L60,128 L105,108 L100,110 L60,130 L20,110 Z" fill="#8a7050" opacity="0.5"/>
  <!-- 台阶 -->
  <path d="M50,128 L70,120 L70,130 L50,130 Z" fill="#b09060"/>
  <!-- 烟囱 -->
  <rect x="72" y="20" width="8" height="18" rx="2" fill="#8a7040" transform="skewX(-10)"/>
  <ellipse cx="76" cy="20" rx="5" ry="3" fill="#6a5030"/>
  <!-- 烟雾 -->
  <circle cx="76" cy="14" r="4" fill="white" opacity="0.5"/>
  <circle cx="78" cy="8" r="3" fill="white" opacity="0.35"/>
  <circle cx="75" cy="3" r="2" fill="white" opacity="0.2"/>
</svg>
<span class="label">茅草屋</span>
</div>

<!-- 水井 -->
<div class="item">
<svg width="80" height="90" viewBox="0 0 80 90">
  <!-- 井台 -->
  <path d="M15,50 L40,65 L65,50 L40,35 Z" fill="#b09060"/>
  <path d="M15,50 L15,60 L40,75 L40,65 Z" fill="#8a7040"/>
  <path d="M65,50 L65,60 L40,75 L40,65 Z" fill="#a08050"/>
  <!-- 井口 -->
  <ellipse cx="40" cy="50" rx="20" ry="10" fill="#3a2a10"/>
  <ellipse cx="40" cy="48" rx="18" ry="8" fill="#1a1208"/>
  <ellipse cx="40" cy="47" rx="14" ry="5" fill="#0a2040" opacity="0.8"/>
  <!-- 水面反光 -->
  <ellipse cx="40" cy="47" rx="10" ry="3" fill="#5ab0e0" opacity="0.4"/>
  <!-- 井架 -->
  <line x1="24" y1="35" x2="24" y2="8" stroke="#8a5a20" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="35" x2="56" y2="8" stroke="#8a5a20" stroke-width="4" stroke-linecap="round"/>
  <rect x="18" y="6" width="44" height="5" rx="2.5" fill="#6a4010"/>
  <!-- 轱辘 -->
  <rect x="33" y="4" width="14" height="10" rx="3" fill="#a07030"/>
  <line x1="40" y1="4" x2="40" y2="14" stroke="#7a5020" stroke-width="2"/>
  <line x1="33" y1="9" x2="47" y2="9" stroke="#7a5020" stroke-width="2"/>
  <!-- 绳子 -->
  <line x1="40" y1="14" x2="40" y2="38" stroke="#c8a040" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- 水桶 -->
  <path d="M33,38 L47,38 L45,52 L35,52 Z" fill="#7a9060"/>
  <path d="M33,38 L47,38" stroke="#5a7040" stroke-width="2"/>
  <ellipse cx="40" cy="38" rx="7" ry="2.5" fill="#8aaa70"/>
</svg>
<span class="label">水井</span>
</div>

<!-- 农田（等距） -->
<div class="item">
<svg width="90" height="70" viewBox="0 0 90 70">
  <!-- 农田格子 -->
  <path d="M5,35 L45,15 L85,35 L45,55 Z" fill="#8a5a28"/>

  <path d="M15,35 L45,20 L75,35 L45,50 Z" fill="#7a4a18" opacity="0.5"/>
  <path d="M25,35 L45,25 L65,35 L45,45 Z" fill="#6a3a08" opacity="0.4"/>

  <path d="M5,35 L5,42 L45,62 L45,55 Z" fill="#5a3a10"/>
  <path d="M85,35 L85,42 L45,62 L45,55 Z" fill="#7a5020"/>
  <!-- 作物（小麦） -->
  <g opacity="0.9">
    <line x1="30" y1="33" x2="30" y2="22" stroke="#8a9a30" stroke-width="2"/>
    <path d="M28,22 Q30,17 32,22" fill="#b0b830"/>
    <line x1="40" y1="30" x2="40" y2="19" stroke="#8a9a30" stroke-width="2"/>

    <line x1="50" y1="33" x2="50" y2="22" stroke="#8a9a30" stroke-width="2"/>
    <path d="M48,22 Q50,17 52,22" fill="#b0b830"/>
    <line x1="60" y1="30" x2="60" y2="19" stroke="#8a9a30" stroke-width="2"/>
    <path d="M58,19 Q60,14 62,19" fill="#b0b830"/>
    <line x1="35" y1="40" x2="35" y2="30" stroke="#8a9a30" stroke-width="2"/>
    <path d="M33,30 Q35,25 37,30" fill="#b0b830"/>
    <line x1="55" y1="40" x2="55" y2="30" stroke="#8a9a30" stroke-width="2"/>
    <path d="M53,30 Q55,25 57,30" fill="#b0b830"/>
  </g>

<span class="label">农田·有作物</span>
</div>

</div>

<p style="color:#8a6030;font-size:12px;letter-spacing:1px;margin-top:10px">纯SVG绘制 · 无需外部图片</p>

</body>
</html>
