<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="screen-orientation" content="landscape">
<title>🌾 农场地图编辑器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #1a2a1a; color: #c8e6c9; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; user-select: none; touch-action: none; }

/* ============================================================
   竖屏提示覆盖层
============================================================ */
#portrait-warn {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #0d1a0d;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  color: #81c784;
  text-align: center;
  padding: 30px;
}
#portrait-warn .pw-icon { font-size: 60px; animation: rotateIcon 1.5s infinite; }
@keyframes rotateIcon {
  0%   { transform: rotate(0deg); }
  50%  { transform: rotate(90deg); }
  100% { transform: rotate(90deg); }
}
#portrait-warn h2 { font-size: 20px; color: #a5d6a7; }
#portrait-warn p  { font-size: 13px; color: #6a9a6a; }

@media (orientation: portrait) {
  #portrait-warn { display: flex; }
  #rotate-wrapper { display: none; }
}

/* 横屏正常显示 */
#rotate-wrapper {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  position: relative;
}

/* TOP BAR */
#topbar {
  background: #0d1a0d;
  border-bottom: 2px solid #2e7d32;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
#topbar h1 { font-size: 15px; color: #81c784; margin-right: 6px; white-space: nowrap; }
.btn {
  background: #2e4a2e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn:hover { background: #3d6b3d; }
.btn.danger { border-color: #ef5350; }
.btn.danger:hover { background: #5c2020; }

.sep { width: 1px; background: #2e7d32; height: 22px; flex-shrink: 0; }

label.topbar-label { font-size: 12px; color: #81c784; white-space: nowrap; }
select.topbar-select {
  background: #1e3a1e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.size-inputs { display: flex; align-items: center; gap: 4px; }
.size-inputs input {
  background: #1e3a1e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  width: 54px;
  padding: 3px 5px;
  border-radius: 4px;
  font-size: 12px;
  text-align: center;
}

/* MAIN AREA */
#main { display: flex; flex: 1; overflow: hidden; }

/* LEFT PANEL */
#left-panel {
  width: 230px;
  flex-shrink: 0;
  background: #0d1a0d;
  border-right: 2px solid #2e7d32;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.2s ease;
  position: relative;
}
#left-panel.collapsed {
  width: 28px;
  overflow: visible;
}
#left-panel.collapsed #panel-tabs,
#left-panel.collapsed .panel-content {
  display: none;
}
#panel-tabs { display: flex; border-bottom: 1px solid #2e7d32; }
.panel-tab {
  flex: 1;
  padding: 7px 4px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  color: #7cb87e;
  background: #0d1a0d;
  border: none;
  border-right: 1px solid #2e7d32;
  transition: background 0.15s;
}
.panel-tab:last-child { border-right: none; }
.panel-tab.active { background: #1e3a1e; color: #a5d6a7; }
.panel-tab:hover:not(.active) { background: #162816; }

.panel-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; padding: 8px; }
.panel-content.active { display: flex; }
.atlas-cell-selected { border-color: #ffe040 !important; box-shadow: 0 0 0 1px #ffe040; }

/* LAYER TAB */
.layer-btn {
  display: block;
  width: 100%;
  background: #1e3a1e;
  border: 1px solid #3a5a3a;
  color: #a5d6a7;
  padding: 6px 10px;
  margin-bottom: 4px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  text-align: left;
  transition: background 0.15s;
}
.layer-btn:hover { background: #2a4a2a; }
.layer-btn.active { background: #2e7d32; border-color: #66bb6a; color: #fff; }

.layer-desc {
  font-size: 11px;
  color: #6a9a6a;
  padding: 6px 4px;
  line-height: 1.5;
}

/* TILE TAB */
.tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile-btn {
  background: #1e3a1e;
  border: 2px solid #3a5a3a;
  border-radius: 6px;
  padding: 6px 2px;
  cursor: pointer;
  text-align: center;
  font-size: 18px;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.tile-btn span { font-size: 10px; color: #81c784; }
.tile-btn:hover { border-color: #66bb6a; background: #2a4a2a; }
.tile-btn.active { border-color: #ffca28; background: #3a4a1a; }
.tile-note { font-size: 11px; color: #6a9a6a; padding: 6px 2px; }

/* TOOL TAB */
.tool-section { margin-bottom: 12px; }
.tool-section h3 { font-size: 11px; color: #81c784; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
.tool-btns { display: flex; gap: 6px; }
.tool-btn {
  flex: 1;
  background: #1e3a1e;
  border: 2px solid #3a5a3a;
  border-radius: 6px;
  padding: 8px 4px;
  cursor: pointer;
  text-align: center;
  font-size: 16px;
  transition: all 0.15s;
}
.tool-btn span { display: block; font-size: 10px; color: #81c784; margin-top: 2px; }
.tool-btn:hover { border-color: #66bb6a; background: #2a4a2a; }
.tool-btn.active { border-color: #ffca28; background: #3a4a1a; }

.visibility-list { display: flex; flex-direction: column; gap: 5px; }
.vis-item { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; padding: 3px 4px; border-radius: 3px; }
.vis-item:hover { background: #1e3a1e; }
.vis-item input[type=checkbox] { accent-color: #4caf50; width: 14px; height: 14px; cursor: pointer; }
.spawn-template-btn { margin-top: 8px; }

/* CANVAS AREA */
#canvas-area {
  flex: 1;
  overflow: auto;
  background: #111e11;
  position: relative;
}
#map-canvas {
  display: block;
  cursor: crosshair;
  image-rendering: pixelated;
}

/* BOTTOM BAR */
#bottombar {
  background: #0d1a0d;
  border-top: 2px solid #2e7d32;
  padding: 4px 12px;
  font-size: 12px;
  color: #66a066;
  display: flex;
  gap: 16px;
  flex-shrink: 0;
}

/* MODALS */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #1a2a1a;
  border: 2px solid #4caf50;
  border-radius: 10px;
  padding: 20px;
  min-width: 400px;
  max-width: 90vw;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal h2 { font-size: 16px; color: #81c784; }
.modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  background: none;
  border: none;
  color: #81c784;
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
}
.modal-body { overflow-y: auto; flex: 1; }

/* SAVE MODAL */
.save-item {
  background: #1e3a1e;
  border: 1px solid #3a5a3a;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.save-item-info { flex: 1; min-width: 0; }
.save-item-name { font-size: 13px; color: #a5d6a7; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-item-meta { font-size: 11px; color: #6a9a6a; }
.save-item-btns { display: flex; gap: 4px; flex-shrink: 0; }
.btn-sm {
  background: #2e4a2e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
}
.btn-sm:hover { background: #3d6b3d; }
.btn-sm.danger { border-color: #ef5350; color: #ef9a9a; }
.btn-sm.danger:hover { background: #5c2020; }

.new-save-row { display: flex; gap: 8px; }
.new-save-row input {
  flex: 1;
  background: #1e3a1e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 13px;
}

/* EXPORT MODAL */
#export-textarea {
  width: 100%;
  height: 300px;
  background: #111;
  border: 1px solid #4caf50;
  color: #a5d6a7;
  padding: 8px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 11px;
  resize: vertical;
}

/* SPAWN CELL MODAL */
.spawn-cell-list { display: flex; flex-direction: column; gap: 6px; }
.spawn-entry {
  background: #1e3a1e;
  border: 1px solid #3a5a3a;
  border-radius: 5px;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.spawn-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.3);
}
.spawn-entry-info { flex: 1; min-width: 0; }
.spawn-entry-name { font-size: 12px; color: #a5d6a7; }
.spawn-entry-type { font-size: 10px; color: #6a9a6a; }

.add-spawn-section {
  background: #111e11;
  border: 1px solid #3a5a3a;
  border-radius: 6px;
  padding: 10px;
  margin-top: 8px;
}
.add-spawn-section h3 { font-size: 12px; color: #81c784; margin-bottom: 8px; }
.form-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.form-row label { font-size: 11px; color: #81c784; white-space: nowrap; }
.form-row input, .form-row select {
  background: #1e3a1e;
  border: 1px solid #4caf50;
  color: #c8e6c9;
  padding: 4px 7px;
  border-radius: 4px;
  font-size: 12px;
}
.form-row input[type=color] { width: 40px; height: 26px; padding: 1px; cursor: pointer; }

/* TEMPLATE MODAL */
.template-list { display: flex; flex-direction: column; gap: 6px; }
.template-entry {
  background: #1e3a1e;
  border: 1px solid #3a5a3a;
  border-radius: 5px;
  padding: 7px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* SCROLLBARS */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0d1a0d; }
::-webkit-scrollbar-thumb { background: #2e7d32; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #4caf50; }

/* ============================================================
   MODALS - 小屏横屏适配
   横屏手机：宽度充裗，高度有限，各元素要紧凑
============================================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 6px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #1a2a1a;
  border: 2px solid #4caf50;
  border-radius: 10px;
  padding: 14px 16px;
  width: 100%;
  max-width: 640px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-sizing: border-box;
  overflow: hidden;
}
.modal h2 { font-size: 15px; color: #81c784; flex-shrink: 0; }
.modal-close {
  position: absolute;
  top: 10px;
  right: 12px;
  background: none;
  border: none;
  color: #81c784;
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
}
.modal-body { overflow-y: auto; flex: 1; min-height: 0; }

/* 横屏手机：高度最紧张 */
@media (max-height: 450px) {
  .modal { padding: 8px 10px; gap: 6px; max-height: 96vh; border-radius: 6px; }
  .modal h2 { font-size: 13px; }
  .modal-close { top: 6px; right: 8px; font-size: 18px; }
  .modal-body { font-size: 12px; }
  #save-list, #cloud-save-list { max-height: 38vh !important; }
  #export-textarea { height: 160px !important; }
  .save-item { padding: 5px 8px; }
  .save-item-name { font-size: 12px; }
  .save-item-meta { font-size: 10px; }
  .btn-sm { padding: 3px 7px; font-size: 11px; }
  .add-spawn-section { padding: 6px 8px; }
  .add-spawn-section h3 { font-size: 11px; margin-bottom: 4px; }
  .form-row { margin-bottom: 4px; }
}

/* 横屏手机：宽度迃不下时自动收紧 */
@media (max-width: 560px) {
  .modal { max-width: 100%; border-radius: 8px; }
  .new-save-row { flex-direction: column; gap: 5px; }
  .new-save-row input, .new-save-row button { width: 100%; }
  .save-item-btns { flex-wrap: wrap; }
}

/* 小屏横屏顶部栏自动收紧 */
@media (max-height: 450px) {
  #topbar { padding: 3px 6px; gap: 4px; }
  #topbar h1 { font-size: 13px; }
  .btn { padding: 3px 7px; font-size: 11px; }
  .sep { height: 18px; }
  label.topbar-label { font-size: 11px; }
  select.topbar-select { padding: 2px 4px; font-size: 11px; }
  .size-inputs input { width: 42px; padding: 2px 4px; font-size: 11px; }
  #bottombar { padding: 2px 8px; font-size: 11px; }
  #left-panel { width: 200px; }
  #left-panel.collapsed { width: 24px; }
  .panel-tab { padding: 5px 2px; font-size: 11px; }
  .layer-btn { padding: 4px 8px; font-size: 11px; }
  .tile-btn { font-size: 15px; }
  .tool-btn { padding: 5px 2px; font-size: 14px; }
}
</style>
</head>
<body>

<!-- 竖屏提示 -->
<div id="portrait-warn">
  <div class="pw-icon">📱</div>
  <h2>请旋转手机</h2>
  <p>🌾 地图编辑器为横屏设计<br>旋转后自动进入</p>
  <button onclick="forceEnter()" style="margin-top:16px;background:#2e7d32;border:2px solid #4caf50;color:#fff;padding:10px 28px;border-radius:8px;font-size:16px;cursor:pointer;">直接进入 →</button>
</div>

<div id="rotate-wrapper">

<!-- TOP BAR -->
<div id="topbar">
  <h1>🌾 农场地图编辑器</h1>
  <div class="sep"></div>
  <button class="btn" onclick="showExportModal()">📤 导出</button>
  <button class="btn" onclick="importJSON()">📥 导入</button>
  <div class="sep"></div>
  <button class="btn" onclick="showSaveModal()">💾 存档</button>
  <div class="sep"></div>
  <button class="btn" onclick="fillCurrentLayer()">🖌 全填</button>
  <button class="btn danger" onclick="clearCurrentLayer()">🗑 清空</button>
  <div class="sep"></div>
  <label class="topbar-label">尺寸:</label>
  <div class="size-inputs">
    <input id="input-cols" type="number" min="1" max="99999" value="18" title="列数">
    <span style="color:#81c784">×</span>
    <input id="input-rows" type="number" min="1" max="99999" value="14" title="行数">
    <button class="btn" onclick="resizeMap()">✔</button>
  </div>
  <div class="sep"></div>
  <label class="topbar-label">格子:</label>
  <select class="topbar-select" id="cell-size-select" onchange="changeCellSize(this.value)">
    <option value="8">8px</option>
    <option value="16">16px</option>
    <option value="32">32px</option>
    <option value="40" selected>40px</option>
    <option value="48">48px</option>
    <option value="64">64px</option>
  </select>
  <button class="btn" id="panel-toggle-btn" onclick="toggleLeftPanel()" title="收起/展开左侧面板">◀ 面板</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div id="panel-tabs">
      <button class="panel-tab active" onclick="switchTab('layers')">📐 层</button>
      <button class="panel-tab" onclick="switchTab('tiles')">🎨 地块</button>
      <button class="panel-tab" onclick="switchTab('atlas')">🖼 图集</button>
      <button class="panel-tab" onclick="switchTab('tools')">🛠 工具</button>
    </div>

    <!-- LAYERS TAB -->
    <div class="panel-content active" id="tab-layers">
      <div id="layer-buttons"></div>
      <div class="layer-desc" id="layer-desc-text"></div>
    </div>

    <!-- TILES TAB -->
    <div class="panel-content" id="tab-tiles">
      <div class="tile-note">仅 ground_high 层有效</div>
      <div class="tile-grid" id="tile-grid"></div>
    </div>

    <!-- ATLAS TAB -->
    <div class="panel-content" id="tab-atlas" style="display:none;">
      <div style="padding:6px;border-bottom:1px solid #2e7d32;flex-shrink:0;">
        <button class="btn" style="width:100%;" onclick="syncAtlas()">🔄 同步图集</button>
        <div id="atlas-sync-hint" style="font-size:10px;color:#81c784;padding:4px 2px 0;">从 assets/map_editor/index.json 加载</div>
      </div>
      <div id="atlas-panel" style="flex:1;overflow-y:auto;padding:4px;"></div>
    </div>

    <!-- TOOLS TAB -->
    <div class="panel-content" id="tab-tools">
      <div class="tool-section">
        <h3>绘制工具</h3>
        <div class="tool-btns">
          <button class="tool-btn active" id="tool-pencil" onclick="setTool('pencil')">✏️<span>画笔</span></button>
          <button class="tool-btn" id="tool-fill" onclick="setTool('fill')">🪣<span>填充</span></button>
          <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">🧹<span>橡皮</span></button>
        </div>
      </div>
      <div class="tool-section">
        <h3>层可见性</h3>
        <div class="visibility-list" id="vis-list"></div>
      </div>
      <div class="tool-section">
        <button class="btn spawn-template-btn" onclick="showTemplateModal()" style="width:100%">🌱 刷新点模板管理</button>
      </div>
    </div>
  </div>

  <!-- CANVAS AREA -->
  <div id="canvas-area">
    <canvas id="map-canvas"></canvas>
  </div>
</div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <span id="status-pos">鼠标: -</span>
  <span id="status-layer">当前层: ground_high</span>
  <span id="status-tool">工具: 画笔</span>
  <span id="status-tile">地块: 草地</span>
  <button id="status-copy-btn" class="btn" style="display:none;padding:2px 8px;font-size:11px;margin-left:4px;" onclick="copyCellBrush()">📋 复制画笔</button>
</div>

<!-- 顶部提示条（错误/警告） -->
<div id="toast" style="display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);background:#b71c1c;color:#fff;padding:6px 18px;border-radius:6px;font-size:13px;z-index:9999;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.4);"></div>

<!-- SAVE MODAL -->
<div class="modal-overlay" id="save-modal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal('save-modal')">✕</button>
    <h2>💾 存档管理</h2>
    <!-- 存档标签切换 -->
    <div style="display:flex;gap:6px;border-bottom:1px solid #2e7d32;padding-bottom:8px;">
      <button class="btn" id="save-tab-local" onclick="switchSaveTab('local')" style="flex:1;">📁 本地存档</button>
      <button class="btn" id="save-tab-cloud" onclick="switchSaveTab('cloud')" style="flex:1;background:#1e3a1e;">☁️ 云存档（GitHub）</button>
    </div>
    <!-- 本地存档区 -->
    <div id="save-panel-local">
      <div class="new-save-row" style="margin-top:8px;">
        <input id="new-save-name" type="text" placeholder="新存档名称..." value="地图1">
        <button class="btn" onclick="saveNew()">➕ 保存新存档</button>
      </div>
      <div class="modal-body" id="save-list" style="max-height:40vh;overflow-y:auto;"></div>
    </div>
    <!-- 云存档区 -->
    <div id="save-panel-cloud" style="display:none;">
      <!-- GitHub Token 配置 -->
      <div style="background:#111e11;border:1px solid #2e7d32;border-radius:6px;padding:10px;margin-top:8px;">
        <div style="font-size:11px;color:#81c784;margin-bottom:6px;">🔑 GitHub Token（仅存本地浏览器，不上传）</div>

<script>
// ============================================================
// STATE
// ============================================================
const LAYERS = [
  { id: 'ground_low',  label: '地块底层',   desc: '水/泥土基底' },
  { id: 'ground_high', label: '地块上层',   desc: '草地/路/农田（默认编辑层）' },
  { id: 'decor',       label: '装饰层',     desc: '花草/石头/小物件' },
  { id: 'overlay',     label: '叠加层',     desc: '过渡/混合效果' },
  { id: 'above',       label: '遮挡层',     desc: '树冠/屋顶，盖在角色上' },
  { id: 'block',       label: '阻挡层',     desc: '碰撞（红色半透明 🚫）' },
  { id: 'spawn',       label: '刷新点层',   desc: '多刷新点，点击管理' },
];

const TILE_TYPES = [
  // ── 地形 ──
  { id: 0,  name: '草地',   emoji: '🌿', color: '#4caf50', autoBlock: false, group: '地形' },
  { id: 1,  name: '泥土',   emoji: '🟫', color: '#795548', autoBlock: false, group: '地形' },
  { id: 2,  name: '耕地',   emoji: '🟧', color: '#a1887f', autoBlock: false, group: '地形' },
  { id: 8,  name: '小路',   emoji: '🛤️',  color: '#bcaaa4', autoBlock: false, group: '地形' },
  { id: 9,  name: '水域',   emoji: '💧', color: '#1976d2', autoBlock: true,  group: '地形' },
  { id: 18, name: '悬崖',   emoji: '🪨', color: '#546e7a', autoBlock: true,  group: '地形' },
  // ── 建筑/设施 ──
  { id: 7,  name: '树木',   emoji: '🌳', color: '#388e3c', autoBlock: true,  group: '建筑' },
  { id: 4,  name: '房屋',   emoji: '🏠', color: '#e65100', autoBlock: true,  group: '建筑' },
  { id: 5,  name: '水井',   emoji: '⛲', color: '#0288d1', autoBlock: true,  group: '建筑' },
  { id: 6,  name: '商店',   emoji: '🏪', color: '#7b1fa2', autoBlock: true,  group: '建筑' },
  // ── 装饰物 ──
  { id: 10, name: '石头',   emoji: '🪨', color: '#90a4ae', autoBlock: true,  group: '装饰物' },
  { id: 11, name: '花朵',   emoji: '🌸', color: '#f48fb1', autoBlock: false, group: '装饰物' },
  { id: 12, name: '草丛',   emoji: '🌾', color: '#66bb6a', autoBlock: false, group: '装饰物' },
  { id: 13, name: '灌木',   emoji: '🌿', color: '#43a047', autoBlock: true,  group: '装饰物' },
  { id: 14, name: '蘑菇',   emoji: '🍄', color: '#ef9a9a', autoBlock: false, group: '装饰物' },
  { id: 15, name: '木桩',   emoji: '🪵', color: '#8d6e63', autoBlock: true,  group: '装饰物' },
  { id: 16, name: '篱笆',   emoji: '🚧', color: '#ffcc80', autoBlock: true,  group: '装饰物' },
  { id: 17, name: '枯树',   emoji: '🪵', color: '#a1887f', autoBlock: true,  group: '装饰物' },
];

const SPAWN_TYPE_EMOJI = { plant:'🌿', monster:'👾', npc:'🧑', item:'💎', custom:'⚙' };

let state = {
  cols: 18, rows: 14,
  cellSize: 40,
  currentLayer: 'ground_high',
  // currentTile moved above
  currentTool: 'pencil',
  layerVisible: Object.fromEntries(LAYERS.map(l => [l.id, true])),
  atlasVisible: Object.fromEntries(LAYERS.map(l => [l.id, true])),
  currentTile: null, // null = 「无」，不修改格子
  // tiles[layerIdx][row][col] = tileId or null
  tiles: null,
  // blocked[row][col] = bool
  blocked: null,
  // spawns[row][col] = [{id,name,type,color}]
  spawns: null,
  spawnTemplates: [],
  isDrawing: false,
  lastCell: null,
  spawnEditCell: null,  // {row, col}
};

function initMapData(cols, rows) {
  state.cols = cols;
  state.rows = rows;
  state.tiles = LAYERS.map(() =>
    Array.from({length: rows}, () => new Array(cols).fill(null))
  );
  state.blocked = Array.from({length: rows}, () => new Array(cols).fill(false));
  state.spawns  = Array.from({length: rows}, () =>
    Array.from({length: cols}, () => [])
  );
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', () => {
  // 竖/横屏切换监听（JS备用，CSS媒体查询主力）
  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    document.getElementById('portrait-warn').style.display = isPortrait ? 'flex' : 'none';
    document.getElementById('rotate-wrapper').style.display  = isPortrait ? 'none' : 'flex';
  }
  checkOrientation();
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));

window.forceEnter = function() {
  document.getElementById('portrait-warn').style.display = 'none';
  document.getElementById('rotate-wrapper').style.display = 'flex';
};

  initMapData(state.cols, state.rows);
  buildLayerButtons();
  buildTileGrid();
  buildVisibilityList();
  setupCanvas();
  render();
  updateStatus();
  loadLatestSave();
  initAtlas();
});

// ============================================================
// PANEL / TAB
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach((b,i) => {
    const ids = ['layers','tiles','atlas','tools'];
    b.classList.toggle('active', ids[i] === tab);
  });
  document.querySelectorAll('.panel-content').forEach(c => {
    c.classList.remove('active');
    c.style.display = 'none';
  });
  const el = document.getElementById('tab-' + tab);
  if(el){ el.classList.add('active'); el.style.display = 'flex'; }
}

function buildLayerButtons() {
  const container = document.getElementById('layer-buttons');
  container.innerHTML = '';
  LAYERS.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'layer-btn' + (l.id === state.currentLayer ? ' active' : '');
    btn.id = 'lbtn-' + l.id;
    btn.textContent = l.label + (l.id === 'block' ? ' 🚫' : l.id === 'spawn' ? ' 🌱' : '');
    btn.onclick = () => selectLayer(l.id);
    container.appendChild(btn);
  });
  updateLayerDesc();
}

function selectLayer(id) {
  state.currentLayer = id;
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('lbtn-' + id);
  if (btn) btn.classList.add('active');
  updateLayerDesc();
  updateStatus();
}

function updateLayerDesc() {
  const l = LAYERS.find(l => l.id === state.currentLayer);
  document.getElementById('layer-desc-text').textContent = l ? `${l.label}：${l.desc}` : '';
}

function buildTileGrid() {
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = '';

  // 「无」按鈕
  const noneBtn = document.createElement('button');
  noneBtn.className = 'tile-btn' + (state.currentTile === null ? ' active' : '');
  noneBtn.id = 'tbtn-none';
  noneBtn.style.cssText = 'background:#1a2a1a;border-color:#4caf5055;grid-column:1/-1;';
  noneBtn.innerHTML = `⚪<span>无（查看模式）</span>`;
  noneBtn.onclick = () => selectTile(null);
  grid.appendChild(noneBtn);

  // 按分组显示
  const groups = [...new Set(TILE_TYPES.map(t => t.group))];
  groups.forEach(group => {
    const header = document.createElement('div');
    header.style.cssText = 'grid-column:1/-1;font-size:10px;color:#81c784;padding:4px 2px 1px;border-top:1px solid #2e7d3266;margin-top:2px;';
    header.textContent = `― ${group} ―`;
    grid.appendChild(header);
    TILE_TYPES.filter(t => t.group === group).forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tile-btn' + (t.id === state.currentTile ? ' active' : '');
      btn.id = 'tbtn-' + t.id;
      btn.style.background = t.color + '33';
      btn.style.borderColor = t.id === state.currentTile ? '#ffca28' : t.color + '88';
      btn.innerHTML = `${t.emoji}<span>${t.name}</span>`;
      btn.onclick = () => selectTile(t.id);
      grid.appendChild(btn);
    });
  });
}

function selectTile(id) {
  state.currentTile = id;
  // 选择地块类型时，清除图集选中（地块模式和图集模式互斥）
  selectedAtlasTile = null;
  document.querySelectorAll('[data-atlas-cell]').forEach(el => {
    el.style.borderColor = '#3a5020';
    el.style.boxShadow = '';
  });
  document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
  if (id === null) {
    const nb = document.getElementById('tbtn-none');
    if (nb) { nb.classList.add('active'); nb.style.borderColor = '#ffca28'; }
    document.getElementById('status-tile').textContent = '地块: 无（查看模式）';
    return;
  }
  const t = TILE_TYPES.find(t => t.id === id);
  const btn = document.getElementById('tbtn-' + id);
  if (btn) {
    btn.classList.add('active');
    btn.style.borderColor = '#ffca28';
  }
  document.querySelectorAll('.tile-btn:not(.active)').forEach(b => {
    const tid = parseInt(b.id.replace('tbtn-',''));
    const tt = TILE_TYPES.find(x => x.id === tid);
    if (tt) b.style.borderColor = tt.color + '88';
  });
  updateStatus();
}

function buildVisibilityList() {
  const container = document.getElementById('vis-list');
  container.innerHTML = '';
  LAYERS.forEach(l => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:4px;padding:2px 0;';

    // 层可见性
    const visCb = document.createElement('input');
    visCb.type = 'checkbox';
    visCb.checked = state.layerVisible[l.id];
    visCb.title = '层显示/隐藏';
    visCb.onchange = () => { state.layerVisible[l.id] = visCb.checked; fullRender(); };

    // 层名
    const label = document.createElement('span');
    label.textContent = l.label;
    label.style.cssText = 'flex:1;font-size:11px;';

    // 图集开关
    const atlasBtn = document.createElement('button');
    atlasBtn.className = 'btn-sm';
    atlasBtn.style.cssText = `font-size:10px;padding:1px 5px;border-radius:3px;cursor:pointer;border:1px solid #4caf5066;background:${ state.atlasVisible[l.id] ? '#2e4a2e' : '#3a1a1a'};color:${ state.atlasVisible[l.id] ? '#a5d6a7' : '#ef9a9a'};`;
    atlasBtn.textContent = state.atlasVisible[l.id] ? '🖼图集' : '🎞色块';
    atlasBtn.title = '切换图集显示 / 色块显示';
    atlasBtn.onclick = () => {
      state.atlasVisible[l.id] = !state.atlasVisible[l.id];
      atlasBtn.textContent = state.atlasVisible[l.id] ? '🖼图集' : '🎞色块';
      atlasBtn.style.background = state.atlasVisible[l.id] ? '#2e4a2e' : '#3a1a1a';
      atlasBtn.style.color = state.atlasVisible[l.id] ? '#a5d6a7' : '#ef9a9a';
      fullRender();
    };

    row.appendChild(visCb);
    row.appendChild(label);
    row.appendChild(atlasBtn);
    container.appendChild(row);
  });
}

function setTool(t) {
  state.currentTool = t;
  ['pencil','fill','eraser'].forEach(id => {
    document.getElementById('tool-' + id).classList.toggle('active', id === t);
  });
  updateStatus();
}

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');

function setupCanvas() {
  resizeCanvas();
}

function resizeCanvas() {
  canvas.width  = state.cols * state.cellSize;
  canvas.height = state.rows * state.cellSize;
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const cs = state.cellSize;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Render order: ground_low → ground_high → decor → overlay → above → block → spawn
  LAYERS.forEach((layer, li) => {
    if (!state.layerVisible[layer.id]) return;

    if (layer.id === 'block') {
      renderBlockLayer(li, cs);
    } else if (layer.id === 'spawn') {
      renderSpawnLayer(cs);
    } else {
      renderTileLayer(layer, li, cs);
    }
  });

  // Grid lines
  ctx.strokeStyle = 'rgba(0,60,0,0.5)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= state.cols; c++) {
    ctx.beginPath(); ctx.moveTo(c * cs, 0); ctx.lineTo(c * cs, canvas.height); ctx.stroke();
  }
  for (let r = 0; r <= state.rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * cs); ctx.lineTo(canvas.width, r * cs); ctx.stroke();
  }
}

// 各层的默认色（关闭图集且无地块类型时回退用）
const LAYER_FALLBACK_COLORS = {
  ground_low:  '#78909c',
  ground_high: '#4caf50',
  decor:       '#aed581',
  overlay:     '#ffd54f',
  above:       '#a5d6a7',
};

function renderTileLayer(layer, li, cs) {
  const emoji_size = Math.max(12, cs * 0.5);
  ctx.font = `${emoji_size}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const val = state.tiles[li][r][c];
      if (val === null) continue;
      const x = c * cs, y = r * cs;

      // ── 图集对象（所有层通用）──
      if (val && typeof val === 'object' && val.atlas) {
        if (state.atlasVisible[layer.id]) {
          renderAtlasCellOnCanvas(ctx, val, x, y, cs);
        } else {
          // 图集关闭：优先回退到 tileId 对应地块类型显示
          const t = (val.tileId !== null && val.tileId !== undefined)
            ? TILE_TYPES.find(t => t.id === val.tileId) : null;
          if (t) {
            ctx.fillStyle = t.color + 'cc';
            ctx.fillRect(x, y, cs, cs);
            ctx.font = `${emoji_size}px serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t.emoji, x + cs/2, y + cs/2);
          } else {
            const fc = LAYER_FALLBACK_COLORS[layer.id] || '#90a4ae';
            ctx.fillStyle = fc + '88';
            ctx.fillRect(x, y, cs, cs);
            ctx.fillStyle = '#c8e6c9';
            ctx.font = `${Math.max(10, cs*0.38)}px serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🖼', x + cs/2, y + cs/2);
          }
        }
      // ── 地块类型 ID（整数，所有层通用）──
      } else if (typeof val === 'number') {
        const t = TILE_TYPES.find(t => t.id === val);
        if (!t) continue;
        ctx.fillStyle = t.color + 'cc';
        ctx.fillRect(x, y, cs, cs);
        ctx.font = `${emoji_size}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(t.emoji, x + cs/2, y + cs/2);
      // ── 旧格式兼容：非数字非图集对象（如 null 已 continue，其余显示回退色）──
      } else {
        const fc = LAYER_FALLBACK_COLORS[layer.id] || '#90a4ae';
        ctx.fillStyle = fc + '88';
        ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);
        ctx.fillStyle = fc;
        ctx.beginPath();
        ctx.arc(x + cs/2, y + cs/2, cs * 0.2, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}

// 图集图片缓存
const atlasImgCache = {};
function renderAtlasCellOnCanvas(ctx, val, x, y, cs) {
  const src = val.src;
  if (!atlasImgCache[src]) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { atlasImgCache[src] = img; fullRender(); };
    img.src = ATLAS_BASE_URL + src + '?t=1';
    atlasImgCache[src] = 'loading';
    // 加载中显示占位色
    ctx.fillStyle = '#4a6a4a88';
    ctx.fillRect(x, y, cs, cs);
    return;
  }
  if (atlasImgCache[src] === 'loading') {
    ctx.fillStyle = '#4a6a4a88'; ctx.fillRect(x, y, cs, cs); return;
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(atlasImgCache[src], val.sx, val.sy, val.tileSize, val.tileSize, x, y, cs, cs);
}

function renderBlockLayer(li, cs) {
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      if (!state.blocked[r][c]) continue;
      const x = c * cs, y = r * cs;
      ctx.fillStyle = 'rgba(220,50,50,0.35)';
      ctx.fillRect(x, y, cs, cs);
      ctx.strokeStyle = 'rgba(220,50,50,0.7)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cs - 1, cs - 1);
      // 🚫 emoji
      const fs = Math.max(10, cs * 0.45);
      ctx.font = `${fs}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText('🚫', x + cs/2, y + cs/2);
    }
  }
}

function renderSpawnLayer(cs) {
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const spawns = state.spawns[r][c];
      if (!spawns || spawns.length === 0) continue;
      const x = c * cs, y = r * cs;
      const maxDots = Math.min(spawns.length, 6);
      const dotR = Math.max(3, cs * 0.12);
      const padding = dotR + 1;
      const totalW = maxDots * dotR * 2 + (maxDots - 1) * 2;
      let startX = x + cs/2 - totalW/2 + dotR;
      const dotY = y + cs - padding - dotR;

      spawns.slice(0, maxDots).forEach((sp, i) => {
        ctx.fillStyle = sp.color || '#4caf50';
        ctx.beginPath();
        ctx.arc(startX + i * (dotR * 2 + 2), dotY, dotR, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      });

      if (spawns.length > maxDots) {
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(8, cs * 0.18)}px sans-serif`;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`+${spawns.length - maxDots}`, x + cs - 2, y + cs - 1);
      }
    }
  }
}

// Hover highlight
let hoverCell = null;
function renderHover() {
  if (!hoverCell) return;
  const cs = state.cellSize;
  const {r, c} = hoverCell;
  ctx.strokeStyle = 'rgba(255,255,100,0.7)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(c * cs + 0.75, r * cs + 0.75, cs - 1.5, cs - 1.5);
}

function fullRender() {
  render();
  renderHover();
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  const cell = getCellFromEvent(e);
  if (!cell) return;
  e.preventDefault();

  if (state.currentLayer === 'spawn' && e.button === 0) {
    openSpawnCellModal(cell.r, cell.c);

  // 查看模式（无画笔）下点击显示格子地块信息

});

canvas.addEventListener('mousemove', e => {
  const cell = getCellFromEvent(e);
  hoverCell = cell;

  if (cell) {
    document.getElementById('status-pos').textContent = `鼠标: (${cell.c}, ${cell.r})`;

    const key = cell.r + '_' + cell.c;
    if (state.lastCell !== key) {

});

canvas.addEventListener('mouseup', () => { state.isDrawing = false; state.lastCell = null; });
canvas.addEventListener('mouseleave', () => {
  state.isDrawing = false;

let toastTimer = null;

// 当前查看格子缓存（用于复制画笔）
let currentCellCache = null; // { r, c, val }

function updateCellInfo(r, c) {
  const layer = state.currentLayer;
  const copyBtn = document.getElementById('status-copy-btn');
  currentCellCache = null;

  if (layer === 'block') {
    const blocked = state.blocked[r][c];
    document.getElementById('status-tile').textContent = `格子: ${blocked ? '🚫 阑挡' : '-'}`;
    copyBtn.style.display = 'none';
    return;
  }
  if (layer === 'spawn') {
    const spawns = state.spawns[r][c] || [];
    document.getElementById('status-tile').textContent = `格子: ${spawns.length > 0 ? '🌱 ' + spawns.map(s => s.name).join(', ') : '-'}`;
    copyBtn.style.display = 'none';
    return;
  }

  const li = LAYERS.findIndex(l => l.id === layer);
  const val = state.tiles[li][r][c];

  if (val === null) {
    document.getElementById('status-tile').textContent = '格子: -';
    copyBtn.style.display = 'none';
    currentCellCache = null;
    return;
  }

  if (val && typeof val === 'object' && val.atlas) {
    // 图集+地块类型组合
    const t = (val.tileId !== null && val.tileId !== undefined) ? TILE_TYPES.find(t => t.id === val.tileId) : null;
    const tileLabel = t ? `${t.emoji}${t.name}` : '无类型';
    const atlasLabel = val.label || '图集';
    document.getElementById('status-tile').textContent = `格子: ${tileLabel} | 🖼 ${atlasLabel}`;
    copyBtn.style.display = 'inline-block';
    currentCellCache = { r, c, val };
    return;
  }

  // 纯地块类型
  const t = TILE_TYPES.find(t => t.id === val);
  document.getElementById('status-tile').textContent = t ? `格子: ${t.emoji}${t.name}` : '格子: -';
  copyBtn.style.display = t ? 'inline-block' : 'none';
  currentCellCache = t ? { r, c, val } : null;
}

// 复制画笔：从当前悬停格子复制地块类型+图集作为画笔
function copyCellBrush() {
  if (!currentCellCache) return;
  const val = currentCellCache.val;

  if (val && typeof val === 'object' && val.atlas) {
    // 先设 selectedAtlasTile（不能先调 selectTile，否则会把 selectedAtlasTile 清掉）
    selectedAtlasTile = { src: val.src, sx: val.sx, sy: val.sy, tileSize: val.tileSize, label: val.label };
    // 再设地块类型（直接操作 state，不调 selectTile 避免图集被清）
    if (val.tileId !== null && val.tileId !== undefined) {
      state.currentTile = val.tileId;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('tbtn-' + val.tileId);
      if (btn) { btn.classList.add('active'); btn.style.borderColor = '#ffca28'; }
    }
    const t = val.tileId !== null ? TILE_TYPES.find(t => t.id === val.tileId) : null;
    const tileLabel = t ? `${t.emoji}${t.name}` : '无类型';
    document.getElementById('status-tile').textContent = `地块: ${tileLabel} | 🖼 ${val.label || '图集'}`;
    showToast(`✅ 已复制画笔：${tileLabel} + ${val.label || '图集'}，切层后可直接绘制`, 2000);
  } else if (typeof val === 'number') {
    // 纯地块类型
    selectTile(val);
    const t = TILE_TYPES.find(t => t.id === val);
    showToast(`✅ 已复制画笔：${t?.emoji || ''}${t?.name || ''}`, 1800);
  }
}

function getCellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cs = state.cellSize;
  const c = Math.floor(x / cs);
  const r = Math.floor(y / cs);
  if (c < 0 || c >= state.cols || r < 0 || r >= state.rows) return null;
  return { r, c };
}

function applyTool(cell, forceErase) {
  const { r, c } = cell;
  const layer = state.currentLayer;
  const tool = forceErase ? 'eraser' : state.currentTool;

  // 「无」模式：不是橡皮就什么都不做
  if (state.currentTile === null && !selectedAtlasTile && tool !== 'eraser') return;

  // 图集画笔但未选地块类型：拦截并提示
  if (selectedAtlasTile && state.currentTile === null && tool !== 'eraser') {
    showToast('⚠️ 请先在「🎨 地块」选项卡选择地块类型，再使用图集绘制');
    return;
  }

  if (layer === 'spawn') return;

  if (layer === 'block') {
    if (tool === 'eraser') {
      state.blocked[r][c] = false;
    } else if (tool === 'pencil') {
      state.blocked[r][c] = true;
    } else if (tool === 'fill') {
      floodFillBlock(r, c, true);
    }
    fullRender();
    return;
  }

  const li = LAYERS.findIndex(l => l.id === layer);

  // 当前画笔：图集模式 or 地块类型模式（所有层通用）
  const brushValue = getBrushValue(layer);

  if (tool === 'eraser') {
    state.tiles[li][r][c] = null;
    if (layer === 'ground_high') recalcBlock(r, c); // 只有 ground_high 联动阻挡层
  } else if (tool === 'pencil') {
    if (brushValue === undefined) return; // 无有效画笔
    state.tiles[li][r][c] = brushValue;
    if (layer === 'ground_high') recalcBlock(r, c);
  } else if (tool === 'fill') {
    if (brushValue === undefined) return;
    const target = JSON.stringify(state.tiles[li][r][c]);
    floodFillGeneric(li, r, c, target, brushValue);
  }
  fullRender();
}

// 获取当前画笔值：图集选中时返回图集对象，否则返回地块类型ID（所有层通用）
function getBrushValue(layer) {
  if (selectedAtlasTile) {
    // 图集模式：带上当前地块类型ID（关闭图集时回退显示用，所有层均支持）
    return {
      atlas: true,
      src: selectedAtlasTile.src,
      sx: selectedAtlasTile.sx,
      sy: selectedAtlasTile.sy,
      tileSize: selectedAtlasTile.tileSize,
      label: selectedAtlasTile.label,
      tileId: state.currentTile !== null ? state.currentTile : null
    };
  }
  // 地块类型模式：所有层均支持（null = 无画笔/查看模式）
  if (state.currentTile === null) return undefined;
  return state.currentTile;
}

function floodFillGeneric(li, r, c, targetStr, fill) {
  const stack = [{r, c}];
  const visited = new Set();
  while (stack.length) {
    const {r: cr, c: cc} = stack.pop();
    const key = cr * 100000 + cc;
    if (visited.has(key)) continue;
    if (cr < 0 || cr >= state.rows || cc < 0 || cc >= state.cols) continue;
    if (JSON.stringify(state.tiles[li][cr][cc]) !== targetStr) continue;
    visited.add(key);
    state.tiles[li][cr][cc] = fill;
    stack.push({r:cr-1,c:cc},{r:cr+1,c:cc},{r:cr,c:cc-1},{r:cr,c:cc+1});
  }
}

function recalcBlock(r, c) {
  const li = LAYERS.findIndex(l => l.id === 'ground_high');
  const val = state.tiles[li][r][c];
  if (val === null) {
    state.blocked[r][c] = false;
    return;
  }
  const t = TILE_TYPES.find(t => t.id === val);
  if (t && t.autoBlock) state.blocked[r][c] = true;
  else if (t && !t.autoBlock) {
    // Only clear if block was set by auto, not manual
    // We just leave manual blocks alone and only auto-set
  }
}

function floodFill(li, r, c, target, fill) {
  const stack = [{r, c}];
  const visited = new Set();
  while (stack.length) {
    const {r: cr, c: cc} = stack.pop();
    const key = cr * 100000 + cc;
    if (visited.has(key)) continue;
    if (cr < 0 || cr >= state.rows || cc < 0 || cc >= state.cols) continue;
    if (state.tiles[li][cr][cc] !== target) continue;
    visited.add(key);
    state.tiles[li][cr][cc] = fill;
    if (li === LAYERS.findIndex(l => l.id === 'ground_high')) recalcBlock(cr, cc);
    stack.push({r:cr-1,c:cc},{r:cr+1,c:cc},{r:cr,c:cc-1},{r:cr,c:cc+1});
  }
}

function floodFillBlock(r, c, val) {
  const target = state.blocked[r][c];
  const stack = [{r, c}];
  const visited = new Set();
  while (stack.length) {
    const {r: cr, c: cc} = stack.pop();
    const key = cr * 100000 + cc;
    if (visited.has(key)) continue;
    if (cr < 0 || cr >= state.rows || cc < 0 || cc >= state.cols) continue;
    if (state.blocked[cr][cc] !== target) continue;
    visited.add(key);
    state.blocked[cr][cc] = val;
    stack.push({r:cr-1,c:cc},{r:cr+1,c:cc},{r:cr,c:cc-1},{r:cr,c:cc+1});
  }
}

// ============================================================
// TOOLBAR ACTIONS
// ============================================================
function changeCellSize(val) {
  state.cellSize = parseInt(val);
  resizeCanvas();
  fullRender();
}

function resizeMap() {
  const nc = Math.max(1, Math.min(99999, parseInt(document.getElementById('input-cols').value) || state.cols));
  const nr = Math.max(1, Math.min(99999, parseInt(document.getElementById('input-rows').value) || state.rows));
  if (nc === state.cols && nr === state.rows) return;

  // Resize tiles
  LAYERS.forEach((layer, li) => {
    const newLayer = Array.from({length: nr}, (_, r) =>
      Array.from({length: nc}, (_, c) =>
        (r < state.rows && c < state.cols) ? state.tiles[li][r][c] : null
      )
    );
    state.tiles[li] = newLayer;
  });

  const newBlocked = Array.from({length: nr}, (_, r) =>
    Array.from({length: nc}, (_, c) =>
      (r < state.rows && c < state.cols) ? state.blocked[r][c] : false
    )
  );

  const newSpawns = Array.from({length: nr}, (_, r) =>
    Array.from({length: nc}, (_, c) =>
      (r < state.rows && c < state.cols) ? state.spawns[r][c] : []
    )
  );

  state.cols = nc;
  state.rows = nr;
  state.blocked = newBlocked;
  state.spawns = newSpawns;
  resizeCanvas();
  fullRender();
}

function fillCurrentLayer() {
  const layer = state.currentLayer;
  if (layer === 'spawn') return;

  if (layer === 'block') {
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        state.blocked[r][c] = true;
    fullRender(); return;
  }

  const li = LAYERS.findIndex(l => l.id === layer);
  const brushValue = getBrushValue(layer);
  if (brushValue === undefined) return; // 无有效画笔
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      state.tiles[li][r][c] = brushValue;
      if (layer === 'ground_high') recalcBlock(r, c);
    }
  fullRender();
}

function clearCurrentLayer() {
  const layer = state.currentLayer;
  if (layer === 'spawn') {
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        state.spawns[r][c] = [];
    fullRender(); return;
  }
  if (layer === 'block') {
    for (let r = 0; r < state.rows; r++)
      for (let c = 0; c < state.cols; c++)
        state.blocked[r][c] = false;
    fullRender(); return;
  }
  const li = LAYERS.findIndex(l => l.id === layer);
  for (let r = 0; r < state.rows; r++)
    for (let c = 0; c < state.cols; c++) {
      state.tiles[li][r][c] = null;
      if (layer === 'ground_high') recalcBlock(r, c);
    }
  fullRender();
}

const SAVE_KEY = 'farm_map_saves';

function getSaves() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); }
  catch { return []; }
}
function setSaves(saves) {
  localStorage.setItem(SAVE_KEY, JSON.stringify(saves));
}

function currentMapData() {
  return {
    cols: state.cols,
    rows: state.rows,
    tiles: state.tiles.map(layer => layer.map(row => [...row])),
    blocked: state.blocked.map(row => [...row]),
    spawns: state.spawns.map(row => row.map(cell => [...cell])),
    spawnTemplates: [...state.spawnTemplates],
  };
}

function loadMapData(data) {
  state.cols = data.cols;
  state.rows = data.rows;
  // Ensure 7 layers
  state.tiles = LAYERS.map((l, li) =>
    (data.tiles && data.tiles[li])
      ? data.tiles[li].map(row => [...row])
      : Array.from({length: state.rows}, () => new Array(state.cols).fill(null))
  );
  state.blocked = (data.blocked || []).map(row => [...row]);
  if (state.blocked.length < state.rows)
    for (let i = state.blocked.length; i < state.rows; i++)
      state.blocked.push(new Array(state.cols).fill(false));

  state.spawns = (data.spawns || []).map(row => row.map(cell => [...(cell || [])]));
  if (state.spawns.length < state.rows)
    for (let i = state.spawns.length; i < state.rows; i++)
      state.spawns.push(Array.from({length: state.cols}, () => []));

  state.spawnTemplates = data.spawnTemplates || [];

  document.getElementById('input-cols').value = state.cols;
  document.getElementById('input-rows').value = state.rows;
  resizeCanvas();
  fullRender();
}

function loadLatestSave() {
  // 优先尝试云端，失败后回退本地
  loadLatestCloudSave().then(ok => {
    if (!ok) {
      const saves = getSaves();
      if (saves.length === 0) return;
      saves.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));

}

function showSaveModal() {
  renderSaveList();
  refreshGhTokenStatus();
  openModal('save-modal');
}

function switchSaveTab(tab) {
  document.getElementById('save-panel-local').style.display = tab === 'local' ? '' : 'none';
  document.getElementById('save-panel-cloud').style.display = tab === 'cloud' ? '' : 'none';
  document.getElementById('save-tab-local').style.background = tab === 'local' ? '#2e4a2e' : '#1e3a1e';
  document.getElementById('save-tab-cloud').style.background = tab === 'cloud' ? '#2e4a2e' : '#1e3a1e';

}

function renderSaveList() {
  const saves = getSaves().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  const container = document.getElementById('save-list');
  if (saves.length === 0) {
    container.innerHTML = '<p style="color:#6a9a6a;padding:8px;">暂无存档</p>';
    return;
  }
  container.innerHTML = saves.map((s, i) => {
    const dt = s.savedAt ? new Date(s.savedAt).toLocaleString('zh-CN') : '-';
    return `
    <div class="save-item">
      <div class="save-item-info">
        <div class="save-item-name">${esc(s.name)}</div>
        <div class="save-item-meta">${s.data.cols}×${s.data.rows} · ${dt}</div>
      </div>
      <div class="save-item-btns">
        <button class="btn-sm" onclick="loadSave(${i})">载入</button>
        <button class="btn-sm" onclick="overwriteSave(${i})">覆盖</button>
        <button class="btn-sm" onclick="copySave(${i})">复制</button>
        <button class="btn-sm danger" onclick="deleteSave(${i})">删除</button>
      </div>
    </div>`;
  }).join('');
}

function saveNew() {
  const name = document.getElementById('new-save-name').value.trim() || '存档';
  const saves = getSaves();
  saves.push({ name, savedAt: Date.now(), data: currentMapData() });
  setSaves(saves);
  renderSaveList();
}

function loadSave(idx) {
  const saves = getSaves().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  if (!saves[idx]) return;
  loadMapData(saves[idx].data);
  closeModal('save-modal');
}

function overwriteSave(idx) {
  const saves = getSaves().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  if (!saves[idx]) return;
  saves[idx].data = currentMapData();
  saves[idx].savedAt = Date.now();
  setSaves(saves);
  renderSaveList();
}

function copySave(idx) {
  const saves = getSaves().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  if (!saves[idx]) return;
  const copy = JSON.parse(JSON.stringify(saves[idx]));
  copy.name = copy.name + '_副本';
  copy.savedAt = Date.now();
  saves.push(copy);
  setSaves(saves);
  renderSaveList();
}

function deleteSave(idx) {
  const saves = getSaves().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
  if (!confirm(`确认删除存档"${saves[idx]?.name}"？`)) return;
  saves.splice(idx, 1);
  setSaves(saves);
  renderSaveList();
}

  if (!el) return;
  const t = getGhToken();
  el.textContent = t ? `\u2705 Token 已设置（${t.slice(0,8)}...\uff09` : '\u26a0\ufe0f 未设置 Token，云存档功能不可用';
  el.style.color = t ? '#81c784' : '#ffb74d';
}

function ghHeaders() {
  return {
    'Authorization': `token ${getGhToken()}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}

// 获取文件的 SHA（用于覆盖保存）
async function getFileSha(path) {
  try {
    const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`, { headers: ghHeaders() });
    if (!r.ok) return null;
    const j = await r.json();
    return j.sha || null;
  } catch { return null; }
}

// 保存文件到仓库
async function ghPutFile(path, content, message) {
  const sha = await getFileSha(path);
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(content))),
    ...(sha ? { sha } : {})
  };
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: ghHeaders(),
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const e = await r.json();
    throw new Error(e.message || r.status);
  }
  return await r.json();
}

// 列出仓库存档目录
async function ghListSaves() {
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_SAVES_DIR}`, {
    headers: ghHeaders()
  });
  if (r.status === 404) return []; // 目录不存在
  if (!r.ok) throw new Error(await r.text());
  const files = await r.json();
  return files.filter(f => f.name.endsWith('.json')).sort((a, b) => b.name.localeCompare(a.name));
}

// 下载某个存档文件
async function ghGetFile(path) {
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`, { headers: ghHeaders() });
  if (!r.ok) throw new Error(await r.text());
  const j = await r.json();
  return decodeURIComponent(escape(atob(j.content.replace(/\n/g, ''))));
}

// 删除存档文件
async function ghDeleteFile(path) {
  const sha = await getFileSha(path);
  if (!sha) return;
  await fetch(`${GH_API}/repos/${GH_REPO}/contents/${path}`, {
    method: 'DELETE',
    headers: ghHeaders(),
    body: JSON.stringify({ message: `删除存档: ${path}`, sha })
  });
}

// 保存到仓库
async function cloudSaveNew() {
  const token = getGhToken();
  if (!token) { showToast('\u26a0\ufe0f 请先设置 GitHub Token'); return; }
  let name = (document.getElementById('cloud-save-name').value.trim() || 'map_save')
    .replace(/[^a-zA-Z0-9_\-一-鿿]/g, '_');
  const ts  = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const filename = `${name}_${ts}.json`;
  const path = `${GH_SAVES_DIR}/${filename}`;
  const content = JSON.stringify({ name, savedAt: Date.now(), data: currentMapData() }, null, 2);
  showToast('\u2601\ufe0f 正在保存到仓库...', 5000);
  try {
    await ghPutFile(path, content, `地图存档: ${filename}`);
    showToast(`\u2705 已保存: ${filename}`, 3000);
    loadCloudList();
    // 同步更新本地最新云存档记录
    localStorage.setItem('farm_latest_cloud_save', path);
  } catch(e) {
    showToast(`\u274c 保存失败: ${e.message}`, 4000);
  }
}

// 刷新云存档列表
async function loadCloudList() {
  const container = document.getElementById('cloud-save-list');
  if (!container) return;
  const token = getGhToken();
  if (!token) {
    container.innerHTML = '<p style="color:#ffb74d;padding:8px;font-size:12px;">⚠\ufe0f 请先设置 GitHub Token</p>';
    return;
  }
  container.innerHTML = '<p style="color:#6a9a6a;padding:8px;font-size:12px;">加载中...</p>';
  try {
    const files = await ghListSaves();
    if (files.length === 0) {
      container.innerHTML = '<p style="color:#6a9a6a;padding:8px;font-size:12px;">暂无云存档</p>';
      return;
    }
    container.innerHTML = files.map(f => `
      <div class="save-item">
        <div class="save-item-info">
          <div class="save-item-name">${esc(f.name)}</div>
          <div class="save-item-meta">仓库存档</div>
        </div>
        <div class="save-item-btns">
          <button class="btn-sm" onclick="cloudLoadFile('${esc(f.path)}')">\u8f7d\u5165</button>
          <button class="btn-sm danger" onclick="cloudDeleteFile('${esc(f.path)}')">\u5220\u9664</button>
        </div>
      </div>`).join('');
  } catch(e) {
    container.innerHTML = `<p style="color:#ef9a9a;padding:8px;font-size:12px;">加载失败: ${esc(e.message)}</p>`;
  }
}

async function cloudLoadFile(path) {
  showToast('\u2601\ufe0f 下载中...', 5000);
  try {
    const text = await ghGetFile(path);
    const save = JSON.parse(text);
    loadMapData(save.data || save);
    closeModal('save-modal');
    showToast(`\u2705 已载入: ${path.split('/').pop()}`, 2500);
  } catch(e) {
    showToast(`\u274c 载入失败: ${e.message}`, 4000);
  }
}

async function cloudDeleteFile(path) {
  if (!confirm(`确认删除仓库存档 "${path.split('/').pop()}"？`)) return;
  try {
    await ghDeleteFile(path);
    showToast('\u5df2删除', 1500);
    loadCloudList();
  } catch(e) {
    showToast(`\u274c 删除失败: ${e.message}`, 3000);
  }
}

// 启动时自动拉取最新云存档
async function loadLatestCloudSave() {
  const token = getGhToken();
  if (!token) return;
  try {
    const files = await ghListSaves();
    if (files.length === 0) return;
    // 按文件名逆序排序，取最新的
    const latest = files[0];
    const text = await ghGetFile(latest.path);
    const save = JSON.parse(text);
    loadMapData(save.data || save);
    showToast(`\u2601\ufe0f 已自动载入最新云存档: ${latest.name}`, 3000);
    return true;
  } catch(e) {
    console.warn('自动拉取云存档失败:', e.message);
    return false;
  }
}

function downloadExport() {
  const data = document.getElementById('export-textarea').value;
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'farm_map.json'; a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        loadMapData(data);
      } catch { alert('JSON 格式错误'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============================================================
// ATLAS 图集同步（从 assets/map_editor/index.json 加载）
// ============================================================
const ATLAS_INDEX_URL = 'https://weiyi330.github.io/farm-game/assets/map_editor/index.json';
const ATLAS_BASE_URL  = 'https://weiyi330.github.io/farm-game/';
let atlasData = null;          // 加载的图集配置
let selectedAtlasTile = null;  // { src, sx, sy, tileSize, label }

async function syncAtlas() {
  const hint = document.getElementById('atlas-sync-hint');
  hint.textContent = '加载中...';
  try {
    const res = await fetch(ATLAS_INDEX_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    atlasData = await res.json();
    localStorage.setItem('farm_atlas_cache', JSON.stringify(atlasData));
    hint.textContent = `同步成功，共 ${atlasData.groups.length} 个分组`;
    renderAtlasPanel();
  } catch(e) {
    // 尝试读缓存
    const cached = localStorage.getItem('farm_atlas_cache');
    if (cached) {
      atlasData = JSON.parse(cached);
      hint.textContent = '网络失败，使用缓存（' + atlasData.groups.length + '个分组）';
      renderAtlasPanel();
    } else {
      hint.textContent = '加载失败：' + e.message;
    }
  }
}

function renderAtlasPanel() {
  const panel = document.getElementById('atlas-panel');
  if (!atlasData) { panel.innerHTML = '<div style="padding:10px;color:#81c784;font-size:11px;">点「🔄 同步图集」加载</div>'; return; }
  panel.innerHTML = '';
  atlasData.groups.forEach(group => {
    const gDiv = document.createElement('div');
    gDiv.style.cssText = 'margin-bottom:6px;';
    const gHeader = document.createElement('div');
    gHeader.style.cssText = 'font-size:11px;color:#a5d6a7;padding:3px 4px;background:#1a3a1a;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:4px;';
    gHeader.innerHTML = `<span>▼</span><b>${group.label || group.name}</b><span style="color:#607040;font-size:10px;">(${group.children.length})</span>`;
    let collapsed = false;
    const gBody = document.createElement('div');
    gHeader.onclick = () => { collapsed = !collapsed; gBody.style.display = collapsed ? 'none' : ''; gHeader.querySelector('span').textContent = collapsed ? '▶' : '▼'; };
    gDiv.appendChild(gHeader);
    group.children.forEach(child => {
      renderAtlasChild(gBody, group, child);
    });
    gDiv.appendChild(gBody);
    panel.appendChild(gDiv);
  });
}

function renderAtlasChild(container, group, child) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = ATLAS_BASE_URL + child.src + '?t=1';
  const TS = child.tileSize || 16;

  // 缓存图片
  if (!atlasImgCache[child.src]) atlasImgCache[child.src] = 'loading';
  img.onload = () => { atlasImgCache[child.src] = img; };

  const cDiv = document.createElement('div');
  cDiv.style.cssText = 'margin:4px 0 4px 8px;';
  const cHeader = document.createElement('div');
  cHeader.style.cssText = 'font-size:10px;color:#c8e6c9;padding:2px 4px;cursor:pointer;display:flex;align-items:center;gap:3px;';
  const totalTiles = child.cols * child.rows;
  cHeader.innerHTML = `<span>▼</span>${child.label||child.name} <span style="color:#607040">(${totalTiles}格)</span>`;
  let collapsed = false;
  const body = document.createElement('div');
  cHeader.onclick = () => { collapsed = !collapsed; body.style.display = collapsed?'none':''; cHeader.querySelector('span').textContent = collapsed?'▶':'▼'; };

  const makeCell = (sx, sy, tileName) => {
    const cell = document.createElement('div');
    cell.style.cssText = 'width:28px;height:28px;border:1px solid #3a5020;border-radius:2px;cursor:pointer;overflow:hidden;flex-shrink:0;';
    cell.title = tileName;
    cell.dataset.atlasCell = '1';
    const cv = document.createElement('canvas');
    cv.width = TS; cv.height = TS;
    cv.style.cssText = 'width:28px;height:28px;image-rendering:pixelated;display:block;';
    const cx = cv.getContext('2d');
    const drawCell = () => {
      if (atlasImgCache[child.src] && atlasImgCache[child.src] !== 'loading') {
        cx.drawImage(atlasImgCache[child.src], sx, sy, TS, TS, 0, 0, TS, TS);
      } else {
        img.onload = () => { atlasImgCache[child.src] = img; cx.drawImage(img, sx, sy, TS, TS, 0, 0, TS, TS); };
      }
    };
    drawCell();
    cell.appendChild(cv);
    cell.addEventListener('click', () => {
      // 清除全部选中样式
      document.querySelectorAll('[data-atlas-cell]').forEach(el => {
        el.style.borderColor = '#3a5020';
        el.style.boxShadow = '';
      });
      cell.style.borderColor = '#ffe040';
      cell.style.boxShadow = '0 0 0 1px #ffe040';
      selectedAtlasTile = { img: atlasImgCache[child.src], sx, sy, tileSize: TS, label: tileName, src: child.src };
      document.getElementById('status-tile').textContent = '地块: 🖼 ' + tileName;
    });
    return cell;
  };

  if (child.subgroups && child.subgroups.length > 0) {
    // 按 subgroup 分组显示
    const SGC = child.subgroupCols || 4;
    const SGR = child.subgroupRows || 4;
    child.subgroups.forEach(sg => {
      const sgDiv = document.createElement('div');
      sgDiv.style.cssText = 'margin:2px 0;';
      const sgHeader = document.createElement('div');
      sgHeader.style.cssText = 'font-size:10px;color:#a5d6a7;padding:1px 4px;cursor:pointer;display:flex;align-items:center;gap:3px;background:#1a3a1a;border-radius:2px;';
      sgHeader.innerHTML = `<span>▼</span>${sg.label}`;
      let sgCollapsed = true; // 默认折叠
      const sgGrid = document.createElement('div');
      const SGCELL_W = 28 + 2;
      sgGrid.style.cssText = `display:flex;flex-wrap:wrap;gap:2px;padding:3px 0;display:none;max-width:${SGC*SGCELL_W}px;`;
      sgHeader.onclick = () => { sgCollapsed=!sgCollapsed; sgGrid.style.display=sgCollapsed?'none':'flex'; sgHeader.querySelector('span').textContent=sgCollapsed?'▶':'▼'; };
      for (let dr=0; dr<SGR; dr++) {
        for (let dc=0; dc<SGC; dc++) {
          const c = sg.col + dc, r = sg.row + dr;
          if (c >= child.cols || r >= child.rows) continue;
          const idx = r * child.cols + c;
          const num = String(idx+1).padStart(2,'0');
          const tileName = `${child.name}_${num}`;
          sgGrid.appendChild(makeCell(c*TS, r*TS, tileName));
        }
      }
      sgDiv.appendChild(sgHeader);
      sgDiv.appendChild(sgGrid);
      body.appendChild(sgDiv);
    });
  } else if (child.gridMode === 'flat') {
    // 平铺模式（如四季装饰物），直接按行列顺序全部铺开
    const grid = document.createElement('div');
    grid.style.cssText = `display:flex;flex-wrap:wrap;gap:2px;padding:4px 0;`;
    for (let r=0; r<child.rows; r++) {
      for (let c=0; c<child.cols; c++) {
        const idx = r*child.cols+c;
        const num = String(idx+1).padStart(2,'0');
        grid.appendChild(makeCell(c*TS, r*TS, `${child.name}_${num}`));
      }
    }
    body.appendChild(grid);
  } else {
    // 无 subgroup：按4×4组块顺序排列
    // 扫描顺序：先横向遍历所有 hGroup，再换行到下一行 vGroup
    // 视觉效果：左→右排组块，排满自动换行
    const SGC = child.subgroupCols || 4;
    const SGR = child.subgroupRows || 4;
    const hGroups = Math.ceil(child.cols / SGC);
    const vGroups = Math.ceil(child.rows / SGR);
    // 每个组块的像素宽：SGC格 × (28px cell + 1px gap) + 2px padding + 2px border
    const blockPx = SGC * (28 + 1) + 4;
    const wrapper = document.createElement('div');
    // flex-wrap 自动折行，组块从左往右填满再换行
    wrapper.style.cssText = `display:flex;flex-wrap:wrap;gap:4px;padding:4px 0;`;
    for (let vg = 0; vg < vGroups; vg++) {
      for (let hg = 0; hg < hGroups; hg++) {
        const groupDiv = document.createElement('div');
        groupDiv.style.cssText = `display:flex;flex-wrap:wrap;gap:1px;width:${blockPx}px;border:1px solid #2a4a2a;border-radius:2px;padding:1px;flex-shrink:0;`;
        let hasContent = false;
        for (let dr = 0; dr < SGR; dr++) {
          for (let dc = 0; dc < SGC; dc++) {
            const c = hg * SGC + dc;
            const r = vg * SGR + dr;
            if (c >= child.cols || r >= child.rows) continue;
            const idx = r * child.cols + c;
            const num = String(idx+1).padStart(2,'0');
            groupDiv.appendChild(makeCell(c*TS, r*TS, `${child.name}_${num}`));
            hasContent = true;
          }
        }
        if (hasContent) wrapper.appendChild(groupDiv);
      }
    }
    body.appendChild(wrapper);
  }

  img.onerror = () => { cHeader.innerHTML += ' <span style="color:#f44">加载失败</span>'; };
  cDiv.appendChild(cHeader);
  cDiv.appendChild(body);
  container.appendChild(cDiv);
}
