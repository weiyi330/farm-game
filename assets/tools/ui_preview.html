<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏主界面预览</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
canvas { max-width: 100%; max-height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="./ui_components.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// 按背景图比例
const W = 1366, H = 768;
canvas.width  = W;
canvas.height = H;

const bg = new Image();
bg.src = '../images/ui/home/ui_home_bg.jpg';
bg.onload = () => {
  draw();
};

// 按钮配置：三个按钮居中排列
const btnW = 320, btnH = 74;
const btnX = (W - btnW) / 2;
const gap  = 20;
// 垂直居中偏下一点（主界面按钮区）
const startY = H * 0.54;

const buttons = [
  new PixelButton(canvas, { text: '登录游戏', x: btnX, y: startY,              w: btnW, h: btnH, style: 'yellow' }),
  new PixelButton(canvas, { text: '载入存档', x: btnX, y: startY + btnH + gap, w: btnW, h: btnH, style: 'yellow' }),
  new PixelButton(canvas, { text: '游戏设置', x: btnX, y: startY + (btnH + gap) * 2, w: btnW, h: btnH, style: 'blue' }),
];

function draw() {
  // 背景
  ctx.drawImage(bg, 0, 0, W, H);
  // 按钮区半透明遮罩（让按钮更突出）
  const maskX = btnX - 30;
  const maskY = startY - 20;
  const maskW = btnW + 60;
  const maskH = btnH * 3 + gap * 2 + 40;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.roundRect(maskX, maskY, maskW, maskH, 12);
  ctx.fill();
  // 绘制按钮
  buttons.forEach(b => b.draw());
}

buttons.forEach(b => { b.onClick = () => alert(b.text); });
</script>
</body>
</html>
