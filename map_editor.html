<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃源农场 - 地图编辑器 v3</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a2a1a; color:#e8e0c8; font-family:'STKaiti','KaiTi',sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden; font-size:13px; }

/* ─── 顶栏 ─── */
#topbar { background:#2a3a1a; border-bottom:1px solid #4a6a2a; padding:6px 10px;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; flex-shrink:0; }
#topbar h1 { font-size:14px; color:#c8e080; margin-right:2px; white-space:nowrap; }
.btn { padding:4px 9px; border-radius:5px; border:none; cursor:pointer; font-size:12px; font-family:inherit; white-space:nowrap; }
.btn-green  { background:#4a8a2a; color:#e0f0a0; }
.btn-blue   { background:#2a5a8a; color:#a0d0f0; }
.btn-orange { background:#8a5a1a; color:#f0d0a0; }
.btn-red    { background:#7a2a1a; color:#f0a090; }
.btn-purple { background:#5a2a8a; color:#d0a0f0; }
.btn-teal   { background:#1a6a5a; color:#a0f0d0; }
.btn:hover  { filter:brightness(1.15); }
.sep-v { color:#4a6a2a; padding:0 2px; }
.finput { background:#1a2810; color:#c8e080; border:1px solid #4a6a2a; border-radius:4px;
  padding:3px 6px; font-size:12px; font-family:inherit; }

/* ─── 主布局 ─── */
#main { display:flex; flex:1; overflow:hidden; }

/* ─── 左侧面板 ─── */
#sidebar { width:235px; background:#1e2e14; border-right:1px solid #3a5020;
  display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }

/* Tabs */
#tabs { display:flex; border-bottom:1px solid #3a5020; flex-shrink:0; }
.tab { flex:1; padding:5px 3px; text-align:center; cursor:pointer; font-size:11px;
  color:#80a050; border-bottom:2px solid transparent; }
.tab.active { color:#c8e080; border-bottom-color:#a0e040; background:#243018; }

/* ─── 层切换 ─── */
#layer-switcher { flex-shrink:0; padding:4px 5px 5px; background:#1a2810; border-bottom:1px solid #3a5020; }
.ls-title { font-size:10px; color:#607040; margin-bottom:4px; padding-left:1px; }
#layer-btns { display:flex; flex-wrap:wrap; gap:3px; }
.layer-btn {
  flex:1 1 calc(50% - 2px); padding:4px 3px; border-radius:4px; border:1px solid #3a5020;
  cursor:pointer; font-size:10px; text-align:center; background:#1a2810; color:#80a050;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.layer-btn.active { border-color:#a0e040; color:#c8e080; background:#2a3c18; }
.layer-btn.block-btn { border-color:#6a2010; color:#f09080; }
.layer-btn.block-btn.active { border-color:#ff6040; background:#3a1810; }

/* ─── 图集面板 ─── */
#panel-tileset { display:flex; flex-direction:column; flex:1; overflow:hidden; }
.tileset-toolbar { padding:4px 5px; border-bottom:1px solid #3a5020; display:flex; gap:3px; flex-shrink:0; }

/* 父组 / 子组树 */
#group-tree { flex:1; overflow-y:auto; padding:3px; }
.parent-group { border:1px solid #3a5020; border-radius:6px; margin-bottom:4px; background:#1a2810; overflow:hidden; }
.parent-header {
  display:flex; align-items:center; gap:4px; padding:5px 7px; cursor:pointer;
  background:#243018; user-select:none;
}
.parent-header:hover { background:#2e3c1e; }
.ph-arrow { font-size:9px; color:#80a050; width:10px; flex-shrink:0; }
.ph-name { flex:1; font-size:12px; color:#c0e080; font-weight:bold; }
.ph-cnt { font-size:10px; color:#607040; }
.ph-btns { display:flex; gap:3px; }
.ga { padding:1px 5px; border-radius:3px; border:none; cursor:pointer; font-size:10px;
  background:#3a5020; color:#a0c060; }
.ga:hover { background:#4a6030; }
.ga-red { background:#5a1a10; color:#f09080; }
.ga-red:hover { background:#6a2010; }

/* 子组 */
.child-groups { padding:3px 4px 4px 12px; display:flex; flex-direction:column; gap:3px; }
.child-group { border:1px solid #2a4015; border-radius:4px; background:#141e0c; overflow:hidden; }
.child-header {
  display:flex; align-items:center; gap:3px; padding:4px 6px; cursor:pointer;
  background:#1c2a10; user-select:none;
}
.child-header:hover { background:#243018; }
.ch-arrow { font-size:9px; color:#80a050; width:9px; flex-shrink:0; }
.ch-name { flex:1; font-size:11px; color:#a0c870; }
.ch-cnt { font-size:10px; color:#5a7035; }
.ch-btns { display:flex; gap:3px; }
.tile-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:4px; }
.tile-cell { position:relative; cursor:pointer; border-radius:3px; border:1px solid #3a5020;
  aspect-ratio:1; overflow:hidden; }
.tile-cell:hover { border-color:#a0e040; }
.tile-cell.selected { border-color:#ffe040; box-shadow:0 0 0 1px #ffe040; }
.tile-cell canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
.tile-lbl { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.65);
  color:#e0e0c0; font-size:7px; text-align:center; padding:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.add-tile-btn { grid-column:span 4; text-align:center; padding:3px; cursor:pointer;
  background:#1a2810; border:1px dashed #3a5020; border-radius:3px; color:#607040;
  font-size:10px; }
.add-tile-btn:hover { background:#243018; color:#a0c060; }

/* ─── 地块类型面板 ─── */
#panel-types { display:none; flex-direction:column; flex:1; overflow:hidden; }
#type-list { flex:1; overflow-y:auto; padding:5px; }
.type-item { display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:5px;
  cursor:pointer; margin-bottom:2px; background:#1a2810; border:2px solid transparent; }
.type-item:hover { background:#243018; }
.type-item.active { border-color:#a0e040; background:#243018; }
.type-dot { width:18px; height:18px; border-radius:3px; display:flex; align-items:center;
  justify-content:center; font-size:13px; flex-shrink:0; }

/* ─── 工具面板 ─── */
#panel-tools { display:none; flex-direction:column; flex:1; overflow:hidden; }
#tool-panel { overflow-y:auto; padding:5px; flex-shrink:0; }
.tool-item { display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:5px;
  cursor:pointer; margin-bottom:2px; background:#1a2810; border:2px solid transparent; }
.tool-item:hover { background:#243018; }
.tool-item.active { border-color:#a0e040; }
.sep { border-top:1px solid #3a5020; margin:5px 0; }
#vis-list { padding:0 5px 5px; }
.vis-row { display:flex; align-items:center; gap:5px; padding:3px 6px; font-size:11px; }
.vis-row input { cursor:pointer; }
#coord-info { margin:4px; padding:5px; background:#1a2810; border-radius:5px;
  font-size:10px; color:#80a050; line-height:1.7; }

/* ─── 地图区域 ─── */
#map-wrap { flex:1; overflow:auto; background:#0e1a0e; }
#map-canvas { display:block; cursor:crosshair; image-rendering:pixelated; }

/* ─── 底栏 ─── */
#bottombar { background:#2a3a1a; border-top:1px solid #4a6a2a; padding:4px 12px;
  display:flex; align-items:center; gap:8px; font-size:11px; flex-shrink:0; flex-wrap:wrap; }
#status { color:#80a050; }
#layer-badge { padding:2px 8px; border-radius:4px; background:#243018; color:#a0e040; font-size:11px; }

/* ─── 弹窗通用 ─── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
  z-index:200; align-items:center; justify-content:center; }
.modal-bg.show { display:flex; }
.modal-box { background:#243018; border:1px solid #4a6a2a; border-radius:10px;
  padding:16px; width:94%; max-width:520px; max-height:90vh; overflow-y:auto; }
.modal-box h3 { color:#c8e080; margin-bottom:10px; font-size:14px; }
.modal-box input[type=text], .modal-box input[type=number], .modal-box select,
.modal-box textarea {
  width:100%; background:#1a2810; color:#c8e080; border:1px solid #4a6a2a;
  border-radius:5px; padding:6px 8px; font-size:12px; font-family:inherit; }
.modal-box textarea { height:140px; resize:none; }
.modal-box label { font-size:12px; color:#a0b880; display:block; margin-bottom:4px; }
.modal-btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.frow { margin-bottom:10px; }
.frow-inline { display:flex; gap:8px; }
.frow-inline > * { flex:1; }

/* ─── 素材编辑弹窗 ─── */
#tile-edit-modal .modal-box { max-width:360px; }
#te-preview-wrap { display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
#te-preview { image-rendering:pixelated; border:1px solid #4a6a2a; border-radius:4px; flex-shrink:0; }
#te-coords-hint { font-size:10px; color:#607040; line-height:1.6; }

/* ─── 存档列表 ─── */
.save-row { display:flex; align-items:center; gap:5px; padding:7px 5px;
  border-bottom:1px solid #3a5020; }
.save-row:last-child { border-bottom:none; }
.save-info { flex:1; min-width:0; }
.save-name-text { font-size:13px; color:#c8e080; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.save-meta { font-size:10px; color:#607040; }
.save-btns { display:flex; gap:3px; flex-shrink:0; }
.save-btns .btn { padding:3px 6px; font-size:11px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>🗺️ 地图编辑器</h1>
  <button class="btn btn-purple" onclick="showSavePanel()">💾 存档</button>
  <button class="btn btn-green"  onclick="exportMap()">📤 导出</button>
  <button class="btn btn-blue"   onclick="importMap()">📥 导入</button>
  <button class="btn btn-orange" onclick="fillAll()">🖌️ 全填</button>
  <button class="btn btn-red"    onclick="clearLayer()">🗑️ 清空</button>
  <span class="sep-v">|</span>
  <label style="font-size:11px;color:#80a050;">列
    <input id="inp-cols" type="number" value="18" min="5" max="60" class="finput" style="width:42px;margin-left:3px;">
  </label>
  <label style="font-size:11px;color:#80a050;">行
    <input id="inp-rows" type="number" value="14" min="5" max="60" class="finput" style="width:42px;margin-left:3px;">
  </label>
  <button class="btn btn-green" onclick="resizeMap()">↩ 调整</button>
  <span class="sep-v">|</span>
  <label style="font-size:11px;color:#80a050;">格子
    <select id="tile-size-sel" onchange="changeTileSize()" class="finput" style="padding:2px 4px;">
      <option value="32">32px</option>
      <option value="40" selected>40px</option>
      <option value="48">48px</option>
      <option value="64">64px</option>
    </select>
  </label>
</div>

<div id="main">
  <div id="sidebar">
    <div id="tabs">
      <div class="tab active" id="tab-tileset" onclick="switchTab('tileset')">🖼 图集</div>
      <div class="tab"        id="tab-types"   onclick="switchTab('types')">🎨 地块</div>
      <div class="tab"        id="tab-tools"   onclick="switchTab('tools')">🛠 工具</div>
    </div>

    <!-- ══ 图集面板 ══ -->
    <div id="panel-tileset">
      <!-- 层切换 -->
      <div id="layer-switcher">
        <div class="ls-title">当前编辑层（点击切换）</div>
        <div id="layer-btns"></div>
      </div>
      <!-- 图集操作栏 -->
      <div class="tileset-toolbar">
        <button class="btn btn-teal"   style="flex:1;font-size:11px;" onclick="autoGenGroups()">✨ 自动生成</button>
        <button class="btn btn-green"  style="flex:1;font-size:11px;" onclick="openAddParent()">＋ 父组</button>
      </div>
      <div style="display:flex;gap:3px;padding:3px 5px;border-bottom:1px solid #3a5020;flex-shrink:0;">
        <button class="btn btn-blue" style="flex:1;font-size:10px;" onclick="openAddChildFromBar()">＋ 新建子组</button>
        <button class="btn btn-orange" style="flex:1;font-size:10px;" onclick="openAppendTileFromBar()">+ 新增素材</button>
      </div>
      <!-- 分组树 -->
      <div id="group-tree"></div>
    </div>

    <!-- ══ 地块类型面板 ══ -->
    <div id="panel-types">
      <div id="type-list"></div>
    </div>

    <!-- ══ 工具面板 ══ -->
    <div id="panel-tools">
      <div id="tool-panel">
        <div class="tool-item active" id="tool-paint" onclick="setTool('paint')">✏️ 画笔</div>
        <div class="tool-item"        id="tool-fill"  onclick="setTool('fill')">🪣 填充</div>
        <div class="tool-item"        id="tool-erase" onclick="setTool('erase')">🧹 橡皮</div>
        <div class="sep"></div>
        <div style="font-size:11px;color:#607040;padding:2px 4px;">👁 层可见性</div>
      </div>
      <div id="vis-list"></div>
      <div id="coord-info">
        位置：<span id="ci-pos">-</span><br>
        地块：<span id="ci-type">-</span><br>
        画笔：<span id="ci-brush">-</span>
      </div>
    </div>
  </div>

  <div id="map-wrap">
    <canvas id="map-canvas"></canvas>
  </div>
</div>

<div id="bottombar">
  <span id="status">就绪</span>
  <span id="layer-badge">📋 地块上层</span>
  <span style="margin-left:auto;color:#4a6030;font-size:10px;">左键绘制 · 拖拽连续 · 右键清除 · 双击格子编辑素材</span>
</div>

<!-- ══════════════════ 弹窗：地图存档 ══════════════════ -->
<div class="modal-bg" id="save-modal">
  <div class="modal-box" style="max-width:480px;">
    <h3>💾 地图存档</h3>
    <div class="frow">
      <label>地图名称</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="save-name" placeholder="第一片农场" style="flex:1;">
        <button class="btn btn-green" onclick="saveNewMap()">💾 保存</button>
      </div>
    </div>
    <div style="border-top:1px solid #3a5020;margin:8px 0;"></div>
    <div style="font-size:12px;color:#a0b880;margin-bottom:6px;">历史存档</div>
    <div id="save-list" style="max-height:300px;overflow-y:auto;"></div>
    <div class="modal-btns">
      <button class="btn btn-red" onclick="closeModal('save-modal')">✕ 关闭</button>
    </div>
  </div>
</div>

<!-- ══════════════════ 弹窗：导出 ══════════════════ -->
<div class="modal-bg" id="export-modal">
  <div class="modal-box">
    <h3>📤 导出地图数据</h3>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="copyExport()">📋 复制</button>
      <button class="btn btn-blue"  onclick="downloadExport()">💾 下载</button>
      <button class="btn btn-red"   onclick="closeModal('export-modal')">✕ 关闭</button>
    </div>
  </div>
</div>

<!-- ══════════════════ 弹窗：新建父组 ══════════════════ -->
<div class="modal-bg" id="add-parent-modal">
  <div class="modal-box" style="max-width:320px;">
    <h3>➕ 新建父组</h3>
    <div class="frow">
      <label>父组名称</label>
      <input type="text" id="ap-name" placeholder="例：草地组">
    </div>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="confirmAddParent()">✓ 创建</button>
      <button class="btn btn-red"   onclick="closeModal('add-parent-modal')">✕ 取消</button>
    </div>
  </div>
</div>

<!-- ══════════════════ 弹窗：新建子组 ══════════════════ -->
<div class="modal-bg" id="add-child-modal">
  <div class="modal-box" style="max-width:320px;">
    <h3>➕ 新建子组</h3>
    <div class="frow">
      <label>子组名称</label>
      <input type="text" id="ac-name" placeholder="例：夏季草地01">
    </div>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="confirmAddChild()">✓ 创建</button>
      <button class="btn btn-red"   onclick="closeModal('add-child-modal')">✕ 取消</button>
    </div>
  </div>
</div>

<!-- 弹窗：移动子组 -->
<div class="modal-bg" id="move-child-modal">
  <div class="modal-box" style="max-width:320px;">
    <h3>➡️ 移动子组</h3>
    <div class="frow">
      <label>选择目标父组</label>
      <select id="move-target-pg" class="finput" style="width:100%;"></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="confirmMoveChild()">✓ 移动</button>
      <button class="btn btn-red"   onclick="closeModal('move-child-modal')">✕ 取消</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="rename-modal">
  <div class="modal-box" style="max-width:300px;">
    <h3>✏️ 重命名</h3>
    <div class="frow">
      <label>名称</label>
      <input type="text" id="rename-input">
    </div>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="confirmRenameItem()">✓ 确认</button>
      <button class="btn btn-red"   onclick="closeModal('rename-modal')">✕ 取消</button>
    </div>
  </div>
</div>

<!-- ══════════════════ 弹窗：素材编辑 ══════════════════ -->
<div class="modal-bg" id="tile-edit-modal">
  <div class="modal-box" style="max-width:460px;">
    <h3>✏️ 编辑素材</h3>
    <div id="te-preview-wrap">
      <canvas id="te-preview" width="64" height="64" style="width:64px;height:64px;"></canvas>
      <div style="flex:1;">
        <div style="font-size:11px;color:#80a050;margin-bottom:4px;">点击下方Tileset选格</div>
        <div style="font-size:10px;color:#607040;">sx=<span id="te-sx-show">0</span> sy=<span id="te-sy-show">0</span></div>
      </div>
    </div>
    <!-- 可点击选格的 Tileset -->
    <div style="margin-bottom:8px;">
      <canvas id="te-tileset-picker" width="384" height="640"
        style="width:192px;height:320px;image-rendering:pixelated;border:1px solid #4a6a2a;border-radius:4px;cursor:crosshair;display:block;"
        onclick="onTilesetPickerClick(event)">
      </canvas>
    </div>
    <div class="frow">
      <label>素材名称</label>
      <input type="text" id="te-name">
    </div>
    <div class="frow-inline frow">
      <div>
        <label>sx（像素，从0计）</label>
        <input type="number" id="te-sx" min="0" max="368" step="16" oninput="updateTilePreview()">
      </div>
      <div>
        <label>sy（像素，从0计）</label>
        <input type="number" id="te-sy" min="0" max="624" step="16" oninput="updateTilePreview()">
      </div>
    </div>
    <div class="frow">
      <label>所属子组</label>
      <select id="te-child-sel" class="finput" style="width:100%;"></select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="confirmTileEdit()">✓ 保存</button>
      <button class="btn btn-red"   style="margin-left:auto;" onclick="deleteTileFromModal()">🗑 删除</button>
      <button class="btn btn-red"   onclick="closeModal('tile-edit-modal')">✕ 取消</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════
// Tileset 常量
// ═══════════════════════════════════════════════
const TS_SRC  = 'https://weiyi330.github.io/squat-game/tileset.png';
const TS_COLS = 24, TS_ROWS = 40, TS_PX = 16;

const tilesetImg = new Image();
tilesetImg.crossOrigin = 'anonymous';
tilesetImg.src = TS_SRC;
let tilesetLoaded = false;
tilesetImg.onload = () => { tilesetLoaded = true; rebuildGroupTree(); draw(); };
tilesetImg.onerror = () => { console.warn('Tileset 加载失败'); rebuildGroupTree(); };

// ═══════════════════════════════════════════════
// 6层定义
// ═══════════════════════════════════════════════
const LAYERS = [
  { id:'ground_low',  name:'地块下层', icon:'🟫', color:'rgba(60,120,255,0.18)',  desc:'水/泥土/基底' },
  { id:'ground_high', name:'地块上层', icon:'🟩', color:'rgba(80,200,80,0.18)',   desc:'草地/路径/农田' },
  { id:'decor',       name:'装饰层',   icon:'🟦', color:'rgba(80,160,255,0.18)',  desc:'花草/石头/小物件' },
  { id:'overlay',     name:'叠加层',   icon:'🟪', color:'rgba(180,80,255,0.18)', desc:'过渡/边缘混合' },
  { id:'above',       name:'遮挡层',   icon:'🟥', color:'rgba(255,80,50,0.18)',  desc:'树冠/房顶/遮挡角色' },
];
const BLOCK_DEF = { id:'block', name:'阻挡层', icon:'🚧', color:'rgba(255,40,40,0.32)', desc:'碰撞区域' };
let currentLayer = 'ground_high';

// ═══════════════════════════════════════════════
// 图集配置（全局持久化，独立 localStorage key）
// ═══════════════════════════════════════════════
const TILESET_CFG_KEY = 'farm_tileset_config';

/**
 * 数据结构：
 * parentGroups = [
 *   { id, name, collapsed, children: [
 *     { id, name, collapsed, tiles: [
 *       { id, name, sx, sy }
 *     ]}
 *   ]}
 * ]
 */
let parentGroups = [];
let _pgNextId = 1;
let _cgNextId = 1;
let _tileNextId = 1;

function loadTilesetConfig() {
  try {
    const raw = localStorage.getItem(TILESET_CFG_KEY);
    if (raw) {
      const cfg = JSON.parse(raw);
      parentGroups = cfg.parentGroups || [];
      _pgNextId    = cfg._pgNextId    || 1;
      _cgNextId    = cfg._cgNextId    || 1;
      _tileNextId  = cfg._tileNextId  || 1;
      // 兼容：确保 collapsed 字段存在
      parentGroups.forEach(pg => {
        pg.collapsed = !!pg.collapsed;
        (pg.children || []).forEach(cg => { cg.collapsed = !!cg.collapsed; });
      });
    }
  } catch(e) { parentGroups = []; }
}

function saveTilesetConfig() {
  const cfg = { parentGroups, _pgNextId, _cgNextId, _tileNextId };
  try { localStorage.setItem(TILESET_CFG_KEY, JSON.stringify(cfg)); } catch(e) {}
}

// ─── 折叠/展开 state ───
const pgCollapsed = new Set(); // 父组折叠
const cgCollapsed = new Set(); // 子组折叠

// ─── 当前选中素材 ───
let selectedTile = null; // { pgId, cgId, tileId, sx, sy, name }
let useTilesetMode = false;

// ════════════════════════════════════════════════
// 图集操作
// ════════════════════════════════════════════════

function autoGenGroups() {
  if (parentGroups.length > 0 && !confirm('重新生成会替换"默认图集"父组，确认？')) return;

  // 查找/创建"默认图集"父组
  let defPG = parentGroups.find(pg => pg.name === '默认图集');
  if (!defPG) {
    defPG = { id: _pgNextId++, name: '默认图集', collapsed: false, children: [] };
    parentGroups.unshift(defPG);
  }
  defPG.children = [];

  // 按 4×4 分块，60 组 = 4列×15行 分块覆盖 384×640（实际 TS 24×40）
  // 60 组 = 6行 × 10列（每格4px → 每块4×4 = 64px ÷ TS_PX=16 → 4格/块）
  // 24列÷4=6块/行，40行÷4=10块/列 → 6×10=60组 ✓
  let idx = 1;
  for (let brow = 0; brow < TS_ROWS / 4; brow++) {
    for (let bcol = 0; bcol < TS_COLS / 4; bcol++) {
      const cgName = `夏季草地${String(idx).padStart(2, '0')}`;
      const tiles = [];
      for (let lr = 0; lr < 4; lr++) {
        for (let lc = 0; lc < 4; lc++) {
          tiles.push({
            id:   _tileNextId++,
            name: `${cgName}_${String(lr * 4 + lc + 1).padStart(2, '0')}`,
            sx:   (bcol * 4 + lc) * TS_PX,
            sy:   (brow * 4 + lr) * TS_PX
          });
        }
      }
      defPG.children.push({ id: _cgNextId++, name: cgName, collapsed: true, tiles });
      idx++;
    }
  }
  saveTilesetConfig();
  rebuildGroupTree();
  setStatus(`已生成 ${defPG.children.length} 个子组`);
}

// ─── 父组 CRUD ───
let _pendingAddChildPgId = null;
let _pendingRenamePgId   = null;
let _pendingRenameCgId   = null;

function openAddParent() {
  document.getElementById('ap-name').value = '';
  document.getElementById('add-parent-modal').classList.add('show');
  setTimeout(() => document.getElementById('ap-name').focus(), 50);
}
function confirmAddParent() {
  const name = document.getElementById('ap-name').value.trim();
  if (!name) { alert('请输入名称'); return; }
  parentGroups.push({ id: _pgNextId++, name, collapsed: false, children: [] });
  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('add-parent-modal');
  setStatus(`新建父组：${name}`);
}

function openAddChild(pgId) {
  _pendingAddChildPgId = pgId;
  document.getElementById('ac-name').value = '';
  document.getElementById('add-child-modal').classList.add('show');
  setTimeout(() => document.getElementById('ac-name').focus(), 50);
}
function confirmAddChild() {
  const name = document.getElementById('ac-name').value.trim();
  if (!name) { alert('请输入名称'); return; }
  const pg = parentGroups.find(p => p.id === _pendingAddChildPgId);
  if (!pg) return;
  pg.children.push({ id: _cgNextId++, name, collapsed: false, tiles: [] });
  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('add-child-modal');
  setStatus(`新建子组：${name}`);
}

function openRenameParent(pgId) {
  _pendingRenamePgId = pgId;
  _pendingRenameCgId = null;
  const pg = parentGroups.find(p => p.id === pgId);
  document.getElementById('rename-input').value = pg ? pg.name : '';
  document.getElementById('rename-modal').classList.add('show');
}
function openRenameChild(pgId, cgId) {
  _pendingRenamePgId = pgId;
  _pendingRenameCgId = cgId;
  const pg = parentGroups.find(p => p.id === pgId);
  const cg = pg?.children.find(c => c.id === cgId);
  document.getElementById('rename-input').value = cg ? cg.name : '';
  document.getElementById('rename-modal').classList.add('show');
}
function confirmRenameItem() {
  const name = document.getElementById('rename-input').value.trim();
  if (!name) { alert('名称不能为空'); return; }
  const pg = parentGroups.find(p => p.id === _pendingRenamePgId);
  if (!pg) return;
  if (_pendingRenameCgId !== null) {
    const cg = pg.children.find(c => c.id === _pendingRenameCgId);
    if (cg) cg.name = name;
  } else {
    pg.name = name;
  }
  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('rename-modal');
}

function deleteParentGroup(pgId) {
  const pg = parentGroups.find(p => p.id === pgId);
  if (!confirm(`删除父组「${pg?.name}」及其所有子组？`)) return;
  parentGroups = parentGroups.filter(p => p.id !== pgId);
  saveTilesetConfig();
  rebuildGroupTree();
}
function deleteChildGroup(pgId, cgId) {
  const pg = parentGroups.find(p => p.id === pgId);
  if (!pg) return;
  const cg = pg.children.find(c => c.id === cgId);
  if (!confirm(`删除子组「${cg?.name}」及其所有素材？`)) return;
  pg.children = pg.children.filter(c => c.id !== cgId);
  saveTilesetConfig();
  rebuildGroupTree();
}

// 移动子组
let _movePgId = null, _moveCgId = null;
function openMoveChild(pgId, cgId) {
  _movePgId = pgId; _moveCgId = cgId;
  const sel = document.getElementById('move-target-pg');
  sel.innerHTML = parentGroups
    .filter(p => p.id !== pgId)
    .map(p => `<option value="${p.id}">${p.name}</option>`)
    .join('');
  if (!sel.innerHTML) { alert('没有其他父组可移动'); return; }
  document.getElementById('move-child-modal').classList.add('show');
}
function confirmMoveChild() {
  const toPgId = parseInt(document.getElementById('move-target-pg').value);
  const fromPg = parentGroups.find(p => p.id === _movePgId);
  const toPg   = parentGroups.find(p => p.id === toPgId);
  if (!fromPg || !toPg) return;
  const cgIdx = fromPg.children.findIndex(c => c.id === _moveCgId);
  if (cgIdx === -1) return;
  const [cg] = fromPg.children.splice(cgIdx, 1);
  toPg.children.push(cg);
  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('move-child-modal');
  setStatus(`已移动「${cg.name}」到「${toPg.name}」`);
}

// 工具栏快捏新建子组
let _barAddChildPgId = null;
function openAddChildFromBar() {
  if (!parentGroups.length) { alert('请先创建父组'); return; }
  // 如果只有一个父组直接用，多个则先选
  if (parentGroups.length === 1) {
    _pendingAddChildPgId = parentGroups[0].id;
    document.getElementById('ac-name').value = '';
    document.getElementById('add-child-modal').classList.add('show');
    setTimeout(() => document.getElementById('ac-name').focus(), 50);
  } else {
    const names = parentGroups.map((p,i) => `${i+1}. ${p.name}`).join('\n');
    const input = prompt(`选择父组（输入序号）:\n${names}`);
    if (!input) return;
    const idx = parseInt(input) - 1;
    if (idx < 0 || idx >= parentGroups.length) { alert('序号不对'); return; }
    _pendingAddChildPgId = parentGroups[idx].id;
    document.getElementById('ac-name').value = '';
    document.getElementById('add-child-modal').classList.add('show');
    setTimeout(() => document.getElementById('ac-name').focus(), 50);
  }
}

// 工具栏新增素材快捏
function openAppendTileFromBar() {
  // 找到当前选中的子组，或者让用户选
  if (selectedTile) {
    appendTileToChild(selectedTile.pgId, selectedTile.cgId);
  } else {
    alert('请先在图集中点击选择一个子组的某个格子，再点新增素材');
  }
}

function appendTileToChild(pgId, cgId) {
  const pg = parentGroups.find(p => p.id === pgId);
  const cg = pg?.children.find(c => c.id === cgId);
  if (!cg) return;
  const n = cg.tiles.length + 1;
  const newTile = { id: _tileNextId++, name: `${cg.name}_${String(n).padStart(2,'0')}`, sx:0, sy:0 };
  cg.tiles.push(newTile);
  saveTilesetConfig();
  rebuildGroupTree();
  // 新增后立即弹出编辑弹窗设置坐标
  openTileEdit(pgId, cgId, newTile.id);
}

// ─── 折叠 ───
function toggleParent(pgId) {
  pgCollapsed.has(pgId) ? pgCollapsed.delete(pgId) : pgCollapsed.add(pgId);
  rebuildGroupTree();
}
function toggleChild(pgId, cgId) {
  const key = `${pgId}-${cgId}`;
  cgCollapsed.has(key) ? cgCollapsed.delete(key) : cgCollapsed.add(key);
  rebuildGroupTree();
}

// ─── 选中素材 ───
function selectTile(pgId, cgId, tileId) {
  const pg = parentGroups.find(p => p.id === pgId);
  const cg = pg?.children.find(c => c.id === cgId);
  const t  = cg?.tiles.find(x => x.id === tileId);
  if (!t) return;
  selectedTile = { pgId, cgId, tileId, sx: t.sx, sy: t.sy, name: t.name };
  useTilesetMode = true;
  setTool('paint');
  document.getElementById('ci-brush').textContent = t.name;
  rebuildGroupTree();
  setStatus(`已选：${t.name}`);
}

// ─── 素材编辑弹窗 ───
let _editingPgId = null, _editingCgId = null, _editingTileId = null;

function openTileEdit(pgId, cgId, tileId) {
  const pg = parentGroups.find(p => p.id === pgId);
  const cg = pg?.children.find(c => c.id === cgId);
  const t  = cg?.tiles.find(x => x.id === tileId);
  if (!t) return;
  _editingPgId   = pgId;
  _editingCgId   = cgId;
  _editingTileId = tileId;
  document.getElementById('te-name').value = t.name;
  document.getElementById('te-sx').value   = t.sx;
  document.getElementById('te-sy').value   = t.sy;
  // 子组选择器（跨所有父组的子组）
  const sel = document.getElementById('te-child-sel');
  sel.innerHTML = '';
  parentGroups.forEach(pg2 => {
    pg2.children.forEach(cg2 => {
      const opt = document.createElement('option');
      opt.value = `${pg2.id}|${cg2.id}`;
      opt.textContent = `${pg2.name} / ${cg2.name}`;
      if (pg2.id === pgId && cg2.id === cgId) opt.selected = true;
      sel.appendChild(opt);
    });
  });
  updateTilePreview();
  // 加载后立即画一次 picker
  setTimeout(() => drawTilesetPicker(t.sx, t.sy), 50);
  document.getElementById('tile-edit-modal').classList.add('show');
}

function updateTilePreview() {
  const sx = parseInt(document.getElementById('te-sx').value) || 0;
  const sy = parseInt(document.getElementById('te-sy').value) || 0;
  document.getElementById('te-sx-show').textContent = sx;
  document.getElementById('te-sy-show').textContent = sy;
  // 小预览
  const cv = document.getElementById('te-preview');
  const cx = cv.getContext('2d');
  cx.clearRect(0, 0, 64, 64);
  cx.imageSmoothingEnabled = false;
  if (tilesetLoaded) cx.drawImage(tilesetImg, sx, sy, TS_PX, TS_PX, 0, 0, 64, 64);
  // 小地图高亮当前选中格
  drawTilesetPicker(sx, sy);
}

function drawTilesetPicker(selSx, selSy) {
  const cv = document.getElementById('te-tileset-picker');
  if (!cv) return;
  const cx = cv.getContext('2d');
  cx.clearRect(0, 0, cv.width, cv.height);
  if (tilesetLoaded) {
    cx.imageSmoothingEnabled = false;
    cx.drawImage(tilesetImg, 0, 0, cv.width, cv.height);
  }
  // 画网格线
  cx.strokeStyle = 'rgba(0,0,0,0.2)'; cx.lineWidth = 0.5;
  for (let c = 0; c < TS_COLS; c++) { cx.beginPath(); cx.moveTo(c*TS_PX,0); cx.lineTo(c*TS_PX,cv.height); cx.stroke(); }
  for (let r = 0; r < TS_ROWS; r++) { cx.beginPath(); cx.moveTo(0,r*TS_PX); cx.lineTo(cv.width,r*TS_PX); cx.stroke(); }
  // 高亮选中格
  cx.strokeStyle = 'rgba(255,220,60,0.95)'; cx.lineWidth = 1.5;
  cx.strokeRect(selSx, selSy, TS_PX, TS_PX);
  cx.fillStyle = 'rgba(255,220,60,0.25)';
  cx.fillRect(selSx, selSy, TS_PX, TS_PX);
}

function onTilesetPickerClick(e) {
  const cv = document.getElementById('te-tileset-picker');
  const rect = cv.getBoundingClientRect();
  const scaleX = cv.width  / rect.width;
  const scaleY = cv.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top)  * scaleY;
  const col = Math.floor(px / TS_PX);
  const row = Math.floor(py / TS_PX);
  const sx = col * TS_PX;
  const sy = row * TS_PX;
  document.getElementById('te-sx').value = sx;
  document.getElementById('te-sy').value = sy;
  updateTilePreview();
}

function confirmTileEdit() {
  const name    = document.getElementById('te-name').value.trim();
  const sx      = parseInt(document.getElementById('te-sx').value) || 0;
  const sy      = parseInt(document.getElementById('te-sy').value) || 0;
  const selVal  = document.getElementById('te-child-sel').value;
  if (!name) { alert('名称不能为空'); return; }

  // 找到原来的素材并移除
  const fromPg = parentGroups.find(p => p.id === _editingPgId);
  const fromCg = fromPg?.children.find(c => c.id === _editingCgId);
  if (!fromCg) return;
  const tileIdx = fromCg.tiles.findIndex(t => t.id === _editingTileId);
  if (tileIdx < 0) return;
  const tileObj = fromCg.tiles[tileIdx];
  tileObj.name = name; tileObj.sx = sx; tileObj.sy = sy;

  // 如果换了子组
  const [toPgId, toCgId] = selVal.split('|').map(Number);
  if (toPgId !== _editingPgId || toCgId !== _editingCgId) {
    fromCg.tiles.splice(tileIdx, 1);
    const toPg = parentGroups.find(p => p.id === toPgId);
    const toCg = toPg?.children.find(c => c.id === toCgId);
    if (toCg) toCg.tiles.push(tileObj);
  }

  // 更新选中素材
  if (selectedTile && selectedTile.tileId === _editingTileId) {
    selectedTile.sx = sx; selectedTile.sy = sy; selectedTile.name = name;
    document.getElementById('ci-brush').textContent = name;
  }

  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('tile-edit-modal');
}

function deleteTileFromModal() {
  const fromPg = parentGroups.find(p => p.id === _editingPgId);
  const fromCg = fromPg?.children.find(c => c.id === _editingCgId);
  if (!fromCg) return;
  const tile = fromCg.tiles.find(t => t.id === _editingTileId);
  if (!confirm(`删除素材「${tile?.name}」？`)) return;
  fromCg.tiles = fromCg.tiles.filter(t => t.id !== _editingTileId);
  if (selectedTile?.tileId === _editingTileId) { selectedTile = null; useTilesetMode = false; }
  saveTilesetConfig();
  rebuildGroupTree();
  closeModal('tile-edit-modal');
}

// ─── 渲染分组树 ───
function rebuildGroupTree() {
  const wrap = document.getElementById('group-tree');
  wrap.innerHTML = '';
  if (!tilesetLoaded) {
    // 图片未加载但配置已有数据，显示加载中
    const hint = parentGroups.length
      ? `<div style="padding:10px;color:#a0c060;font-size:11px;">Tileset 加载中，已有 ${parentGroups.reduce((s,p)=>s+p.children.length,0)} 个分组等待显示...</div>`
      : '<div style="padding:10px;color:#607040;font-size:11px;">Tileset 加载中...</div>';
    wrap.innerHTML = hint;
    return;
  }
  if (!parentGroups.length) {
    wrap.innerHTML = '<div style="padding:10px;color:#607040;font-size:11px;">点「✨ 自动生成」或「＋ 父组」创建图集</div>';
    return;
  }
  parentGroups.forEach(pg => {
    const pgEl = document.createElement('div');
    pgEl.className = 'parent-group';
    const isPgCol = pgCollapsed.has(pg.id);
    pgEl.innerHTML = `
      <div class="parent-header" onclick="toggleParent(${pg.id})">
        <span class="ph-arrow">${isPgCol ? '▶' : '▼'}</span>
        <span class="ph-name">${escH(pg.name)}</span>
        <span class="ph-cnt">${pg.children.length}组</span>
        <span class="ph-btns" onclick="event.stopPropagation()">
          <button class="ga" onclick="openAddChild(${pg.id})">+子</button>
          <button class="ga" onclick="openRenameParent(${pg.id})">改</button>
          <button class="ga ga-red" onclick="deleteParentGroup(${pg.id})">删</button>
        </span>
      </div>`;
    if (!isPgCol) {
      const childWrap = document.createElement('div');
      childWrap.className = 'child-groups';
      pg.children.forEach(cg => {
        const cgKey    = `${pg.id}-${cg.id}`;
        const isCgCol  = cgCollapsed.has(cgKey);
        const cgEl     = document.createElement('div');
        cgEl.className = 'child-group';
        cgEl.innerHTML = `
          <div class="child-header" onclick="toggleChild(${pg.id},${cg.id})">
            <span class="ch-arrow">${isCgCol ? '▶' : '▼'}</span>
            <span class="ch-name">${escH(cg.name)}</span>
            <span class="ch-cnt">${cg.tiles.length}</span>
            <span class="ch-btns" onclick="event.stopPropagation()">
              <button class="ga" onclick="openMoveChild(${pg.id},${cg.id})">移</button>
              <button class="ga" onclick="openRenameChild(${pg.id},${cg.id})">改</button>
              <button class="ga ga-red" onclick="deleteChildGroup(${pg.id},${cg.id})">删</button>
            </span>
          </div>`;
        if (!isCgCol) {
          const grid = document.createElement('div');
          grid.className = 'tile-grid';
          cg.tiles.forEach(tile => {
            const cell = document.createElement('div');
            cell.className = 'tile-cell' + (selectedTile?.tileId === tile.id ? ' selected' : '');
            const cv  = document.createElement('canvas');
            cv.width  = TS_PX; cv.height = TS_PX;
            const cx  = cv.getContext('2d');
            cx.imageSmoothingEnabled = false;
            if (tilesetLoaded) cx.drawImage(tilesetImg, tile.sx, tile.sy, TS_PX, TS_PX, 0, 0, TS_PX, TS_PX);
            cell.appendChild(cv);
            const lbl = document.createElement('div');
            lbl.className = 'tile-lbl';
            lbl.textContent = tile.name.split('_').slice(-2).join('_');
            lbl.title = tile.name;
            cell.appendChild(lbl);
            cell.addEventListener('click', () => selectTile(pg.id, cg.id, tile.id));
            cell.addEventListener('dblclick', e => { e.stopPropagation(); openTileEdit(pg.id, cg.id, tile.id); });
            grid.appendChild(cell);
          });
          // 追加格子按钮
          const addBtn = document.createElement('div');
          addBtn.className = 'add-tile-btn';
          addBtn.textContent = '＋ 追加格子';
          addBtn.onclick = () => appendTileToChild(pg.id, cg.id);
          grid.appendChild(addBtn);
          cgEl.appendChild(grid);
        }
        childWrap.appendChild(cgEl);
      });
      pgEl.appendChild(childWrap);
    }
    wrap.appendChild(pgEl);
  });
}

function escH(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let selectedTypeId = 0;

function buildTypeList() {
  const list = document.getElementById('type-list'); list.innerHTML = '';
  TILE_TYPES.forEach(t => {
    const div = document.createElement('div');
    div.className = 'type-item' + (t.id === selectedTypeId ? ' active' : '');
    div.id = `type-${t.id}`;
    div.innerHTML = `<div class="type-dot" style="background:${t.color}">${t.icon}</div><span>${t.name}</span>`;
    div.onclick = () => {
      selectedTypeId = t.id; useTilesetMode = false; selectedTile = null;
      buildTypeList();
      document.getElementById('ci-brush').textContent = t.name;
      setTool('paint');
    };
    list.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
// 层切换面板
// ═══════════════════════════════════════════════
function buildLayerSwitcher() {
  const wrap = document.getElementById('layer-btns'); wrap.innerHTML = '';
  LAYERS.forEach(l => {
    const btn = document.createElement('div');
    btn.className = 'layer-btn' + (l.id === currentLayer ? ' active' : '');
    btn.id = `lbtn-${l.id}`;
    btn.title = l.desc;
    btn.textContent = l.icon + ' ' + l.name;
    btn.onclick = () => setCurrentLayer(l.id);
    wrap.appendChild(btn);
  });
  const bb = document.createElement('div');
  bb.className = 'layer-btn block-btn' + (currentLayer === 'block' ? ' active' : '');
  bb.id = 'lbtn-block'; bb.title = BLOCK_DEF.desc;
  bb.textContent = BLOCK_DEF.icon + ' ' + BLOCK_DEF.name;
  bb.onclick = () => setCurrentLayer('block');
  wrap.appendChild(bb);
}

function buildVisList() {
  const wrap = document.getElementById('vis-list'); wrap.innerHTML = '';
  [...LAYERS, BLOCK_DEF].forEach(l => {
    const row = document.createElement('label');
    row.className = 'vis-row';
    row.innerHTML = `<input type="checkbox" id="vis-${l.id}" checked onchange="draw()"> ${l.icon} ${l.name}`;
    wrap.appendChild(row);
  });
  // 网格开关
  const grow = document.createElement('label');
  grow.className = 'vis-row';
  grow.innerHTML = `<input type="checkbox" id="show-grid" checked onchange="draw()"> 🔲 显示网格`;
  wrap.appendChild(grow);
}

function setCurrentLayer(lid) {
  currentLayer = lid;
  buildLayerSwitcher();
  const all = [...LAYERS, BLOCK_DEF];
  const l   = all.find(x => x.id === lid);
  document.getElementById('layer-badge').textContent = l ? l.icon + ' ' + l.name : '?';
  setStatus(l ? `编辑层: ${l.name}（${l.desc}）` : '');
}

// ═══════════════════════════════════════════════
// 地图数据
// ═══════════════════════════════════════════════
let MAP_COLS = 18, MAP_ROWS = 14, TILE_SIZE = 40;
let mapData = [], blockData = [], layerData = {};

function initMap(cols, rows) {
  MAP_COLS = cols; MAP_ROWS = rows;
  mapData   = []; blockData = []; layerData = {};
  for (let r = 0; r < rows; r++) {
    mapData[r]   = new Array(cols).fill(0);
    blockData[r] = new Array(cols).fill(0);
  }
  LAYERS.forEach(l => {
    layerData[l.id] = [];
    for (let r = 0; r < rows; r++) layerData[l.id][r] = new Array(cols).fill(null);
  });
  if (cols === 18 && rows === 14) applyDefaultTerrain();
}

function applyDefaultTerrain() {
  // 道路
  for (let c = 3; c < 15; c++) mapData[MAP_ROWS - 1][c] = 8;
  for (let r = 4; r < MAP_ROWS; r++) mapData[r][8] = 8;
  // 建筑
  mapData[2][3]  = 4; mapData[2][13] = 6; mapData[5][14] = 5;
  // 水塘
  [[1,7],[1,8],[1,9],[2,7],[2,8]].forEach(([r,c]) => { mapData[r][c] = 9; blockData[r][c] = 1; });
  // 树木
  [[0,0],[0,1],[0,16],[0,17],[1,0],[1,17],[12,0],[12,17],[13,0],[13,17],[0,5],[0,11],[3,1],[3,16]].forEach(([r,c]) => {
    if (r < MAP_ROWS && c < MAP_COLS) { mapData[r][c] = 7; blockData[r][c] = 1; }
  });
  [[2,3],[2,13],[5,14]].forEach(([r,c]) => blockData[r][c] = 1);
}

// ═══════════════════════════════════════════════
// 画布渲染
// ═══════════════════════════════════════════════
const canvas = document.getElementById('map-canvas');
const ctx    = canvas.getContext('2d');
let hoverR = -1, hoverC = -1;

function resizeCanvas() {
  canvas.width  = MAP_COLS * TILE_SIZE;
  canvas.height = MAP_ROWS * TILE_SIZE;
}

function isLayerVisible(lid) {
  return document.getElementById(`vis-${lid}`)?.checked !== false;
}

function drawCell(r, c) {
  const x = c * TILE_SIZE, y = r * TILE_SIZE;
  ctx.imageSmoothingEnabled = false;

  // ground_low
  if (isLayerVisible('ground_low')) {
    const cell = layerData['ground_low']?.[r]?.[c];
    if (cell && tilesetLoaded) {
      ctx.drawImage(tilesetImg, cell.sx, cell.sy, TS_PX, TS_PX, x, y, TILE_SIZE, TILE_SIZE);
    } else {
      ctx.fillStyle = '#2a4a18'; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    }
  }

  // ground_high
  if (isLayerVisible('ground_high')) {
    // 当前编辑地块下层时，降低上层透明度，让下层可见
    const alpha = (currentLayer === 'ground_low') ? 0.3 : 1.0;
    ctx.globalAlpha = alpha;
    const cell = layerData['ground_high']?.[r]?.[c];
    if (cell && tilesetLoaded) {
      ctx.drawImage(tilesetImg, cell.sx, cell.sy, TS_PX, TS_PX, x, y, TILE_SIZE, TILE_SIZE);
    } else {
      const tid  = mapData[r][c];
      const type = TILE_TYPE_MAP[tid] || TILE_TYPE_MAP[0];
      ctx.fillStyle = type.color; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
      if (tid !== 0) {
        ctx.font = `${TILE_SIZE * 0.48}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(type.icon, x + TILE_SIZE / 2, y + TILE_SIZE / 2);
      }
    }
    ctx.globalAlpha = 1.0; // 重置透明度
  }

  // decor / overlay / above
  ['decor','overlay','above'].forEach(lid => {
    if (!isLayerVisible(lid)) return;
    const cell = layerData[lid]?.[r]?.[c];
    if (cell && tilesetLoaded)
      ctx.drawImage(tilesetImg, cell.sx, cell.sy, TS_PX, TS_PX, x, y, TILE_SIZE, TILE_SIZE);
  });

  // block
  if (isLayerVisible('block') && blockData[r]?.[c]) {
    ctx.fillStyle = 'rgba(255,40,40,0.28)'; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    ctx.font = `${TILE_SIZE * 0.3}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🚫', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const showGrid = document.getElementById('show-grid')?.checked !== false;
  for (let r = 0; r < MAP_ROWS; r++) for (let c = 0; c < MAP_COLS; c++) drawCell(r, c);
  // 网格
  if (showGrid) {
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.5;
    for (let r = 0; r < MAP_ROWS; r++)
      for (let c = 0; c < MAP_COLS; c++)
        ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
  }
  // 当前层高亮悬停
  const allL  = [...LAYERS, BLOCK_DEF];
  const curL  = allL.find(l => l.id === currentLayer);
  if (hoverR >= 0 && hoverC >= 0 && hoverR < MAP_ROWS && hoverC < MAP_COLS) {
    const x = hoverC * TILE_SIZE, y = hoverR * TILE_SIZE;
    if (curL) { ctx.fillStyle = curL.color; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE); }
    ctx.strokeStyle = 'rgba(255,220,60,0.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
  }
}

// ═══════════════════════════════════════════════
// 绘制操作
// ═══════════════════════════════════════════════
let currentTool = 'paint', isDrawing = false;

function paintCell(r, c) {
  if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) return;
  if (currentLayer === 'block') { blockData[r][c] = 1; return; }
  const lid = currentLayer;
  if (!layerData[lid]) return;
  if (useTilesetMode && selectedTile) {
    if (lid === 'ground_high') mapData[r][c] = 0;
    layerData[lid][r][c] = { sx: selectedTile.sx, sy: selectedTile.sy };
  } else if (lid === 'ground_high') {
    mapData[r][c] = selectedTypeId;
    layerData[lid][r][c] = null;
    if ([4,5,6,7,9].includes(selectedTypeId)) blockData[r][c] = 1;
  }
}

function eraseCell(r, c) {
  if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) return;
  if (currentLayer === 'block') { blockData[r][c] = 0; return; }
  const lid = currentLayer;
  if (!layerData[lid]) return;
  layerData[lid][r][c] = null;
  if (lid === 'ground_high') mapData[r][c] = 0;
}

function floodFill(sr, sc) {
  if (sr < 0 || sr >= MAP_ROWS || sc < 0 || sc >= MAP_COLS) return;
  const lid = currentLayer; if (lid === 'block') return;
  const oldT = mapData[sr][sc];
  const oldC = JSON.stringify(layerData[lid]?.[sr]?.[sc]);
  const queue = [[sr, sc]], visited = new Set();
  while (queue.length) {
    const [r, c] = queue.shift(); const key = r * 1000 + c;
    if (visited.has(key) || r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) continue;
    if (mapData[r][c] !== oldT || JSON.stringify(layerData[lid]?.[r]?.[c]) !== oldC) continue;
    visited.add(key); paintCell(r, c);
    queue.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
}

function applyTool(r, c, btn = 0) {
  if (btn === 2 || currentTool === 'erase') { eraseCell(r, c); return; }
  if (currentTool === 'fill') { floodFill(r, c); return; }
  paintCell(r, c);
}

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  return { r: Math.floor((e.clientY - rect.top) * sy / TILE_SIZE),
           c: Math.floor((e.clientX - rect.left) * sx / TILE_SIZE) };
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault(); isDrawing = true;
  const {r, c} = getCell(e); applyTool(r, c, e.button); draw(); setStatus(`(${c},${r})`);
});
canvas.addEventListener('mousemove', e => {
  const {r, c} = getCell(e); hoverR = r; hoverC = c;
  document.getElementById('ci-pos').textContent = `(${c},${r})`;
  const tid = (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) ? mapData[r][c] : -1;
  document.getElementById('ci-type').textContent = tid >= 0 ? (TILE_TYPE_MAP[tid]?.name || '?') : '-';
  if (isDrawing) { if (e.buttons === 1) applyTool(r,c,0); else if (e.buttons === 2) eraseCell(r,c); }
  draw();
});
canvas.addEventListener('mouseup',    () => isDrawing = false);
canvas.addEventListener('mouseleave', () => { isDrawing = false; hoverR = -1; hoverC = -1; draw(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); const {r,c} = getCell(e.touches[0]); applyTool(r,c,0); draw();
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); const {r,c} = getCell(e.touches[0]);
  if (currentTool === 'erase') eraseCell(r,c); else paintCell(r,c); draw();
}, { passive:false });

function setTool(t) {
  currentTool = t;
  ['paint','fill','erase'].forEach(x => document.getElementById(`tool-${x}`)?.classList.toggle('active', x === t));
}

// ═══════════════════════════════════════════════
// 地图操作
// ═══════════════════════════════════════════════
function fillAll()   { for(let r=0;r<MAP_ROWS;r++) for(let c=0;c<MAP_COLS;c++) paintCell(r,c); draw(); setStatus('全填完成'); }
function clearLayer() {
  if (!confirm('清空当前层？')) return;
  if (currentLayer === 'block') { for(let r=0;r<MAP_ROWS;r++) blockData[r].fill(0); }
  else {
    const lid = currentLayer;
    for(let r=0;r<MAP_ROWS;r++) {
      layerData[lid][r].fill(null);
      if (lid === 'ground_high') mapData[r].fill(0);
    }
  }
  draw(); setStatus('已清空当前层');
}

function resizeMap() {
  const cols = parseInt(document.getElementById('inp-cols').value);
  const rows = parseInt(document.getElementById('inp-rows').value);
  if (cols < 5 || rows < 5 || cols > 60 || rows > 60) { alert('范围5-60'); return; }
  const oMap = mapData.map(r=>[...r]), oBlock = blockData.map(r=>[...r]);
  const oL   = {}; LAYERS.forEach(l => { oL[l.id] = layerData[l.id].map(r=>[...r]); });
  initMap(cols, rows);
  for(let r=0;r<Math.min(rows,oMap.length);r++) {
    for(let c=0;c<Math.min(cols,(oMap[r]||[]).length);c++) {
      mapData[r][c]   = oMap[r][c];
      blockData[r][c] = (oBlock[r]||[])[c] || 0;
      LAYERS.forEach(l => { layerData[l.id][r][c] = (oL[l.id]?.[r]||[])[c] || null; });
    }
  }
  resizeCanvas(); draw(); setStatus(`地图 ${cols}×${rows}`);
}

function changeTileSize() {
  TILE_SIZE = parseInt(document.getElementById('tile-size-sel').value);
  resizeCanvas(); draw();
}

// ═══════════════════════════════════════════════
// 导出 / 导入（不含图集配置）
// ═══════════════════════════════════════════════
function getMapSnapshot() {
  const d = {
    cols:    MAP_COLS, rows: MAP_ROWS,
    tiles:   mapData.map(r=>[...r]),
    blocked: blockData.map(r=>[...r]),
    layers:  {}
  };
  LAYERS.forEach(l => {
    d.layers[l.id] = layerData[l.id].map(r => r.map(c => c ? { sx:c.sx, sy:c.sy } : null));
  });
  return d;
}

function applyMapSnapshot(d) {
  MAP_COLS  = d.cols; MAP_ROWS = d.rows;
  mapData   = d.tiles.map(r=>[...r]);
  blockData = d.blocked ? d.blocked.map(r=>[...r]) : mapData.map(r => r.map(t => [4,5,6,7,9].includes(t)?1:0));
  layerData = {};
  LAYERS.forEach(l => {
    layerData[l.id] = d.layers?.[l.id]
      ? d.layers[l.id].map(r => r.map(c => c))
      : mapData.map(r => new Array(r.length).fill(null));
  });
  document.getElementById('inp-cols').value = MAP_COLS;
  document.getElementById('inp-rows').value = MAP_ROWS;
  resizeCanvas(); draw();
}

function exportMap() {
  document.getElementById('export-text').value = JSON.stringify(getMapSnapshot(), null, 2);
  document.getElementById('export-modal').classList.add('show');
}
function importMap() {
  const raw = prompt('粘贴地图JSON:'); if (!raw) return;
  try {
    applyMapSnapshot(JSON.parse(raw));
    setStatus(`已导入 ${MAP_COLS}×${MAP_ROWS}`);
  } catch(e) { alert('JSON 格式错误：' + e.message); }
}
function copyExport()     { const ta = document.getElementById('export-text'); ta.select(); document.execCommand('copy'); setStatus('已复制 ✅'); }
function downloadExport() {
  const blob = new Blob([document.getElementById('export-text').value], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `farm_map_${MAP_COLS}x${MAP_ROWS}.json`; a.click();
}

// ═══════════════════════════════════════════════
// 存档系统（localStorage key = farm_map_saves）
// 存档内容：tiles/blocked/layers/cols/rows（不含图集配置）
// ═══════════════════════════════════════════════
const SAVES_KEY = 'farm_map_saves';

function getSaves()       { try { return JSON.parse(localStorage.getItem(SAVES_KEY) || '{}'); } catch(e) { return {}; } }
function putSaves(data)   { try { localStorage.setItem(SAVES_KEY, JSON.stringify(data)); } catch(e) {} }

function saveNewMap() {
  const name = document.getElementById('save-name').value.trim();
  if (!name) { alert('请输入地图名称'); return; }
  const saves = getSaves();
  const key   = `map_${Date.now()}`;
  saves[key]  = { name, savedAt: new Date().toLocaleString('zh-CN'), data: getMapSnapshot() };
  putSaves(saves);
  renderSaveList();
  setStatus(`已保存「${name}」`);
}

function loadSave(key) {
  const saves = getSaves(); const save = saves[key]; if (!save) return;
  if (!confirm(`载入「${save.name}」？当前未保存的内容会丢失。`)) return;
  applyMapSnapshot(save.data);
  document.getElementById('save-name').value = save.name;
  closeModal('save-modal');
  setStatus(`已载入「${save.name}」`);
}

function overwriteSave(key) {
  const saves = getSaves(); const save = saves[key]; if (!save) return;
  if (!confirm(`覆盖存档「${save.name}」？`)) return;
  save.data    = getMapSnapshot();
  save.savedAt = new Date().toLocaleString('zh-CN');
  putSaves(saves);
  renderSaveList();
  setStatus(`已覆盖「${save.name}」`);
}

function copySave(key) {
  const saves = getSaves(); const save = saves[key]; if (!save) return;
  const newKey  = `map_${Date.now()}`;
  saves[newKey] = {
    name:    save.name + '_副本',
    savedAt: new Date().toLocaleString('zh-CN'),
    data:    JSON.parse(JSON.stringify(save.data))
  };
  putSaves(saves);
  renderSaveList();
  setStatus(`已复制「${saves[newKey].name}」`);
}

function deleteSave(key) {
  const saves = getSaves();
  const name  = saves[key]?.name || key;
  if (!confirm(`删除存档「${name}」？`)) return;
  delete saves[key]; putSaves(saves);
  renderSaveList(); setStatus(`已删除「${name}」`);
}

function renderSaveList() {
  const wrap = document.getElementById('save-list'); if (!wrap) return;
  const saves = getSaves();
  const keys  = Object.keys(saves).reverse();
  if (!keys.length) {
    wrap.innerHTML = '<div style="color:#607040;font-size:11px;padding:8px 0;">暂无存档</div>';
    return;
  }
  wrap.innerHTML = '';
  keys.forEach(key => {
    const s   = saves[key];
    const row = document.createElement('div');
    row.className = 'save-row';
    row.innerHTML = `
      <div class="save-info">
        <div class="save-name-text">${escH(s.name)}</div>
        <div class="save-meta">${s.savedAt} &nbsp; ${s.data.cols}×${s.data.rows}</div>
      </div>
      <div class="save-btns">
        <button class="btn btn-blue"   onclick="loadSave('${key}')">📂 载入</button>
        <button class="btn btn-orange" onclick="overwriteSave('${key}')">⬇ 覆盖</button>
        <button class="btn btn-teal"   onclick="copySave('${key}')">📋 复制</button>
        <button class="btn btn-red"    onclick="deleteSave('${key}')">🗑</button>
      </div>`;
    wrap.appendChild(row);
  });
}

function showSavePanel() { renderSaveList(); document.getElementById('save-modal').classList.add('show'); }

// ═══════════════════════════════════════════════
// 通用
// ═══════════════════════════════════════════════
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ── 键盘关闭弹窗 ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-bg.show').forEach(m => m.classList.remove('show'));
  }
});

// ── Enter 确认 ──
document.getElementById('ap-name').addEventListener('keydown', e => { if(e.key==='Enter') confirmAddParent(); });
document.getElementById('ac-name').addEventListener('keydown', e => { if(e.key==='Enter') confirmAddChild(); });
document.getElementById('rename-input').addEventListener('keydown', e => { if(e.key==='Enter') confirmRenameItem(); });

// ═══════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════
loadTilesetConfig();   // ← 先加载图集配置（全局持久化）
initMap(18, 14);
resizeCanvas();
buildLayerSwitcher();
buildVisList();
buildTypeList();
rebuildGroupTree();
draw();
setStatus('就绪 — 选择图集素材或地块类型，点击地图绘制');
</script>
