<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃源农场 - 地图编辑器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a2a1a; color:#e8e0c8;
  font-family:'STKaiti','KaiTi',sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}

/* 顶栏 */
#topbar {
  background:#2a3a1a; border-bottom:1px solid #4a6a2a;
  padding:8px 12px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
#topbar h1 { font-size:15px; color:#c8e080; margin-right:8px; }
.btn {
  padding:5px 12px; border-radius:6px; border:none; cursor:pointer;
  font-size:12px; font-family:inherit;
}
.btn-green  { background:#4a8a2a; color:#e0f0a0; }
.btn-blue   { background:#2a5a8a; color:#a0d0f0; }
.btn-orange { background:#8a5a1a; color:#f0d0a0; }
.btn-red    { background:#7a2a1a; color:#f0a090; }
.btn:hover { opacity:0.85; }

/* 主体 */
#main {
  display:flex; flex:1; overflow:hidden;
}

/* 左侧面板 */
#sidebar {
  width:200px; background:#243018; border-right:1px solid #3a5020;
  overflow-y:auto; padding:8px;
  flex-shrink:0;
}
#sidebar h2 { font-size:12px; color:#a0c060; margin:8px 0 4px; }
.tile-btn {
  display:flex; align-items:center; gap:6px;
  padding:6px 8px; border-radius:6px; cursor:pointer;
  font-size:13px; margin-bottom:3px;
  background:#1a2810; border:2px solid transparent;
  transition: border-color 0.15s;
}
.tile-btn:hover { background:#2a3818; }
.tile-btn.active { border-color:#a0e040; background:#2a3818; }
.tile-color {
  width:20px; height:20px; border-radius:3px;
  border:1px solid rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0;
}

/* 图层控制 */
#layer-ctrl {
  margin-top:12px;
}
.layer-item {
  display:flex; align-items:center; gap:6px;
  padding:4px 6px; font-size:12px; cursor:pointer;
}
.layer-item input { cursor:pointer; }

/* 信息栏 */
#coord-info {
  margin-top:12px; padding:6px;
  background:#1a2810; border-radius:6px;
  font-size:11px; color:#80a050; line-height:1.8;
}

/* 地图区域 */
#map-wrap {
  flex:1; overflow:auto; position:relative;
  background:#111;
}
#map-canvas {
  display:block; cursor:crosshair;
  image-rendering: pixelated;
}

/* 底栏 */
#bottombar {
  background:#2a3a1a; border-top:1px solid #4a6a2a;
  padding:6px 12px; display:flex; align-items:center; gap:10px;
  font-size:12px; flex-wrap:wrap;
}
#status { color:#80a050; }

/* 导出弹窗 */
#export-modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.7); z-index:100;
  align-items:center; justify-content:center;
}
#export-modal.show { display:flex; }
.modal-box {
  background:#2a3a1a; border:1px solid #4a6a2a;
  border-radius:10px; padding:16px; width:90%; max-width:500px;
}
.modal-box h3 { color:#c8e080; margin-bottom:10px; font-size:14px; }
.modal-box textarea {
  width:100%; height:150px; background:#1a2810; color:#c8e080;
  border:1px solid #4a6a2a; border-radius:6px; padding:8px;
  font-size:11px; font-family:monospace; resize:none;
}
.modal-btns { display:flex; gap:8px; margin-top:10px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>🗺️ 地图编辑器</h1>
  <button class="btn btn-green" onclick="exportMap()">📤 导出地图</button>
  <button class="btn btn-blue"  onclick="importMap()">📥 导入地图</button>
  <button class="btn btn-orange" onclick="fillAll()">🖌️ 全填</button>
  <button class="btn btn-red"   onclick="clearMap()">🗑️ 清空</button>
  <span style="font-size:11px; color:#80a050;">地图: <span id="map-size-label">18×14</span></span>
  <label style="font-size:11px; color:#80a050;">
    列: <input id="inp-cols" type="number" value="18" min="5" max="40"
      style="width:44px;background:#1a2810;color:#c8e080;border:1px solid #4a6a2a;border-radius:4px;padding:2px 4px;font-size:11px;">
  </label>
  <label style="font-size:11px; color:#80a050;">
    行: <input id="inp-rows" type="number" value="14" min="5" max="40"
      style="width:44px;background:#1a2810;color:#c8e080;border:1px solid #4a6a2a;padding:2px 4px;font-size:11px;border-radius:4px;">
  </label>
  <button class="btn btn-green" onclick="resizeMap()">↩ 调整</button>
</div>

<div id="main">
  <!-- 左侧地块选择 -->
  <div id="sidebar">
    <h2>🎨 地块类型</h2>
    <div id="tile-list"></div>

    <h2 style="margin-top:12px;">🖌️ 工具</h2>
    <div class="tile-btn" id="tool-paint" onclick="setTool('paint')" style="border-color:#a0e040;">
      <div class="tile-color">✏️</div> 画笔
    </div>
    <div class="tile-btn" id="tool-fill" onclick="setTool('fill')">
      <div class="tile-color">🪣</div> 填充
    </div>
    <div class="tile-btn" id="tool-erase" onclick="setTool('erase')">
      <div class="tile-color">🧹</div> 橡皮
    </div>

    <div id="coord-info">
      鼠标位置：<span id="ci-pos">-</span><br>
      当前地块：<span id="ci-type">-</span><br>
      画笔：<span id="ci-brush">草地</span>
    </div>
  </div>

  <!-- 地图画布 -->
  <div id="map-wrap">
    <canvas id="map-canvas"></canvas>
  </div>
</div>

<div id="bottombar">
  <span id="status">就绪</span>
  <span style="margin-left:auto; color:#607040; font-size:11px;">
    点击绘制 · 拖拽连续绘制 · 右键清除
  </span>
</div>

<!-- 导出弹窗 -->
<div id="export-modal">
  <div class="modal-box">
    <h3>📤 导出地图数据</h3>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-btns">
      <button class="btn btn-green" onclick="copyExport()">📋 复制</button>
      <button class="btn btn-blue"  onclick="downloadExport()">💾 下载</button>
      <button class="btn btn-red"   onclick="closeExport()">✕ 关闭</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 地块定义
// ============================================================
const TILES = [
  { id:0, name:'草地',   color:'#5aaa3a', icon:'🌿' },
  { id:1, name:'泥土',   color:'#c8945a', icon:'🟫' },
  { id:2, name:'耕地',   color:'#7a4a22', icon:'🌱' },
  { id:8, name:'小路',   color:'#d4b870', icon:'🟨' },
  { id:9, name:'水域',   color:'#5ab8e8', icon:'💧' },
  { id:7, name:'树木',   color:'#2a7a1a', icon:'🌳' },
  { id:4, name:'房屋',   color:'#8a6030', icon:'🏠' },
  { id:5, name:'水井',   color:'#6a7a4a', icon:'🪣' },
  { id:6, name:'商店',   color:'#7a5a2a', icon:'🏪' },
];

const TILE_MAP = {};
TILES.forEach(t => TILE_MAP[t.id] = t);

// ============================================================
// 地图状态
// ============================================================
let MAP_COLS = 18, MAP_ROWS = 14;
let mapData = [];
let selectedTile = 0;
let currentTool = 'paint';
let TILE_SIZE = 40; // 编辑器显示用

function initMap(cols, rows, fill=0) {
  MAP_COLS = cols; MAP_ROWS = rows;
  mapData = [];
  for(let r=0; r<rows; r++) {
    mapData[r] = new Array(cols).fill(fill);
  }
  // 预设一些默认地形（和游戏一致）
  if(cols===18 && rows===14) applyDefaultTerrain();
}

function applyDefaultTerrain() {
  // 小路
  for(let c=3;c<15;c++) mapData[MAP_ROWS-1][c]=8;
  for(let r=4;r<MAP_ROWS;r++) mapData[r][8]=8;
  // 建筑
  mapData[2][3]=4; mapData[2][13]=6; mapData[5][14]=5;
  // 水塘
  [[1,7],[1,8],[1,9],[2,7],[2,8]].forEach(([r,c])=>mapData[r][c]=9);
  // 树木
  [[0,0],[0,1],[0,16],[0,17],[1,0],[1,17],[12,0],[12,17],[13,0],[13,17],
   [0,5],[0,11],[3,1],[3,16]].forEach(([r,c])=>{
    if(r<MAP_ROWS && c<MAP_COLS) mapData[r][c]=7;
  });
}

// ============================================================
// 画布渲染
// ============================================================
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');

// tileset
const tilesetImg = new Image();
tilesetImg.src = 'https://weiyi330.github.io/squat-game/tileset.png';
let tilesetLoaded = false;
tilesetImg.onload = () => { tilesetLoaded = true; draw(); };
const TS = 16;
const GRASS_UV = { col:0, row:3 };

function resizeCanvas() {
  canvas.width  = MAP_COLS * TILE_SIZE;
  canvas.height = MAP_ROWS * TILE_SIZE;
  document.getElementById('map-size-label').textContent = `${MAP_COLS}×${MAP_ROWS}`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for(let r=0; r<MAP_ROWS; r++) {
    for(let c=0; c<MAP_COLS; c++) {
      const tid = mapData[r][c];
      const tile = TILE_MAP[tid] || TILE_MAP[0];
      const x = c * TILE_SIZE, y = r * TILE_SIZE;

      // 底色
      ctx.fillStyle = tile.color;
      ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

      // 草地用tileset贴图
      if(tid === 0 && tilesetLoaded) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(tilesetImg,
          GRASS_UV.col * TS, GRASS_UV.row * TS, TS, TS,
          x, y, TILE_SIZE, TILE_SIZE
        );
      }

      // 图标
      ctx.font = `${TILE_SIZE * 0.55}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if(tid !== 0) {
        ctx.fillText(tile.icon, x + TILE_SIZE/2, y + TILE_SIZE/2);
      }

      // 网格线
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
    }
  }

  // 高亮选中地块
  if(hoverR >= 0 && hoverC >= 0 && hoverR < MAP_ROWS && hoverC < MAP_COLS) {
    ctx.strokeStyle = 'rgba(255,220,60,0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(hoverC * TILE_SIZE, hoverR * TILE_SIZE, TILE_SIZE, TILE_SIZE);
  }
}

// ============================================================
// 鼠标交互
// ============================================================
let isDrawing = false;
let hoverR = -1, hoverC = -1;

function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = (e.clientX - rect.left) * scaleX;
  const py = (e.clientY - rect.top)  * scaleY;
  return {
    r: Math.floor(py / TILE_SIZE),
    c: Math.floor(px / TILE_SIZE),
  };
}

function paintCell(r, c, tileId) {
  if(r<0||r>=MAP_ROWS||c<0||c>=MAP_COLS) return;
  mapData[r][c] = tileId;
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  isDrawing = true;
  const {r,c} = getCell(e);
  if(e.button === 2) {
    paintCell(r,c,0); // 右键清除
  } else if(currentTool === 'fill') {
    floodFill(r, c, selectedTile);
  } else if(currentTool === 'erase') {
    paintCell(r,c,0);
  } else {
    paintCell(r,c,selectedTile);
  }
  draw(); setStatus(`绘制 (${c},${r})`);
});

canvas.addEventListener('mousemove', e => {
  const {r,c} = getCell(e);
  hoverR=r; hoverC=c;
  document.getElementById('ci-pos').textContent = `(${c}, ${r})`;
  const tid = (r>=0&&r<MAP_ROWS&&c>=0&&c<MAP_COLS) ? mapData[r][c] : -1;
  document.getElementById('ci-type').textContent = tid>=0 ? (TILE_MAP[tid]?.name||'?') : '-';

  if(isDrawing && e.buttons===1) {
    if(currentTool==='erase') paintCell(r,c,0);
    else if(currentTool==='paint') paintCell(r,c,selectedTile);
  } else if(isDrawing && e.buttons===2) {
    paintCell(r,c,0);
  }
  draw();
});

canvas.addEventListener('mouseup', () => { isDrawing=false; });
canvas.addEventListener('mouseleave', () => { isDrawing=false; hoverR=-1; hoverC=-1; draw(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// touch支持（手机）
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const {r,c} = getCell(t);
  if(currentTool==='fill') floodFill(r,c,selectedTile);
  else if(currentTool==='erase') paintCell(r,c,0);
  else paintCell(r,c,selectedTile);
  draw();
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const {r,c} = getCell(t);
  if(currentTool==='erase') paintCell(r,c,0);
  else if(currentTool==='paint') paintCell(r,c,selectedTile);
  draw();
}, {passive:false});

// ============================================================
// 填充工具
// ============================================================
function floodFill(startR, startC, newTile) {
  if(startR<0||startR>=MAP_ROWS||startC<0||startC>=MAP_COLS) return;
  const oldTile = mapData[startR][startC];
  if(oldTile === newTile) return;
  const queue = [[startR, startC]];
  const visited = new Set();
  while(queue.length) {
    const [r,c] = queue.shift();
    const key = r*1000+c;
    if(visited.has(key)) continue;
    if(r<0||r>=MAP_ROWS||c<0||c>=MAP_COLS) continue;
    if(mapData[r][c] !== oldTile) continue;
    visited.add(key);
    mapData[r][c] = newTile;
    queue.push([r-1,c],[r+1,c],[r,c-1],[r,c+1]);
  }
}

// ============================================================
// 地块选择面板
// ============================================================
function buildTileList() {
  const list = document.getElementById('tile-list');
  list.innerHTML = '';
  TILES.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tile-btn' + (t.id===selectedTile?' active':'');
    div.id = `tbtn-${t.id}`;
    div.innerHTML = `
      <div class="tile-color" style="background:${t.color}">${t.icon}</div>
      <span>${t.name}</span>
    `;
    div.onclick = () => selectTile(t.id);
    list.appendChild(div);
  });
}

function selectTile(id) {
  selectedTile = id;
  document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tbtn-${id}`)?.classList.add('active');
  document.getElementById('ci-brush').textContent = TILE_MAP[id]?.name || '?';
  setTool('paint'); // 选地块自动切换到画笔
}

function setTool(tool) {
  currentTool = tool;
  ['paint','fill','erase'].forEach(t => {
    const el = document.getElementById(`tool-${t}`);
    if(el) el.style.borderColor = t===tool ? '#a0e040' : 'transparent';
  });
}

// ============================================================
// 地图操作
// ============================================================
function fillAll() {
  for(let r=0;r<MAP_ROWS;r++)
    for(let c=0;c<MAP_COLS;c++)
      mapData[r][c] = selectedTile;
  draw(); setStatus('全图填充完成');
}

function clearMap() {
  if(!confirm('清空地图？')) return;
  for(let r=0;r<MAP_ROWS;r++) mapData[r].fill(0);
  draw(); setStatus('地图已清空');
}

function resizeMap() {
  const cols = parseInt(document.getElementById('inp-cols').value);
  const rows = parseInt(document.getElementById('inp-rows').value);
  if(cols<5||rows<5||cols>40||rows>40) { alert('尺寸范围 5-40'); return; }
  // 保留现有数据
  const old = mapData.map(r=>[...r]);
  initMap(cols, rows, 0);
  for(let r=0;r<Math.min(rows,old.length);r++)
    for(let c=0;c<Math.min(cols,(old[r]||[]).length);c++)
      mapData[r][c] = old[r][c];
  resizeCanvas(); draw();
  setStatus(`地图调整为 ${cols}×${rows}`);
}

// ============================================================
// 导入 / 导出
// ============================================================
function exportMap() {
  const data = {
    cols: MAP_COLS, rows: MAP_ROWS,
    tiles: mapData.map(row => [...row])
  };
  document.getElementById('export-text').value = JSON.stringify(data, null, 2);
  document.getElementById('export-modal').classList.add('show');
}

function importMap() {
  const raw = prompt('粘贴地图JSON数据：');
  if(!raw) return;
  try {
    const data = JSON.parse(raw);
    MAP_COLS = data.cols; MAP_ROWS = data.rows;
    mapData = data.tiles.map(r=>[...r]);
    document.getElementById('inp-cols').value = MAP_COLS;
    document.getElementById('inp-rows').value = MAP_ROWS;
    resizeCanvas(); draw();
    setStatus(`已导入 ${MAP_COLS}×${MAP_ROWS} 地图`);
  } catch(e) {
    alert('JSON格式错误：' + e.message);
  }
}

function copyExport() {
  const ta = document.getElementById('export-text');
  ta.select(); document.execCommand('copy');
  setStatus('已复制到剪贴板 ✅');
}

function downloadExport() {
  const blob = new Blob([document.getElementById('export-text').value], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `farm_map_${MAP_COLS}x${MAP_ROWS}.json`;
  a.click();
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('show');
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// ============================================================
// 初始化
// ============================================================
initMap(18, 14);
resizeCanvas();
buildTileList();
draw();
setStatus('地图编辑器已就绪 — 点击或拖拽绘制地块');
</script>
</body>
</html>
