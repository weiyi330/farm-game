<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#2d5228;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;}
h2{color:#f5d78e;font-family:serif;letter-spacing:3px;}
.row{display:flex;gap:40px;align-items:flex-end;}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;}
.label{color:#c8a060;font-size:13px;font-family:serif;}
img{image-rendering:pixelated;image-rendering:crisp-edges;}
</style></head><body>
<h2>🌾 像素农夫预览</h2>
<div class="row">
  <div class="item">
    <img src="assets/images/farmer_pixel32.png" width="128" height="192">
    <span class="label">32位像素</span>
  </div>
  <div class="item">
    <img src="assets/images/farmer_pixel32.png" width="64" height="96">
    <span class="label">游戏实际大小</span>
  </div>
  <div class="item">
    <img src="assets/images/farmer_pixel32.png" width="32" height="48">
    <span class="label">原始32px</span>
  </div>
</div>
<p style="color:#8a9060;font-size:12px">基于豆包AI图转换的像素风格</p>
</body></html>
