<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素农夫预览</title>
<style>
body { background:#3a6a30; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:serif; gap:24px; }
h2 { color:#f5d78e; letter-spacing:3px; font-size:18px; }
.row { display:flex; gap:40px; align-items:flex-end; }
.item { display:flex; flex-direction:column; align-items:center; gap:10px; }
.label { color:#c8d890; font-size:12px; letter-spacing:1px; }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; }
</style>
</head>
<body>
<h2>🌾 像素农夫 · 手绘版</h2>
<div class="row">
  <div class="item"><canvas id="c1" width="256" height="256"></canvas><span class="label">正面站立</span></div>
  <div class="item"><canvas id="c2" width="256" height="256"></canvas><span class="label">行走</span></div>
  <div class="item"><canvas id="c3" width="256" height="256"></canvas><span class="label">劳作</span></div>
  <div class="item"><canvas id="c4" width="128" height="128"></canvas><span class="label">游戏实际大小</span></div>
</div>
<script>
// 像素调色板（参考豆包农夫图）
const P = {
  // 草帽
  HAT1: '#e8c040',  // 帽顶亮
  HAT2: '#c8a020',  // 帽檐
  HAT3: '#a07810',  // 帽阴影
  // 脸/皮肤
  SKIN: '#f5c87a',  // 皮肤
  SKIN2:'#e0a850',  // 皮肤阴影
  // 眼鼻嘴
  EYE:  '#2a1a08',
  NOSE: '#d08060',
  BLUSH:'#f09080',
  // 衣服（绿色背带裤参考）
  SHIRT:'#f0e8c0',  // 白色上衣
  SHIRT2:'#d8d0a8', // 上衣阴影
  PANTS:'#5a8a40',  // 绿色裤子
  PANTS2:'#3a6a20', // 裤子阴影
  STRAP:'#c8922a',  // 背带（金色）
  // 鞋
  SHOE: '#7a4a10',
  SHOE2:'#5a3008',
  // 手
  HAND: '#f5c87a',
  // 工具
  TOOL: '#a07030',
  TOOL2:'#c89040',
  METAL:'#a0a8b0',
};

// 32x32 像素图（0=透明，用颜色key）
// 正面站立
const FRONT = [
  '....HHHHHHHHHH......',
  '...H2H2H2H2H2H2H....',
  '..H1H1H1H1H1H1H1H...',
  '..H2H2H2H2H2H2H2H...',
  '..H1..H1H1H1..H1H...',
  '...SSSSSSSSSSS.......',
  '..SSSSSSSSSSSSS......',
  '.SSSSSSSSSSSSSSS.....',
  '.SS.EE.SS.EE.SS......',
  '.SSSSSSSSSSSSSSS.....',
  '..SS.NS.NS.SS........',
  '..SSSMSSSSSSS........',
  '...SSSSSSSSSSS.......',
  '....SSSSSSSSS........',
  '..WSS.TTT.SSSW.......',
  '.WS.STTTTTTS.SW......',
  'WS..STTTTTTTS..SW....',
  'W...STTTTTTTS...W....',
  '....S2222222S........',
  '....S2PPPP2S.........',
  '....SPPPPPPPS........',
  '....SPPPBRPPS........',
  '....PPPP.PPPP........',
  '....PPP...PPP........',
  '....PP.....PP........',
  '....PP.....PP........',
  '....PP.....PP........',
  '....PP.....PP........',
  '...PPP.....PPP.......',
  '..OOPP.....PPOO......',
  '..OOO.......OOO......',
  '..OO.........OO......',
];

// 颜色映射
const CM = {
  'H': P.HAT1, 'h': P.HAT2, '2': P.HAT2,
  '1': P.HAT1, '3': P.HAT3,
  'S': P.SKIN, 's': P.SKIN2,
  'E': P.EYE,  'N': P.NOSE, 'M': P.BLUSH, 'B': P.BLUSH,
  'T': P.SHIRT,'t': P.SHIRT2,
  'P': P.PANTS,'p': P.PANTS2,
  'R': P.STRAP,
  'W': P.HAND,
  'O': P.SHOE, 'o': P.SHOE2,
  'L': P.TOOL, 'l': P.TOOL2,
  'X': P.METAL,
};

// 手工像素数据 - 32x32
// 行从上到下，每字符=1像素
// . = 透明
const FARMER_FRONT = [
//0         1         2         3
//0123456789012345678901234567890123
  '........HHHHHHHHHHHHHH..........',  // 0 帽子顶
  '.......H3333333333333H3H........',  // 1
  '......HH1111111111111HH1H.......',  // 2 帽子主体
  '......H11111111111111111H.......',  // 3
  '.....H3H3H3H3H3H3H3H3H3H3H.....',  // 4 帽檐
  '.....HHHHHHHHHHHHHHHHHHHHHH.....',  // 5
  '......SSSSSSSSSSSSSSSSSS........',  // 6 头部
  '.....SSSSSSSSSSSSSSSSSSSS.......',  // 7
  '....SSSSSSSSSSSSSSSSSSSSSS......',  // 8
  '....SS.EESS.....EESS.SS.........',  // 9 眼睛
  '....SS.EESS.....EESS.SS.........',  // 10
  '....SSSSSSSSSSSSSSSSSSSS........',  // 11
  '....SSSSS.NNNN.SSSSSSS..........',  // 12 鼻子
  '....SSSSSSSSSSSSSSSSSS..........',  // 13
  '....SSS.MSSSSSSSM.SSSS..........',  // 14 腮红
  '....SSSSSS.MM.SSSSSSSS..........',  // 15 嘴
  '.....SSSSSSSSSSSSSSSS...........',  // 16
  'WWWW.TTTTTTTTTTTTTT.WWWW........',  // 17 手臂+上衣
  'WWWW.TTTTTTTTTTTTTT.WWWW........',  // 18
  'WWWW.TTTTTTTTTTTTTT.WWWW........',  // 19
  '.....RRRTTTTTTTTRRR.............',  // 20 背带
  '.....TTTRRRRRRRRTTT.............',  // 21
  '.....PPPPPPPPPPPPPP.............',  // 22 裤子
  '.....PPPPPPPPPPPPPP.............',  // 23
  '.....PPPPPPPPPPPPPP.............',  // 24
  '.....PPPP.....PPPP..............',  // 25 裤腿分叉
  '.....PPPP.....PPPP..............',  // 26
  '.....PPPP.....PPPP..............',  // 27
  '.....PPPP.....PPPP..............',  // 28
  '.....PPPP.....PPPP..............',  // 29
  '....OOOOO.....OOOOO.............',  // 30 鞋
  '....OOOOO.....OOOOO.............',  // 31
];

const FARMER_WALK = [
  '........HHHHHHHHHHHHHH..........',
  '.......H3333333333333H3H........',
  '......HH1111111111111HH1H.......',
  '......H11111111111111111H.......',
  '.....H3H3H3H3H3H3H3H3H3H3H.....',
  '.....HHHHHHHHHHHHHHHHHHHHHH.....',
  '......SSSSSSSSSSSSSSSSSS........',
  '.....SSSSSSSSSSSSSSSSSSSS.......',
  '....SSSSSSSSSSSSSSSSSSSSSS......',
  '....SS.EESS.....EESS.SS.........',
  '....SS.EESS.....EESS.SS.........',
  '....SSSSSSSSSSSSSSSSSSSS........',
  '....SSSSS.NNNN.SSSSSSS..........',
  '....SSSSSSSSSSSSSSSSSS..........',
  '....SSS.MSSSSSSSM.SSSS..........',
  '....SSSSSS.MM.SSSSSSSS..........',
  '.....SSSSSSSSSSSSSSSS...........',
  '..WWW.TTTTTTTTTTTTTT.WWW........',
  'WWWW..TTTTTTTTTTTTTT..WWWW......',
  '.WWWW.TTTTTTTTTTTTTT.WWWW.......',
  '.....RRRTTTTTTTTRRR.............',
  '.....TTTRRRRRRRRTTT.............',
  '.....PPPPPPPPPPPPPP.............',
  '.....PPPPPPPPPPPPPP.............',
  '.....PPPPPPPPPPPPPP.............',
  '....PPPP......PPPPP.............',  // 走路腿开
  '...PPPP........PPPP.............',
  '..PPPP..........PPPP............',
  '..PPPP..........PPPP............',
  '.PPPPP..........PPPPP...........',
  '.OOOOO..........OOOOO...........',
  'OOOOOO..........OOOOOO..........',
];

function drawFarmer(canvasId, pixelData, scale) {
  const c = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const ps = scale; // 每像素的大小
  ctx.clearRect(0,0,c.width,c.height);

  pixelData.forEach((row, ry) => {
    for(let cx=0; cx<row.length; cx++) {
      const ch = row[cx];
      if(ch === '.') continue;
      const color = CM[ch];
      if(!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(cx*ps, ry*ps, ps, ps);
    }
  });
}

// 正面（8px per pixel → 32*8=256）
drawFarmer('c1', FARMER_FRONT, 8);
// 行走
drawFarmer('c2', FARMER_WALK, 8);
// 劳作（用正面加工具）
drawFarmer('c3', FARMER_FRONT, 8);
// 小图（4px per pixel → 32*4=128）
drawFarmer('c4', FARMER_FRONT, 4);

// 给c3加一个锄头
const c3 = document.getElementById('c3');
const ctx3 = c3.getContext('2d');
const ps = 8;
// 锄头柄
for(let i=0;i<8;i++){
  ctx3.fillStyle = P.TOOL;
  ctx3.fillRect((28+i)*ps, (17+i)*ps, ps, ps);
}
// 锄头金属部分
ctx3.fillStyle = P.METAL;
ctx3.fillRect(34*ps, 22*ps, ps*2, ps);
ctx3.fillRect(35*ps, 21*ps, ps, ps*3);

</script>
</body>
</html>
